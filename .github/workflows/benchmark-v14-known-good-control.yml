name: Benchmark v14 known-good environment control

on:
  push:
    branches:
      - perf/v14-full-optimization
    paths:
      - '.github/workflows/benchmark-v14-known-good-control.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  known-good:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NATIVE_ARTIFACT_ID: '9746240087'
      VERIFIED_YA_ARTIFACT_ID: '9738530154'
    steps:
      - uses: actions/checkout@v4
      - name: Assemble exact known-good native plus proven WebGL1
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kg/{downloads,native-artifact,native,ya-artifact,prod,out,browser-node}
          get_artifact() {
            curl -fL --retry 5 --retry-all-errors \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$1/zip" -o "$2"
          }
          get_artifact "$NATIVE_ARTIFACT_ID" /tmp/kg/downloads/native.zip
          get_artifact "$VERIFIED_YA_ARTIFACT_ID" /tmp/kg/downloads/ya.zip
          unzip -q /tmp/kg/downloads/native.zip -d /tmp/kg/native-artifact
          native_zip="$(find /tmp/kg/native-artifact -type f -name 'OpenTTD-YandexGames-Direct.zip' -print -quit)"
          test -s "$native_zip"
          unzip -q "$native_zip" -d /tmp/kg/native
          grep -Fq '__openttdDirtyRect' /tmp/kg/native/openttd-runtime.js
          ! grep -Fq '__openttdDirtyRects' /tmp/kg/native/openttd-runtime.js
          unzip -q /tmp/kg/downloads/ya.zip -d /tmp/kg/ya-artifact
          ya_zip="$(find /tmp/kg/ya-artifact -type f -name '*.zip' -print -quit)"
          test -s "$ya_zip"
          unzip -q "$ya_zip" -d /tmp/kg/prod
          cp /tmp/kg/native/openttd-runtime.js /tmp/kg/prod/openttd-runtime.js
          rm -f /tmp/kg/prod/openttd.wasm /tmp/kg/prod/openttd.data
          python3 ci/patch-v14-webgl-runtime-proven.py /tmp/kg/prod/openttd-runtime.js
          python3 ci/patch-v14-performance-package.py /tmp/kg/prod --platform yandex
          python3 yandex/neutralize_yandex_runtime.py /tmp/kg/prod
          node --check /tmp/kg/prod/openttd-runtime.js
          cat > /tmp/kg/prod/sdk.js <<'JS'
          (()=>{const d=Object.create(null),p={async getData(k){const o={};for(const x of(k||[]))if(Object.prototype.hasOwnProperty.call(d,x))o[x]=d[x];return o},async setData(v){Object.assign(d,v||{});return true},getMode(){return'full'},getUniqueID(){return'known-good'},getName(){return'Known Good'},isAuthorized(){return true}},y={environment:{i18n:{lang:'en'},app:{id:'known-good'}},features:{LoadingAPI:{ready(){return Promise.resolve(true)}},GameplayAPI:{start(){return Promise.resolve(true)},stop(){return Promise.resolve(true)}}},adv:{showFullscreenAdv({callbacks}={}){callbacks?.onOpen?.();callbacks?.onClose?.(true)}},leaderboards:{async getEntries(){return{entries:[]}},async setScore(){return true}},async getPlayer(){return p},isAvailableMethod(){return Promise.resolve(true)},on(){},off(){}};window.YaGames={async init(){return y}}})();
          JS
      - name: Install browser controller
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/kg/browser-node
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund puppeteer-core@24.16.0
          cp "$GITHUB_WORKSPACE/ci/v14-performance-browser.mjs" ./perf.mjs
          sed -i 's/timeout: 720000/timeout: 120000/' ./perf.mjs
      - name: Run exact known-good 4096x4096 plus 14-AI control
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          "$CHROME_BIN" --version
          cd /tmp/kg/prod
          python3 -m http.server 8193 --bind 127.0.0.1 >/tmp/kg-http.log 2>&1 & pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do curl -fsS http://127.0.0.1:8193/index.html >/dev/null && break; sleep 0.1; done
          cd /tmp/kg/browser-node
          node perf.mjs yandex http://127.0.0.1:8193/index.html /tmp/kg/out/known-good.json baseline
      - name: Upload control evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openttd-v14-known-good-environment-control
          compression-level: 0
          path: /tmp/kg/out/
          if-no-files-found: warn
