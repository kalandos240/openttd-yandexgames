name: Benchmark v14 known-good vs current native

on:
  push:
    branches:
      - perf/v14-full-optimization
    paths:
      - '.github/workflows/benchmark-v14-native-known-vs-current.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  compare-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: known-good
            artifact: '9746240087'
          - label: current-no-palette
            artifact: '9765267124'
    env:
      VERIFIED_YA_ARTIFACT_ID: '9738530154'
    steps:
      - uses: actions/checkout@v4
      - name: Assemble candidate
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_ARTIFACT_ID: ${{ matrix.artifact }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/native-ab
          mkdir -p "$ROOT"/{native-artifact,native,ya-artifact,prod,out,browser-node}
          get_artifact() {
            curl -fL --retry 5 --retry-all-errors \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$1/zip" -o "$2"
          }
          get_artifact "$NATIVE_ARTIFACT_ID" "$ROOT/native.zip"
          get_artifact "$VERIFIED_YA_ARTIFACT_ID" "$ROOT/ya.zip"
          unzip -q "$ROOT/native.zip" -d "$ROOT/native-artifact"
          native_zip="$(find "$ROOT/native-artifact" -type f -name 'OpenTTD-YandexGames-Direct.zip' -print -quit)"
          test -s "$native_zip"
          unzip -q "$native_zip" -d "$ROOT/native"
          grep -Fq '__openttdDirtyRect' "$ROOT/native/openttd-runtime.js"
          ! grep -Fq '__openttdDirtyRects' "$ROOT/native/openttd-runtime.js"
          unzip -q "$ROOT/ya.zip" -d "$ROOT/ya-artifact"
          ya_zip="$(find "$ROOT/ya-artifact" -type f -name '*.zip' -print -quit)"
          test -s "$ya_zip"
          unzip -q "$ya_zip" -d "$ROOT/prod"
          cp "$ROOT/native/openttd-runtime.js" "$ROOT/prod/openttd-runtime.js"
          rm -f "$ROOT/prod/openttd.wasm" "$ROOT/prod/openttd.data"
          python3 ci/patch-v14-webgl-runtime-proven.py "$ROOT/prod/openttd-runtime.js"
          python3 ci/patch-v14-performance-package.py "$ROOT/prod" --platform yandex
          python3 yandex/neutralize_yandex_runtime.py "$ROOT/prod"
          node --check "$ROOT/prod/openttd-runtime.js"
          cat > "$ROOT/prod/sdk.js" <<'JS'
          (()=>{const d=Object.create(null),p={async getData(k){const o={};for(const x of(k||[]))if(Object.prototype.hasOwnProperty.call(d,x))o[x]=d[x];return o},async setData(v){Object.assign(d,v||{});return true},getMode(){return'full'},getUniqueID(){return'native-ab'},getName(){return'Native AB'},isAuthorized(){return true}},y={environment:{i18n:{lang:'en'},app:{id:'native-ab'}},features:{LoadingAPI:{ready(){return Promise.resolve(true)}},GameplayAPI:{start(){return Promise.resolve(true)},stop(){return Promise.resolve(true)}}},adv:{showFullscreenAdv({callbacks}={}){callbacks?.onOpen?.();callbacks?.onClose?.(true)}},leaderboards:{async getEntries(){return{entries:[]}},async setScore(){return true}},async getPlayer(){return p},isAvailableMethod(){return Promise.resolve(true)},on(){},off(){}};window.YaGames={async init(){return y}}})();
          JS
      - name: Install browser controller
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/native-ab/browser-node
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund puppeteer-core@24.16.0
          cp "$GITHUB_WORKSPACE/ci/v14-performance-browser.mjs" ./perf.mjs
          node --check ./perf.mjs
          grep -Fq 'mainThreadProbeBlockedMs: mainThreadBlockedMs' ./perf.mjs
          grep -Fq "mapLog2 >= 12 ? 'during' : 'after'" ./perf.mjs
      - name: Run 4096x4096 plus 14-AI proven stress
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          "$CHROME_BIN" --version
          cd /tmp/native-ab/prod
          python3 -m http.server 8194 --bind 127.0.0.1 >/tmp/native-ab-http.log 2>&1 & pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do curl -fsS http://127.0.0.1:8194/index.html >/dev/null && break; sleep 0.1; done
          cd /tmp/native-ab/browser-node
          node perf.mjs yandex http://127.0.0.1:8194/index.html "/tmp/native-ab/out/${{ matrix.label }}.json" optimized 12 30000 during
      - name: Summarize
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib
          p=next(pathlib.Path('/tmp/native-ab/out').glob('*.json'), None)
          if not p: raise SystemExit('no benchmark json')
          d=json.loads(p.read_text())
          s=(d.get('ai14') or {}).get('snapshot') or {}
          print(json.dumps({
            'label':'${{ matrix.label }}','artifact':'${{ matrix.artifact }}','passed':d.get('passed'),
            'generationMs':(d.get('generation') or {}).get('wallMsUntilResponsive'),
            'blockedMs':(d.get('generation') or {}).get('mainThreadProbeBlockedMs'),
            'fps':s.get('estimatedFps'),'p95':s.get('p95FrameGapMs'),'p99':s.get('p99FrameGapMs'),
            'ai':d.get('aiScheduler'),'renderer':d.get('renderer')}, indent=2))
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openttd-v14-native-ab-${{ matrix.label }}
          compression-level: 0
          path: /tmp/native-ab/out/
          if-no-files-found: warn
