name: Benchmark v14 WebGL2 on proven native

on:
  push:
    branches:
      - perf/v14-full-optimization
    paths:
      - '.github/workflows/benchmark-v14-webgl2-stable-native.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  webgl2-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NATIVE_ARTIFACT_ID: '9746240087'
      VERIFIED_YA_ARTIFACT_ID: '9738530154'
    steps:
      - uses: actions/checkout@v4
      - name: Assemble WebGL2 candidate on proven native runtime
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/w2/{downloads,native-artifact,native,ya-artifact,prod,out,browser-node}
          get_artifact() {
            curl -fL --retry 5 --retry-all-errors -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/$1/zip" -o "$2"
          }
          get_artifact "$NATIVE_ARTIFACT_ID" /tmp/w2/downloads/native.zip
          get_artifact "$VERIFIED_YA_ARTIFACT_ID" /tmp/w2/downloads/ya.zip
          unzip -q /tmp/w2/downloads/native.zip -d /tmp/w2/native-artifact
          native_zip="$(find /tmp/w2/native-artifact -type f -name 'OpenTTD-YandexGames-Direct.zip' -print -quit)"
          test -s "$native_zip"
          unzip -q "$native_zip" -d /tmp/w2/native
          test -s /tmp/w2/native/openttd-runtime.js
          grep -Fq '__openttdDirtyRect' /tmp/w2/native/openttd-runtime.js
          grep -Fq '__openttdAIStats' /tmp/w2/native/openttd-runtime.js
          unzip -q /tmp/w2/downloads/ya.zip -d /tmp/w2/ya-artifact
          ya_zip="$(find /tmp/w2/ya-artifact -type f -name '*.zip' -print -quit)"
          unzip -q "$ya_zip" -d /tmp/w2/prod
          cp /tmp/w2/native/openttd-runtime.js /tmp/w2/prod/openttd-runtime.js
          rm -f /tmp/w2/prod/openttd.wasm /tmp/w2/prod/openttd.data
          python3 ci/patch-v14-webgl-runtime.py /tmp/w2/prod/openttd-runtime.js
          python3 ci/patch-v14-performance-package.py /tmp/w2/prod --platform yandex
          python3 yandex/neutralize_yandex_runtime.py /tmp/w2/prod
          node --check /tmp/w2/prod/openttd-runtime.js
          grep -Fq 'UNPACK_ROW_LENGTH' /tmp/w2/prod/openttd-runtime.js
          grep -Fq 'zeroCopyRectUploads' /tmp/w2/prod/openttd-runtime.js
          cat > /tmp/w2/prod/sdk.js <<'JS'
          (()=>{const d=Object.create(null),p={async getData(k){const o={};for(const x of(k||[]))if(Object.prototype.hasOwnProperty.call(d,x))o[x]=d[x];return o},async setData(v){Object.assign(d,v||{});return true},getMode(){return'full'},getUniqueID(){return'w2-stable'},getName(){return'W2 Stable'},isAuthorized(){return true}},y={environment:{i18n:{lang:'en'},app:{id:'w2-stable'}},features:{LoadingAPI:{ready(){return Promise.resolve(true)}},GameplayAPI:{start(){return Promise.resolve(true)},stop(){return Promise.resolve(true)}}},adv:{showFullscreenAdv({callbacks}={}){callbacks?.onOpen?.();callbacks?.onClose?.(true)}},leaderboards:{async getEntries(){return{entries:[]}},async setScore(){return true}},async getPlayer(){return p},isAvailableMethod(){return Promise.resolve(true)},on(){},off(){}};window.YaGames={async init(){return y}}})();
          JS
      - name: Install browser controller
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/w2/browser-node
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund puppeteer-core@24.16.0
          cp "$GITHUB_WORKSPACE/ci/v14-performance-browser.mjs" ./perf.mjs
          sed -i 's/timeout: 720000/timeout: 120000/' ./perf.mjs
      - name: Run WebGL2 4096x4096 plus 14-AI control
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          cd /tmp/w2/prod
          python3 -m http.server 8192 --bind 127.0.0.1 >/tmp/w2-http.log 2>&1 & pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do curl -fsS http://127.0.0.1:8192/index.html >/dev/null && break; sleep 0.1; done
          cd /tmp/w2/browser-node
          node perf.mjs yandex http://127.0.0.1:8192/index.html /tmp/w2/out/webgl2.json optimized
      - name: Summarize and gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s /tmp/w2/out/webgl2.json ]; then exit 1; fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/w2/out/webgl2.json').read_text())
          s=(d.get('ai14') or {}).get('snapshot') or {}
          u=(d.get('renderer') or {}).get('upload') or {}
          out={
            'passed':d.get('passed'),'failure':d.get('failure'),
            'generation4096Ms':(d.get('generation4096') or {}).get('wallMsUntilResponsive'),
            'estimatedFps':s.get('estimatedFps'),'p95FrameGapMs':s.get('p95FrameGapMs'),'p99FrameGapMs':s.get('p99FrameGapMs'),
            'longestLongTaskMs':s.get('longestLongTaskMs'),'wasmHeapBytes':s.get('wasmHeapBytes'),
            'aiScheduler':d.get('aiScheduler'),'renderer':d.get('renderer'),'bytesPerSecond':u.get('bytesUploaded',0)/30.0,
          }
          Path('/tmp/w2/out/WEBGL2-STABLE-NATIVE-SUMMARY.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          if not d.get('passed'): raise SystemExit('WebGL2 stable-native control failed')
          if (d.get('aiScheduler') or {}).get('activeAI') != 14: raise SystemExit('14 AI not active')
          PY
      - name: Upload WebGL2 control
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openttd-v14-webgl2-stable-native-control
          compression-level: 0
          path: /tmp/w2/out/
          if-no-files-found: warn
