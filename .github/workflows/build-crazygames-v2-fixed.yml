name: Build v14 CrazyGames split-runtime V2 fixed

on:
  push:
    branches:
      - port/crazygames-v2-split-runtime
    paths:
      - 'crazygames/build-v2-fixed.sh'
      - 'crazygames/patch-v28-package-v2.py'
      - 'crazygames/crazygames-bootstrap.js'
      - 'crazygames/crazygames-bridge.js'
      - '.github/workflows/build-crazygames-v2-fixed.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  V28_ARTIFACT_ID: '9960231016'

jobs:
  build-crazygames-v2-fixed:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: emscripten/emsdk:3.1.57

    steps:
      - name: Checkout CrazyGames branch
        uses: actions/checkout@v4

      - name: Checkout tested browser pipeline
        uses: actions/checkout@v4
        with:
          ref: fix/direct-file-launch
          path: legacy

      - name: Repair split-check mutation for legacy pipeline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('crazygames/build-v2-fixed.sh')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(
              r"old_checks = .*?"
              r"if old_checks not in s:\n"
              r"    raise SystemExit\('direct-file artifact checks missing'\)\n"
              r"s = s\.replace\(old_checks, new_checks, 1\)\n",
              re.S,
          )
          replacement = '''for old_line, new_line in (
              ("test ! -e dist/openttd.wasm", "test -s dist/openttd.wasm"),
              ("test ! -e dist/openttd.data", "test -s dist/openttd.data"),
          ):
              if old_line not in s:
                  raise SystemExit(f"split artifact assertion missing: {old_line}")
              s = s.replace(old_line, new_line, 1)
'''
          s2, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'Could not repair split-check mutation block, count={count}')
          p.write_text(s2, encoding='utf-8')
          PY
          bash -n crazygames/build-v2-fixed.sh

      - name: Build, validate and package CrazyGames V2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash crazygames/build-v2-fixed.sh

      - name: Upload tested CrazyGames V2
        uses: actions/upload-artifact@v4
        with:
          name: openttd-v14-crazygames-adaptive-desktop-mobile-v2-fixed
          path: |
            /tmp/out/OpenTTD-v14-CrazyGames-Adaptive-Desktop-Mobile-V2.zip
            /tmp/out/SHA256SUMS.txt
            /tmp/out/CRAZYGAMES-V2-SIZE.txt
            /tmp/out/CRAZYGAMES-V2-RESULTS.txt
          if-no-files-found: error
