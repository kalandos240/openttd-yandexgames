name: Build v14 CrazyGames split-runtime V2

on:
  push:
    branches:
      - port/crazygames-v2-split-runtime
    paths:
      - 'crazygames/**'
      - '.github/workflows/build-crazygames-v2-split-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  V28_ARTIFACT_ID: '9960231016'

jobs:
  build-crazygames-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: emscripten/emsdk:3.1.57

    steps:
      - name: Checkout CrazyGames V2 branch
        uses: actions/checkout@v4

      - name: Checkout tested browser pipeline
        uses: actions/checkout@v4
        with:
          ref: fix/direct-file-launch
          path: legacy

      - name: Wire verified V28 native stack into split Emscripten build
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'OpenTTDLab==0.0.75'

          cp playgama/patch-browser-ranking.py legacy/ci/patch-browser-ranking.py
          cp ci/patch-browser-vanilla-no-online-content.py legacy/ci/patch-browser-vanilla-no-online-content.py
          cp ci/patch-yandex-remove-external-ui.py legacy/ci/patch-yandex-remove-external-ui.py
          cp ci/patch-yandex-mobile-native.py legacy/ci/patch-yandex-mobile-native.py
          cp ci/patch-yandex-mobile-touch-behavior-v8.py legacy/ci/patch-yandex-mobile-touch-behavior-v8.py
          cp ci/patch-yandex-adaptive-native-v9.py legacy/ci/patch-yandex-adaptive-native-v9.py
          cp ci/patch-yandex-adaptive-native-v22.py legacy/ci/patch-yandex-adaptive-native-v22.py
          cp ci/patch-yandex-adaptive-native-v27.py legacy/ci/patch-yandex-adaptive-native-v27.py

          python3 - <<'PY'
          from pathlib import Path

          p = Path('legacy/ci/build-yandex-release.sh')
          s = p.read_text(encoding='utf-8')

          ai = "    'python3 ci/patch-yandex-ai-offline.py\\n'\n"
          if s.count(ai) != 1:
              raise SystemExit(f'AI-disable hook count={s.count(ai)}')
          s = s.replace(ai, '', 1)

          help_anchor = "    'python3 ci/patch-yandex-no-help.py\\n'\n"
          if s.count(help_anchor) != 1:
              raise SystemExit('Help patch anchor missing')
          native_hooks = (
              help_anchor
              + "    'python3 ci/patch-yandex-remove-external-ui.py\\n'\n"
              + "    'python3 ci/patch-yandex-mobile-native.py\\n'\n"
              + "    'python3 ci/patch-yandex-mobile-touch-behavior-v8.py\\n'\n"
              + "    'python3 ci/patch-yandex-adaptive-native-v9.py\\n'\n"
              + "    'python3 ci/patch-yandex-adaptive-native-v22.py\\n'\n"
              + "    'python3 ci/patch-yandex-adaptive-native-v27.py\\n'\n"
          )
          s = s.replace(help_anchor, native_hooks, 1)

          anchor = "    'python3 ci/patch-yandex-runtime-cleanup.py source\\n'\n"
          if s.count(anchor) != 1:
              raise SystemExit('runtime cleanup anchor missing')
          add = (
              "    'python3 ci/patch-browser-vanilla-no-online-content.py\\n'\n"
              "    'python3 ci/patch-browser-ranking.py\\n'\n"
          )
          s = s.replace(anchor, anchor + add, 1)
          p.write_text(s, encoding='utf-8')

          b = Path('legacy/ci/build-final.sh')
          t = b.read_text(encoding='utf-8')
          font_anchor = 'mkdir -p openttd/build/yandex_baseset /tmp/ottd-assets\n'
          font_repl = (
              font_anchor
              + 'cp openttd/media/baseset/OpenTTD-Sans.ttf openttd/media/baseset/OpenTTD-Small.ttf '
              + 'openttd/media/baseset/OpenTTD-Serif.ttf openttd/media/baseset/OpenTTD-Mono.ttf '
              + 'openttd/build/yandex_baseset/\n'
          )
          if t.count(font_anchor) != 1:
              raise SystemExit('font staging anchor missing')
          b.write_text(t.replace(font_anchor, font_repl, 1), encoding='utf-8')
          PY

          # Retain the proven 64 MiB/browser profile and remove the obsolete AI sanitizer.
          python3 playgama/patch-browser-build-performance.py legacy/ci/build-final.sh

          # Convert the tested direct-file pipeline back to a normal split Emscripten
          # delivery. Keep WebAudio, but keep rendered music outside openttd.data so
          # tracks are fetched only when actually played.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('legacy/ci/build-direct-file.sh')
          s = p.read_text(encoding='utf-8')

          old = "s = s.replace('--preload-file', '--embed-file')"
          if old not in s:
              raise SystemExit('embed-file mutation missing')
          s = s.replace(old, "pass  # CrazyGames V2 keeps --preload-file", 1)

          old = "single_file = '    target_link_libraries(WASM::WASM INTERFACE \"-s SINGLE_FILE=1\")\\n'"
          if old not in s:
              raise SystemExit('SINGLE_FILE mutation missing')
          s = s.replace(old, "single_file = ''  # CrazyGames V2: split JS/WASM/DATA", 1)

          for line in (
              "s = s.replace('cp openttd/build/openttd.wasm dist/\\n', '')\n",
              "s = s.replace('cp openttd/build/openttd.data dist/\\n', '')\n",
          ):
              if line not in s:
                  raise SystemExit('split file removal mutation missing')
              s = s.replace(line, '', 1)

          old_checks = """checks = '''test -f dist/index.html\\ntest ! -e dist/openttd.wasm\\ntest ! -e dist/openttd.data\\n\\n'''"""
          new_checks = """checks = '''test -f dist/index.html\\ntest -s dist/openttd.wasm\\ntest -s dist/openttd.data\\n\\n'''"""
          if old_checks not in s:
              raise SystemExit('direct-file artifact checks missing')
          s = s.replace(old_checks, new_checks, 1)

          # Keep music outside the preload package. The browser Audio element fetches
          # only the current track instead of downloading the whole soundtrack before play.
          old_path = '    return "/baseset/" + filename + ".mp3";'
          new_path = '    return "music/" + filename + ".mp3";'
          if old_path not in s:
              raise SystemExit('WebAudio music path missing')
          s = s.replace(old_path, new_path, 1)

          begin = s.find('        let data;\n')
          end = s.find('        const audio = new Audio();\n', begin)
          if begin < 0 or end < 0:
              raise SystemExit('embedded WebAudio file-read block missing')
          s = s[:begin] + s[end:]
          old_audio = '        audio.preload = "auto";\n        audio.src = state.url;'
          new_audio = '        audio.preload = "none";\n        audio.src = path;'
          if old_audio not in s:
              raise SystemExit('WebAudio blob source block missing')
          s = s.replace(old_audio, new_audio, 1)

          old_mkdir = 'mkdir -p /tmp/openmsx-render/src /tmp/openmsx-render/wav /tmp/fs-home'
          new_mkdir = 'mkdir -p /tmp/openmsx-render/src /tmp/openmsx-render/wav /tmp/openmsx-render/mp3 /tmp/fs-home'
          if old_mkdir not in s:
              raise SystemExit('OpenMSX render mkdir missing')
          s = s.replace(old_mkdir, new_mkdir, 1)

          old_mp3 = 'mp3="openttd/build/yandex_baseset/${stem}.mp3"'
          new_mp3 = 'mp3="/tmp/openmsx-render/mp3/${stem}.mp3"'
          if old_mp3 not in s:
              raise SystemExit('OpenMSX MP3 output missing')
          s = s.replace(old_mp3, new_mp3, 1)

          # patch-browser-build-performance.py appends SINGLE_FILE-only assertions.
          marker = '# Validate the effective SINGLE_FILE delivery, not an optional intermediate .js.'
          pos = s.find(marker)
          if pos >= 0:
              s = s[:pos] + '''# Validate CrazyGames V2 split delivery.\n\
          test -s dist/openttd-runtime.js\n\
          test -s dist/openttd.wasm\n\
          test -s dist/openttd.data\n\
          test -s openttd/build/openttd.wasm\n\
          test -s openttd/build/openttd.data\n'''

          p.write_text(s, encoding='utf-8')
          PY

          python3 -m py_compile \
            legacy/ci/patch-browser-vanilla-no-online-content.py \
            legacy/ci/patch-yandex-remove-external-ui.py \
            legacy/ci/patch-yandex-mobile-native.py \
            legacy/ci/patch-yandex-mobile-touch-behavior-v8.py \
            legacy/ci/patch-yandex-adaptive-native-v9.py \
            legacy/ci/patch-yandex-adaptive-native-v22.py \
            legacy/ci/patch-yandex-adaptive-native-v27.py \
            crazygames/patch-v28-package-v2.py
          bash -n legacy/ci/build-direct-file.sh

      - name: Build split OpenTTD 15.3 runtime
        working-directory: legacy
        shell: bash
        run: |
          set -euo pipefail
          bash ci/build-yandex-release.sh

          test -s dist/openttd-runtime.js
          test -s dist/openttd.wasm
          test -s dist/openttd.data
          test "$(stat -c%s dist/openttd-runtime.js)" -lt 5000000
          test "$(stat -c%s dist/openttd.wasm)" -gt 1000000
          test "$(stat -c%s dist/openttd.data)" -gt 1000000
          ! grep -Fq 'data:application/octet-stream;base64,' dist/openttd-runtime.js
          ! grep -Fq 'SINGLE_FILE=1' openttd/CMakeLists.txt

          grep -Fq '_em_openttd_set_touch_ui' dist/openttd-runtime.js
          grep -Fq '_em_openttd_touch_context' dist/openttd-runtime.js
          grep -Fq '_em_openttd_touch_pan' dist/openttd-runtime.js
          grep -Fq '_em_openttd_touch_mouse_event' dist/openttd-runtime.js
          grep -Fq '_em_openttd_force_window_resize' dist/openttd-runtime.js
          grep -Fq '_em_openttd_screen_width' dist/openttd-runtime.js
          grep -Fq '_em_openttd_screen_height' dist/openttd-runtime.js

          node --check dist/openttd-runtime.js
          echo '--- split runtime sizes ---'
          ls -lh dist/openttd-runtime.js dist/openttd.wasm dist/openttd.data
          echo '--- lazy music size ---'
          du -ch /tmp/openmsx-render/mp3/*.mp3 | tail -1

      - name: Download verified Yandex V28 package shell
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v28 /tmp/package /tmp/out
          mkdir -p /tmp/v28 /tmp/package /tmp/out
          curl -fL --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V28_ARTIFACT_ID}/zip" \
            -o /tmp/v28-artifact.zip
          unzip -q /tmp/v28-artifact.zip -d /tmp/v28
          V28="$(find /tmp/v28 -type f -name 'OpenTTD-v14-Yandex-Adaptive-Desktop-Mobile-V28.zip' -print -quit)"
          test -s "$V28"
          unzip -q "$V28" -d /tmp/package

      - name: Assemble CrazyGames V2 package
        shell: bash
        run: |
          set -euo pipefail

          cp legacy/dist/openttd-runtime.js /tmp/package/openttd-runtime.js
          cp legacy/dist/openttd.wasm /tmp/package/openttd.wasm
          cp legacy/dist/openttd.data /tmp/package/openttd.data

          rm -rf /tmp/package/music
          mkdir -p /tmp/package/music
          cp /tmp/openmsx-render/mp3/*.mp3 /tmp/package/music/
          test "$(find /tmp/package/music -type f -name '*.mp3' | wc -l)" -ge 31

          # Preserve V27/V28 exact-pixel WebGL presenter on the new split JS glue.
          python3 ci/patch-v14-webgl-runtime.py /tmp/package/openttd-runtime.js
          node --check /tmp/package/openttd-runtime.js

          python3 crazygames/patch-v28-package-v2.py /tmp/package
          cp crazygames/crazygames-bootstrap.js /tmp/package/crazygames-bootstrap.js
          cp crazygames/crazygames-bridge.js /tmp/package/crazygames-bridge.js

          cat > /tmp/package/CRAZYGAMES-INTEGRATION.txt <<'EOF'
          OpenTTD v14 / OpenTTD 15.3 WebAssembly - CrazyGames V2
          Base package: verified Yandex Adaptive Desktop-Mobile V28.
          Runtime: split Emscripten JS + WASM + DATA; SINGLE_FILE disabled.
          OpenMSX rendered MP3 music: lazy-loaded as individual files on demand.
          CrazyGames HTML5 SDK v3: init, loading/gameplay lifecycle, Data Module,
          muteAudio, device systemInfo and ad-safe pause/resume bridge.
          No Yandex SDK request, Yandex ads or Yandex leaderboard are included.
          EOF

      - name: Validate CrazyGames V2 and measure initial payload
        shell: bash
        run: |
          set -euo pipefail

          test -s /tmp/package/index.html
          test -s /tmp/package/openttd-runtime.js
          test -s /tmp/package/openttd.wasm
          test -s /tmp/package/openttd.data
          test -s /tmp/package/crazygames-bootstrap.js
          test -s /tmp/package/crazygames-bridge.js
          test -s /tmp/package/openttd-crazygames-mobile.js
          test -s /tmp/package/openttd-platform-fixes.js
          test -s /tmp/package/openttd-full-viewport.js
          test -s /tmp/package/openttd-classic-ai.js

          grep -Fq 'https://sdk.crazygames.com/crazygames-sdk-v3.js' /tmp/package/index.html
          grep -Fq 'CrazyGames.SDK' /tmp/package/crazygames-bootstrap.js
          grep -Fq 'gameplayStart' /tmp/package/crazygames-bridge.js
          grep -Fq 'loadingStart' /tmp/package/crazygames-bootstrap.js
          grep -Fq 'loadingStop' /tmp/package/crazygames-bridge.js
          grep -Fq 'sdk.data.getItem' /tmp/package/crazygames-bridge.js
          grep -Fq 'muteAudio' /tmp/package/crazygames-bootstrap.js

          test ! -e /tmp/package/yandex-bootstrap.js
          test ! -e /tmp/package/yandex-bridge.js
          test ! -e /tmp/package/openttd-yandex-mobile.js
          test ! -e /tmp/package/openttd-global-ranking.js
          test ! -e /tmp/package/openttd-ranking-core.js
          ! grep -RniF '/sdk.js' /tmp/package --include='*.html' --include='*.js'
          ! grep -RniE 'playgama|playgamma' /tmp/package --include='*.html' --include='*.js' --include='*.json'

          ! grep -Fq 'data:application/octet-stream;base64,' /tmp/package/openttd-runtime.js
          test "$(stat -c%s /tmp/package/openttd-runtime.js)" -lt 5000000
          grep -Fq 'openttd.wasm' /tmp/package/openttd-runtime.js
          grep -Fq 'openttd.data' /tmp/package/openttd-runtime.js

          grep -Fq '_em_openttd_set_touch_ui' /tmp/package/openttd-runtime.js
          grep -Fq '_em_openttd_touch_context' /tmp/package/openttd-runtime.js
          grep -Fq '_em_openttd_force_window_resize' /tmp/package/openttd-runtime.js
          grep -Fq '__openttdWebGLPresenter' /tmp/package/openttd-runtime.js
          grep -Fq 'V8-deferred-fixed-placement' /tmp/package/openttd-crazygames-mobile.js
          grep -Fq 'Adaptive V27 host-aware native-framebuffer recovery.' /tmp/package/openttd-full-viewport.js

          node --check /tmp/package/crazygames-bootstrap.js
          node --check /tmp/package/crazygames-bridge.js
          node --check /tmp/package/openttd-crazygames-mobile.js
          node --check /tmp/package/openttd-platform-fixes.js
          node --check /tmp/package/openttd-full-viewport.js
          node --check /tmp/package/openttd-runtime.js

          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import gzip

          root = Path('/tmp/package')
          html = (root / 'index.html').read_text(encoding='utf-8')

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.src=[]
              def handle_starttag(self, tag, attrs):
                  if tag != 'script': return
                  d=dict(attrs); src=d.get('src')
                  if src and not src.startswith(('http://','https://','//')): self.src.append(src)
          p=P(); p.feed(html)
          initial_names=['index.html'] + p.src + ['openttd.wasm','openttd.data']
          seen=[]
          for n in initial_names:
              if n not in seen: seen.append(n)
          missing=[n for n in seen if not (root/n).is_file()]
          if missing: raise SystemExit(f'missing initial files: {missing}')
          raw=sum((root/n).stat().st_size for n in seen)
          gz=sum(len(gzip.compress((root/n).read_bytes(), compresslevel=9)) for n in seen)
          total=sum(x.stat().st_size for x in root.rglob('*') if x.is_file())
          music=sum(x.stat().st_size for x in (root/'music').glob('*.mp3'))
          count=sum(1 for x in root.rglob('*') if x.is_file())
          print('initial_files=' + ','.join(seen))
          print(f'initial_raw_bytes={raw}')
          print(f'initial_gzip_estimate_bytes={gz}')
          print(f'lazy_music_bytes={music}')
          print(f'total_unpacked_bytes={total}')
          print(f'total_file_count={count}')
          if raw >= 50_000_000:
              print('WARNING: raw initial payload is >=50 MB; CDN transfer compression may be lower.')
          if gz >= 20_000_000:
              print('NOTE: gzip estimate is >=20 MB; mobile-homepage target may require another staging pass.')
          if count >= 1500:
              raise SystemExit('CrazyGames file-count limit exceeded')
          Path('/tmp/crazygames-v2-size.txt').write_text(
              f'initial_raw_bytes={raw}\ninitial_gzip_estimate_bytes={gz}\nlazy_music_bytes={music}\ntotal_unpacked_bytes={total}\ntotal_file_count={count}\n',
              encoding='utf-8')
          PY

      - name: Create CrazyGames V2 archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP=/tmp/out/OpenTTD-v14-CrazyGames-Adaptive-Desktop-Mobile-V2.zip
          (cd /tmp/package && zip -9 -r "$ZIP" .)
          unzip -t "$ZIP" >/dev/null
          sha256sum "$ZIP" | tee /tmp/out/SHA256SUMS.txt
          cp /tmp/crazygames-v2-size.txt /tmp/out/CRAZYGAMES-V2-SIZE.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          z=Path('/tmp/out/OpenTTD-v14-CrazyGames-Adaptive-Desktop-Mobile-V2.zip')
          size=Path('/tmp/out/CRAZYGAMES-V2-SIZE.txt').read_text(encoding='utf-8')
          report=(
              'OpenTTD v14 CrazyGames adaptive desktop-mobile V2\n'
              'base=verified_Yandex_V28\n'
              'runtime_delivery=split_js_wasm_data\n'
              'single_file=false\n'
              'music_delivery=lazy_individual_mp3\n'
              'crazygames_sdk_v3=true\n'
              'data_module=true\n'
              'mute_audio=true\n'
              'mobile_support=true\n'
              'multiplayer=false\n'
              + size
              + f'zip_bytes={z.stat().st_size}\n'
              + f'zip_sha256={hashlib.sha256(z.read_bytes()).hexdigest()}\n'
          )
          Path('/tmp/out/CRAZYGAMES-V2-RESULTS.txt').write_text(report, encoding='utf-8')
          print(report)
          PY
          ls -lh "$ZIP"

      - name: Upload CrazyGames V2 tested release
        uses: actions/upload-artifact@v4
        with:
          name: openttd-v14-crazygames-adaptive-desktop-mobile-v2
          path: |
            /tmp/out/OpenTTD-v14-CrazyGames-Adaptive-Desktop-Mobile-V2.zip
            /tmp/out/SHA256SUMS.txt
            /tmp/out/CRAZYGAMES-V2-SIZE.txt
            /tmp/out/CRAZYGAMES-V2-RESULTS.txt
          if-no-files-found: error
