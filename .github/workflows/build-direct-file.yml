name: Build direct-file OpenTTD

on:
  push:
    branches:
      - fix/direct-file-launch
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container: emscripten/emsdk:3.1.57
    steps:
      - name: Checkout port repository
        uses: actions/checkout@v4

      - name: Build direct-file package
        run: bash ci/build-direct-file.sh

      - name: Upload direct-file ZIP
        uses: actions/upload-artifact@v4
        with:
          name: openttd-yandexgames-direct-file
          path: OpenTTD-YandexGames-Direct.zip
          if-no-files-found: error
          retention-days: 14
