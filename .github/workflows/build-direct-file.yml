name: Build direct-file OpenTTD

on:
  push:
    branches:
      - fix/direct-file-launch
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container: emscripten/emsdk:3.1.57
    steps:
      - name: Checkout port repository
        uses: actions/checkout@v4

      - name: Build Yandex Games release package
        run: bash ci/build-yandex-release.sh

      - name: Upload Yandex Games ZIP
        uses: actions/upload-artifact@v4
        with:
          name: openttd-yandexgames-yandex-release
          path: OpenTTD-YandexGames-Direct.zip
          if-no-files-found: error
          retention-days: 14
