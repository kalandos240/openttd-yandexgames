name: Build Playgama OpenTTD with AI and add-ons
# Builds both portal variants from one natively AI-enabled, offline-content runtime.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-playgama-ai-runtime.yml'
      - 'playgama/**'
      - 'docs/PLAYGAMA_ADDONS.md'

permissions:
  contents: read

env:
  LEGACY_BUILD_REF: fix/direct-file-launch

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: emscripten/emsdk:3.1.57

    steps:
      - name: Checkout current Playgama integration
        uses: actions/checkout@v4
        with:
          path: port

      - name: Checkout tested OpenTTD browser build pipeline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.LEGACY_BUILD_REF }}
          path: legacy

      - name: Remove every legacy AI hard-disable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('legacy/ci/build-yandex-release.sh')
          text = p.read_text(encoding='utf-8')
          needle = "    'python3 ci/patch-yandex-ai-offline.py\\n'\n"
          if text.count(needle) != 1:
              raise SystemExit(f'Expected exactly one native AI hard-disable hook, found {text.count(needle)}')
          text = text.replace(needle, '', 1)
          p.write_text(text, encoding='utf-8')
          print('Removed patch-yandex-ai-offline.py from the release source hook.')

          # The legacy offline cleanup also rewrites openttd.cfg to zero competitors
          # in releaseStartup(), after the bundled AI installer has already selected
          # three competitors.  That late rewrite creates companies whose AI never
          # starts. Remove the complete config sanitizer, not merely its native gate.
          p = Path('legacy/ci/patch-yandex-runtime-cleanup.py')
          text = p.read_text(encoding='utf-8')
          pattern = re.compile(
              r'''\n    # Old local/cloud configuration.*?'''
              r'''    text = replace_once\(text, old_release, new_release, 'offline AI startup config'\)\n''',
              re.S,
          )
          text, count = pattern.subn('', text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one late AI config sanitizer, found {count}')
          p.write_text(text, encoding='utf-8')

          # Cloud restore/backup must preserve the selected competitor count too.
          p = Path('legacy/ci/yandex-bridge.js')
          text = p.read_text(encoding='utf-8')
          # patch-yandex-runtime-cleanup.py has not run yet, so the bridge is still
          # the clean version. The assertions below protect against future drift.
          if 'sanitizeOfflineConfig' in text or 'max_no_competitors = 0' in text:
              raise SystemExit('Unexpected AI-zero sanitizer already present in yandex-bridge.js')

          # Prevent the cleanup patch from adding its cloud config sanitizer later.
          cleanup = Path('legacy/ci/patch-yandex-runtime-cleanup.py')
          text = cleanup.read_text(encoding='utf-8')
          start = text.find("    old_read = '''  function readConfig(FS, personalDir) {")
          end_marker = "    text = replace_once(text, old_write, new_write, 'cloud config restore sanitizer')\n"
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Could not find legacy cloud AI sanitizer block')
          end += len(end_marker)
          text = text[:start] + text[end:]
          cleanup.write_text(text, encoding='utf-8')
          print('Removed native, startup and cloud AI-zero sanitizers.')
          PY
          grep -q "python3 ci/patch-yandex-ai-offline.py" legacy/ci/build-yandex-release.sh && {
            echo 'The filename may remain in py_compile validation, but must not be in source_hook:'
            grep -n "patch-yandex-ai-offline.py" legacy/ci/build-yandex-release.sh
          } || true
          ! grep -q 'offline AI startup config' legacy/ci/patch-yandex-runtime-cleanup.py
          ! grep -q 'cloud config restore sanitizer' legacy/ci/patch-yandex-runtime-cleanup.py

      - name: Build OpenTTD 15.3 WebAssembly runtime with native AI enabled
        working-directory: legacy
        shell: bash
        run: |
          set -euo pipefail
          bash ci/build-yandex-release.sh
          test -s OpenTTD-YandexGames-Direct.zip

          # Regression check: the Playgama build must retain upstream OpenTTD's
          # normal single-player AI gate instead of the old Yandex hard-disable.
          grep -Fq 'return !_networking || (_network_server && _settings_game.ai.ai_in_multiplayer);' openttd/src/ai/ai_core.cpp
          ! grep -Fq 'downloadable AI modules / Online Content are intentionally disabled' openttd/src/ai/ai_core.cpp
          ! grep -Fq 'AI competitors hard-disabled' openttd/src/ai/ai_core.cpp

      - name: Extract rebuilt browser runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-playgama
          mkdir dist-playgama
          unzip -q legacy/OpenTTD-YandexGames-Direct.zip -d dist-playgama
          test -s dist-playgama/index.html
          test -s dist-playgama/openttd-runtime.js
          test -s dist-playgama/yandex-bridge.js
          test -s dist-playgama/openttd-shell-2.js
          echo 'Rebuilt runtime files:'
          ls -lh dist-playgama/index.html dist-playgama/openttd-runtime.js dist-playgama/yandex-bridge.js

      - name: Install BaNaNaS client
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'OpenTTDLab==0.0.75'

      - name: Build bundled SimpleAI payload from BaNaNaS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import json
          from openttdlab import download_from_bananas

          payload = {}
          manifest = []
          with download_from_bananas('ai/534d504c') as files:
              for item in files:
                  if len(item) == 5:
                      content_id, filename, license_name, md5, get_data = item
                  elif len(item) == 4:
                      content_id, filename, md5, get_data = item
                      license_name = 'unknown'
                  else:
                      raise RuntimeError(f'Unexpected BaNaNaS item: {item!r}')

                  with get_data() as chunks:
                      data = b''.join(chunks)
                  if not data:
                      raise RuntimeError(f'Empty BaNaNaS payload: {content_id}')

                  if str(content_id).startswith('ai/'):
                      relative = 'ai/' + filename
                  elif str(content_id).startswith(('ai-library/', 'ailibrary/')):
                      relative = 'ai/library/' + filename
                  else:
                      raise RuntimeError(f'Unexpected dependency type: {content_id}')

                  payload[relative] = base64.b64encode(data).decode('ascii')
                  manifest.append({
                      'content_id': content_id,
                      'filename': filename,
                      'license': str(license_name),
                      'md5': md5,
                      'bytes': len(data),
                      'install_path': relative,
                  })

          if not any(row['content_id'] == 'ai/534d504c' for row in manifest):
              raise RuntimeError('SimpleAI was not returned by BaNaNaS')
          if len(manifest) < 3:
              raise RuntimeError(f'Expected SimpleAI plus dependencies, got {manifest!r}')

          out = Path('port/playgama/openttd-classic-ai.generated.js')
          out.write_text(
              '/* Generated in CI from OpenTTD BaNaNaS content and dependencies. */\n'
              'window.__openttdClassicAIArchives = ' + json.dumps(payload, separators=(',', ':')) + ';\n'
              'window.__openttdClassicAIManifest = ' + json.dumps(manifest, separators=(',', ':')) + ';\n',
              encoding='utf-8',
          )
          Path('port/playgama/openttd-classic-ai-manifest.json').write_text(
              json.dumps(manifest, indent=2), encoding='utf-8'
          )
          print(json.dumps(manifest, indent=2))
          PY
          node --check port/playgama/openttd-classic-ai.generated.js

      - name: Build optional offline add-on catalog from BaNaNaS
        id: optional_addons
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-addons
          mkdir -p dist-addons/addons
          python3 - <<'PY'
          from pathlib import Path
          import json
          import socket
          import tarfile
          from openttdlab import download_from_bananas

          # BaNaNaS' legacy TCP catalogue can occasionally take longer than its
          # old client default on GitHub runners. Do not fail a deterministic
          # release merely because the catalogue needs a few more seconds.
          socket.setdefaulttimeout(60)

          catalog = [
              {
                  'content_id': 'newgrf/43411223',
                  'name': 'Iron Horse 4 (Trains)',
                  'version': '4.29.0',
                  'md5_prefix': 'bd0a3c2f',
                  'license_expected': 'GPL v2',
                  'category': 'trains',
                  'source': 'https://grf.farm/iron-horse/index.html',
              },
              {
                  'content_id': 'newgrf/f1250009',
                  'name': 'FIRS Industries 5',
                  'version': '5.2.0',
                  'md5_prefix': '6bb8b38e',
                  'license_expected': 'GPL v2',
                  'category': 'industry',
                  'conflict_group': 'industry-set',
                  'source': 'https://grf.farm/firs/index.html',
              },
              {
                  'content_id': 'newgrf/9787eafe',
                  'name': 'Road Hog (Buses, Trucks, Trams)',
                  'version': '1.4.1',
                  'md5_prefix': '04acd20a',
                  'license_expected': 'GPL v2',
                  'category': 'road-vehicles',
                  'source': 'https://www.tt-forums.net/viewtopic.php?f=26&t=70241',
              },
              {
                  'content_id': 'newgrf/55440100',
                  'name': 'GIST - German Industries Set',
                  'version': '0.21.10',
                  'md5_prefix': 'e314aaa0',
                  'license_expected': 'GPL v2',
                  'category': 'industry',
                  'conflict_group': 'industry-set',
                  'source': 'https://github.com/UweDomaratius/GermanIndustries',
              },
              {
                  'content_id': 'newgrf/474c0501',
                  'name': 'Early Vehicle Set',
                  'version': '0.0.2',
                  'md5_prefix': 'f13d428d',
                  'license_expected': 'GPL v2',
                  'category': 'vehicles',
                  'source': 'https://github.com/DonaldDuck313/OpenTTD-NewGRFs/tree/main/EarlyVehicleSet',
              },
              {
                  'content_id': 'newgrf/4f475a01',
                  'name': 'OpenGFX2 Settings',
                  'version': '0.7',
                  'md5_prefix': '0d04bc9a',
                  'license_expected': 'GPL v2',
                  'category': 'graphics-settings',
                  'source': 'https://github.com/OpenTTD/OpenGFX2',
              },
              {
                  'content_id': 'base-graphics/6f676678',
                  'name': 'OpenGFX2 Classic',
                  'version': '0.8.1',
                  'md5_prefix': '9511dce1',
                  'license_expected': 'Custom',
                  'category': 'base-graphics',
                  'source': 'https://github.com/OpenTTD/OpenGFX2',
                  'source_license': 'GPL-2.0',
              },
          ]

          by_key = {}
          target_specs = {row['content_id']: row for row in catalog}
          found_targets = set()

          for spec in catalog:
              with download_from_bananas(spec['content_id']) as files:
                  for item in files:
                      if len(item) == 5:
                          content_id, filename, license_name, md5, get_data = item
                      elif len(item) == 4:
                          content_id, filename, md5, get_data = item
                          license_name = 'unknown'
                      else:
                          raise RuntimeError(f'Unexpected BaNaNaS item: {item!r}')

                      content_id = str(content_id)
                      filename = str(filename)
                      md5 = str(md5)
                      license_name = str(license_name)

                      if content_id == spec['content_id']:
                          found_targets.add(content_id)
                          if not md5.startswith(spec['md5_prefix']):
                              raise RuntimeError(
                                  f"Pinned {content_id} changed: expected MD5 prefix {spec['md5_prefix']}, got {md5}. "
                                  'Review the new upstream version before updating the pin.'
                              )
                          if license_name != spec['license_expected']:
                              raise RuntimeError(
                                  f"License metadata changed for {content_id}: expected {spec['license_expected']!r}, got {license_name!r}"
                              )

                      if not content_id.startswith(('newgrf/', 'base-graphics/')):
                          raise RuntimeError(f'Unsupported add-on dependency type: {content_id}')

                      key = (content_id, md5)
                      if key in by_key:
                          if spec['content_id'] not in by_key[key]['requested_by']:
                              by_key[key]['requested_by'].append(spec['content_id'])
                          continue

                      with get_data() as chunks:
                          data = b''.join(chunks)
                      if not data:
                          raise RuntimeError(f'Empty BaNaNaS payload: {content_id}')

                      suffix = Path(filename).suffix.lower() or '.bin'
                      safe_id = content_id.replace('/', '_').replace('-', '_')
                      asset_name = f'{safe_id}-{md5[:8]}{suffix}'
                      asset_path = Path('dist-addons/addons') / asset_name
                      asset_path.write_bytes(data)

                      # BaNaNaS content is normally distributed as .tar archives.
                      # Validate archive readability and expected payload type now,
                      # instead of discovering a broken package in the browser.
                      if suffix == '.tar':
                          with tarfile.open(asset_path, 'r') as archive:
                              names = [name.lower() for name in archive.getnames()]
                          if content_id.startswith('newgrf/') and not any(name.endswith('.grf') for name in names):
                              raise RuntimeError(f'NewGRF package contains no .grf: {content_id}')
                          if content_id.startswith('base-graphics/') and not any(name.endswith(('.obg', '.grf')) for name in names):
                              raise RuntimeError(f'Base graphics package contains no .obg/.grf: {content_id}')

                      target = target_specs.get(content_id)
                      row = {
                          'content_id': content_id,
                          'name': target['name'] if target else filename,
                          'version': target['version'] if target else None,
                          'license': license_name,
                          'md5': md5,
                          'bytes': len(data),
                          'type': 'base-graphics' if content_id.startswith('base-graphics/') else 'newgrf',
                          'category': target.get('category') if target else 'dependency',
                          'conflict_group': target.get('conflict_group') if target else None,
                          'asset': 'addons/' + asset_name,
                          'install_filename': asset_name,
                          'upstream_filename': filename,
                          'source': target.get('source') if target else None,
                          'source_license': target.get('source_license') if target else None,
                          'requested_by': [spec['content_id']],
                          'enabled_by_default': False,
                      }
                      by_key[key] = row

          missing = sorted(set(target_specs) - found_targets)
          if missing:
              raise RuntimeError(f'Pinned target packages missing from BaNaNaS: {missing}')

          items = sorted(by_key.values(), key=lambda row: (row['type'], row['name'], row['content_id']))
          manifest = {
              'manifest_version': '2026-08-18-v1',
              'enabled_by_default': False,
              'notes': {
                  'industry_conflict': 'FIRS Industries 5 and GIST are alternative industry sets; enable at most one per new game.',
                  'newgrf_ui': 'Main menu -> NewGRF Settings',
                  'base_graphics_ui': 'Game Options -> Base graphics set',
              },
              'total_bytes': sum(row['bytes'] for row in items),
              'items': items,
          }
          Path('dist-addons/OPENTTD-BUNDLED-ADDONS.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          print(json.dumps(manifest, indent=2))
          PY

          python3 -m json.tool dist-addons/OPENTTD-BUNDLED-ADDONS.json >/dev/null
          find dist-addons/addons -maxdepth 1 -type f -print -exec ls -lh '{}' \;

      - name: Install Playgama Bridge v2 integration, AI and optional add-ons
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s dist-addons/OPENTTD-BUNDLED-ADDONS.json ]; then
            mkdir -p dist-addons/addons
            python3 - <<'PY'
          from pathlib import Path
          import json
          manifest = {
              'manifest_version': '2026-08-29-offline-fallback',
              'enabled_by_default': False,
              'notes': {
                  'catalog': 'Optional add-on catalogue was unavailable while building; core game and bundled AI are complete.',
              },
              'total_bytes': 0,
              'items': [],
          }
          Path('dist-addons/OPENTTD-BUNDLED-ADDONS.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          PY
          fi
          python3 port/playgama/package_playgama.py dist-playgama \
            --adapter port/playgama/playgama-yandex-compat.js \
            --config port/playgama/playgama-bridge-config.json \
            --fixes port/playgama/openttd-playgama-fixes.js \
            --ai-bundle port/playgama/openttd-classic-ai.generated.js

          cp port/playgama/openttd-classic-ai-manifest.json dist-playgama/OPENTTD-CLASSIC-AI-MANIFEST.json
          cp port/playgama/openttd-bundled-addons.js dist-playgama/openttd-bundled-addons.js
          cp dist-addons/OPENTTD-BUNDLED-ADDONS.json dist-playgama/OPENTTD-BUNDLED-ADDONS.json
          cp -a dist-addons/addons dist-playgama/addons
          cp port/docs/PLAYGAMA_ADDONS.md dist-playgama/BUNDLED-ADDONS.md

          python3 - <<'PY'
          from pathlib import Path
          p = Path('dist-playgama/index.html')
          html = p.read_text(encoding='utf-8')
          marker = '<script src="openttd-playgama-fixes.js"></script>'
          addon = '<script src="openttd-bundled-addons.js"></script>'
          if addon not in html:
              if marker not in html:
                  raise SystemExit('Could not find Playgama fixes script insertion point')
              html = html.replace(marker, marker + addon, 1)
          p.write_text(html, encoding='utf-8')
          PY

      - name: Validate AI and optional add-on Playgama package
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'https://bridge.playgama.com/v1/stable/playgama-bridge.js' dist-playgama/index.html
          ! grep -q 'bridge.playgama.com/v2/' dist-playgama/index.html
          grep -q 'playgama-yandex-compat.js' dist-playgama/index.html
          grep -q 'openttd-classic-ai.js' dist-playgama/index.html
          grep -q 'openttd-playgama-fixes.js' dist-playgama/index.html
          grep -q 'openttd-bundled-addons.js' dist-playgama/index.html

          # Validate real AI invariants instead of counting duplicated config literals
          # in Emscripten output. The native gate was checked at build time above;
          # here we ensure no late/runtime path can zero the competitor count again.
          ! grep -aq 'max_no_competitors = 0' dist-playgama/openttd-runtime.js
          ! grep -aq 'max_no_competitors = 0' dist-playgama/yandex-bridge.js
          ! grep -q 'sanitizeOfflineConfig' dist-playgama/yandex-bridge.js
          grep -q 'const COMPETITORS = 3' dist-playgama/openttd-playgama-fixes.js
          grep -q 'forcePlatformConfig' dist-playgama/openttd-playgama-fixes.js
          grep -q 'installClassicAI' dist-playgama/openttd-playgama-fixes.js
          grep -q 'window.yandexRestoreOpenTTDCloud = async function' dist-playgama/openttd-playgama-fixes.js

          # SimpleAI + dependencies and OpenTTD API compatibility chain.
          grep -q '__openttdClassicAIArchives' dist-playgama/openttd-classic-ai.js
          grep -q 'ai/534d504c' dist-playgama/OPENTTD-CLASSIC-AI-MANIFEST.json
          grep -q 'compat_14.nut' dist-playgama/openttd-playgama-fixes.js
          grep -q 'compat_1.2.nut' dist-playgama/openttd-playgama-fixes.js
          grep -q 'installAICompatibility' dist-playgama/openttd-playgama-fixes.js

          # Optional add-ons are present locally but remain opt-in.
          grep -q 'enabled_by_default.*false' dist-playgama/OPENTTD-BUNDLED-ADDONS.json || true
          ! grep -q '\[newgrf\]' dist-playgama/openttd-bundled-addons.js
          grep -q "cache: 'force-cache'" dist-playgama/openttd-bundled-addons.js
          grep -q 'INSTALL_CONCURRENCY = 1' dist-playgama/openttd-bundled-addons.js
          grep -q 'FS.stat(target)' dist-playgama/openttd-bundled-addons.js

          # Previous Playgama fixes remain present.
          grep -q 'Browser.mainLoop.pause' dist-playgama/openttd-playgama-fixes.js
          grep -q 'PAUSE_STATE_CHANGED' dist-playgama/openttd-playgama-fixes.js
          grep -q 'AUDIO_STATE_CHANGED' dist-playgama/openttd-playgama-fixes.js
          grep -q 'aspect-ratio: 16 / 9' dist-playgama/openttd-playgama-fixes.js
          grep -q 'english.lng' dist-playgama/openttd-playgama-fixes.js
          grep -q 'russian.lng' dist-playgama/openttd-playgama-fixes.js

          node --check dist-playgama/playgama-yandex-compat.js
          node --check dist-playgama/openttd-playgama-fixes.js
          node --check dist-playgama/openttd-classic-ai.js
          node --check dist-playgama/openttd-bundled-addons.js
          python3 -m json.tool dist-playgama/playgama-bridge-config.json >/dev/null
          python3 -m json.tool dist-playgama/OPENTTD-CLASSIC-AI-MANIFEST.json >/dev/null
          python3 -m json.tool dist-playgama/OPENTTD-BUNDLED-ADDONS.json >/dev/null

          python3 - <<'PY'
          import json
          from pathlib import Path

          with open('dist-playgama/playgama-bridge-config.json', encoding='utf-8') as f:
              cfg = json.load(f)
          assert cfg['advertisement']['interstitial']['disable'] is False
          assert cfg['advertisement']['rewarded']['disable'] is True
          assert cfg['advertisement']['banner']['disable'] is True
          assert cfg['device']['supportedOrientations'] == ['landscape']

          with open('dist-playgama/OPENTTD-CLASSIC-AI-MANIFEST.json', encoding='utf-8') as f:
              ai_manifest = json.load(f)
          assert any(row['content_id'] == 'ai/534d504c' for row in ai_manifest)
          assert len(ai_manifest) >= 3

          with open('dist-playgama/OPENTTD-BUNDLED-ADDONS.json', encoding='utf-8') as f:
              addons = json.load(f)
          assert addons['enabled_by_default'] is False
          ids = {row['content_id'] for row in addons['items']}
          required = {
              'newgrf/43411223', 'newgrf/f1250009', 'newgrf/9787eafe',
              'newgrf/55440100', 'newgrf/474c0501', 'newgrf/4f475a01',
              'base-graphics/6f676678',
          }
          if ids:
              assert required <= ids, (required - ids)
          assert all(row['enabled_by_default'] is False for row in addons['items'])
          for row in addons['items']:
              asset = Path('dist-playgama') / row['asset']
              assert asset.is_file(), asset
              assert asset.stat().st_size == row['bytes'], (asset, asset.stat().st_size, row['bytes'])
          industry = [row for row in addons['items'] if row.get('conflict_group') == 'industry-set']
          if ids:
              assert {row['content_id'] for row in industry} == {'newgrf/f1250009', 'newgrf/55440100'}
          PY

          # Archive hygiene: Playgama package paths stay ASCII and space-free.
          python3 - <<'PY'
          from pathlib import Path
          bad = []
          for p in Path('dist-playgama').rglob('*'):
              if not p.is_file():
                  continue
              rel = p.relative_to('dist-playgama').as_posix()
              if ' ' in rel or any(ord(ch) > 127 for ch in rel):
                  bad.append(rel)
          if bad:
              raise SystemExit(f'Invalid package paths: {bad}')
          PY

          unpacked_bytes="$(du -sb dist-playgama | cut -f1)"
          echo "Unpacked Playgama bytes: ${unpacked_bytes}"
          test "${unpacked_bytes}" -lt 300000000

      - name: Build and audit autonomous Yandex package
        shell: bash
        run: |
          set -euo pipefail
          cp -a dist-playgama dist-yandex
          python3 port/yandex/package_yandex_from_playgama.py dist-yandex

          # The only permitted runtime network dependency is Yandex's own SDK.
          # AI, libraries, base sets and optional add-ons must all be local.
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('dist-yandex')
          active = []
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.html', '.js', '.json', '.css'}:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              for url in re.findall(r'https?://[^\s"\'<>`)]+', text):
                  active.append((path.relative_to(root).as_posix(), url.rstrip('.,;')))

          # Legal/source notices may contain upstream links, but executable files
          # may not depend on third-party hosts. /sdk.js is relative and official.
          forbidden = [(path, url) for path, url in active if not path.endswith('.json')]
          if forbidden:
              raise SystemExit(f'External runtime URLs remain: {forbidden[:20]}')

          required = [
              'openttd-runtime.js', 'openttd.wasm', 'openttd.data',
              'openttd-classic-ai.js', 'OPENTTD-CLASSIC-AI-MANIFEST.json',
              'openttd-bundled-addons.js', 'OPENTTD-BUNDLED-ADDONS.json',
          ]
          for name in required:
              path = root / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'Missing autonomous runtime asset: {name}')

          index = (root / 'index.html').read_text(encoding='utf-8')
          assert "script.src = '/sdk.js'" not in index  # loader lives in local bootstrap
          bootstrap = (root / 'yandex-bootstrap.js').read_text(encoding='utf-8')
          assert "script.src = '/sdk.js'" in bootstrap
          assert 'playgama' not in index.lower()
          PY

          (cd dist-yandex && zip -9 -X -r ../openttd-yandex-ai-fixed.zip .)
          unzip -t openttd-yandex-ai-fixed.zip
          sha256sum openttd-yandex-ai-fixed.zip

      - name: Create optimized Playgama v6 ZIP
        shell: bash
        run: |
          set -euo pipefail
          (cd dist-playgama && zip -9 -X -r ../openttd-playgama-v6-addons-optimized.zip .)
          unzip -t openttd-playgama-v6-addons-optimized.zip
          ls -lh openttd-playgama-v6-addons-optimized.zip
          sha256sum openttd-playgama-v6-addons-optimized.zip

      - name: Upload Playgama v6 build
        uses: actions/upload-artifact@v4
        with:
          name: openttd-playgama-v6-addons-optimized
          path: openttd-playgama-v6-addons-optimized.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload autonomous Yandex AI-fixed build
        uses: actions/upload-artifact@v4
        with:
          name: openttd-yandex-ai-fixed
          path: openttd-yandex-ai-fixed.zip
          if-no-files-found: error
          retention-days: 90
