name: Build OpenTTD launch-safe Playgama + Yandex

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/playgama-launch-moderation
      - fix/yandex-ui-runtime-errors
    paths:
      - '.github/workflows/build-playgama-v10-cloud-saves.yml'
      - 'playgama/openttd-bundled-addons.js'
      - 'playgama/openttd-playgama-cloud-saves.js'
      - 'playgama/playgama-yandex-compat.js'
      - 'playgama/playgama-bridge-config.json'
      - 'playgama/openttd-full-viewport.js'
      - 'playgama/upgrade_playgama_v10.py'
      - 'playgama/build-license-bundle.py'
      - 'yandex/package_yandex_from_playgama.py'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build-playgama-v10-cloud-saves.yml'
      - 'playgama/openttd-bundled-addons.js'
      - 'playgama/openttd-playgama-cloud-saves.js'
      - 'playgama/playgama-yandex-compat.js'
      - 'playgama/playgama-bridge-config.json'
      - 'playgama/openttd-full-viewport.js'
      - 'playgama/upgrade_playgama_v10.py'
      - 'yandex/package_yandex_from_playgama.py'

permissions:
  actions: read
  contents: read

env:
  V8_ARTIFACT_ID: '9306987648'

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout current port sources
        uses: actions/checkout@v4

      - name: Download verified Playgama v8 runtime package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V8_ARTIFACT_ID}/zip" \
            -o /tmp/v8-artifact.zip

          rm -rf /tmp/v8-artifact dist-v10
          mkdir -p /tmp/v8-artifact dist-v10
          unzip -q /tmp/v8-artifact.zip -d /tmp/v8-artifact
          inner="$(find /tmp/v8-artifact -type f -name 'openttd-playgama-v8-addons-licenses.zip' -print -quit)"
          test -s "$inner"
          unzip -q "$inner" -d dist-v10

          test -s dist-v10/index.html
          test -s dist-v10/openttd-runtime.js
          test -s dist-v10/OPENTTD-BUNDLED-ADDONS.json
          test -d dist-v10/addons
          test -d dist-v10/licenses

      - name: Apply launch-safe Playgama refresh
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile playgama/upgrade_playgama_v10.py playgama/build-license-bundle.py yandex/package_yandex_from_playgama.py
          python3 playgama/upgrade_playgama_v10.py dist-v10 \
            --loader playgama/openttd-bundled-addons.js \
            --cloud-saves playgama/openttd-playgama-cloud-saves.js \
            --adapter playgama/playgama-yandex-compat.js
          cp playgama/playgama-bridge-config.json dist-v10/playgama-bridge-config.json
          python3 playgama/build-license-bundle.py dist-v10 --repo-license LICENSE

      - name: Validate Playgama startup cannot depend on optional content
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'https://bridge.playgama.com/v1/stable/playgama-bridge.js' dist-v10/index.html
          ! grep -q 'bridge.playgama.com/v2/' dist-v10/index.html
          test "$(head -c 15 dist-v10/index.html)" = '<!DOCTYPE html>'
          test -s dist-v10/openttd-full-viewport.js
          grep -Fq 'Module.setCanvasSize(width, height)' dist-v10/openttd-full-viewport.js
          grep -Fq 'Module.calledRun !== true' dist-v10/openttd-full-viewport.js
          ! grep -q 'addRunDependency' dist-v10/openttd-bundled-addons.js
          ! grep -q 'removeRunDependency' dist-v10/openttd-bundled-addons.js
          grep -q 'RESTORE_STARTUP_GATE_MS = 1500' dist-v10/openttd-bundled-addons.js
          grep -q 'FETCH_TIMEOUT_MS = 8000' dist-v10/openttd-bundled-addons.js
          grep -q 'playgamaBridgeReady' dist-v10/playgama-yandex-compat.js
          ! grep -q "startsWith('2.')" dist-v10/playgama-yandex-compat.js

          node --check dist-v10/openttd-playgama-cloud-saves.js
          node --check dist-v10/openttd-bundled-addons.js
          node --check dist-v10/playgama-yandex-compat.js
          node --check dist-v10/openttd-playgama-fixes.js
          node --check dist-v10/openttd-full-viewport.js
          python3 -m json.tool dist-v10/OPENTTD-BUNDLED-ADDONS.json >/dev/null
          python3 -m json.tool dist-v10/playgama-bridge-config.json >/dev/null

      - name: Verify optional add-on payloads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, hashlib, json
          from pathlib import Path

          root = Path('dist-v10')
          manifest = json.loads((root / 'OPENTTD-BUNDLED-ADDONS.json').read_text(encoding='utf-8'))
          assert manifest['enabled_by_default'] is False
          assert manifest['manifest_version'] == '2026-08-27-v11-ui-polish'
          assert len(manifest['items']) == 7
          for row in manifest['items']:
              assert row['asset'].endswith('.bin'), row['asset']
              packed = (root / row['asset']).read_bytes()
              assert hashlib.sha256(packed).hexdigest() == row['packaged_sha256'], row['content_id']
              data = gzip.decompress(packed) if row.get('compression') == 'gzip' else packed
              assert len(data) == row['installed_bytes'], row['content_id']
              assert hashlib.sha256(data).hexdigest() == row['sha256'], row['content_id']
          print('All optional add-ons verified.')
          PY

      - name: Create Playgama ZIP
        shell: bash
        run: |
          set -euo pipefail
          unpacked_bytes="$(du -sb dist-v10 | cut -f1)"
          echo "Unpacked Playgama bytes: ${unpacked_bytes}"
          test "${unpacked_bytes}" -lt 300000000
          (cd dist-v10 && zip -9 -X -r ../openttd-playgama-v10-launch-safe.zip .)
          unzip -t openttd-playgama-v10-launch-safe.zip
          sha256sum openttd-playgama-v10-launch-safe.zip > openttd-playgama-v10-launch-safe.zip.sha256

      - name: Convert exact Playgama base to Yandex Games
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-yandex
          cp -a dist-v10 dist-yandex
          python3 yandex/package_yandex_from_playgama.py dist-yandex

          ! grep -Eqi 'playgama|bridge\.playgama\.com' dist-yandex/index.html
          ! grep -Eqi 'playgama' dist-yandex/openttd-yandex-fixes.js
          test ! -e dist-yandex/playgama-yandex-compat.js
          test ! -e dist-yandex/playgama-bridge-config.json
          test ! -e dist-yandex/openttd-playgama-cloud-saves.js
          test ! -e dist-yandex/openttd-playgama-fixes.js

          test "$(head -c 15 dist-yandex/index.html)" = '<!DOCTYPE html>'
          test -s dist-yandex/openttd-full-viewport.js
          grep -Fq "script.src = '/sdk.js'" dist-yandex/yandex-bootstrap.js
          grep -Fq 'YaGames.init()' dist-yandex/yandex-bootstrap.js
          ! grep -Eq "location\.(host|hostname|origin)|document\.domain|location\.protocol === 'file:'" dist-yandex/yandex-bootstrap.js
          grep -Fq 'yandexGamesSDKReady' dist-yandex/openttd-runtime.js
          grep -Fq 'setTimeout((()=>A(null)),3e3)' dist-yandex/openttd-runtime.js
          grep -Fq 'Module.calledRun !== true' dist-yandex/yandex-bridge.js
          ! grep -q 'addRunDependency' dist-yandex/openttd-bundled-addons.js

          node --check dist-yandex/yandex-bootstrap.js
          node --check dist-yandex/yandex-bridge.js
          node --check dist-yandex/openttd-yandex-fixes.js
          node --check dist-yandex/openttd-bundled-addons.js
          node --check dist-yandex/openttd-full-viewport.js

      - name: Unit-test Yandex SDK bootstrap order
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          global.window = global;
          global.navigator = { language: 'ru-RU', userActivation: { hasBeenActive: false } };
          global.location = { protocol: 'https:', hostname: 'any-moderation-host.example' };
          let appended = null;
          global.document = {
            createElement(tag) {
              if (tag !== 'script') throw new Error('unexpected tag ' + tag);
              return {};
            },
            head: {
              appendChild(script) {
                appended = script;
                global.YaGames = {
                  async init() {
                    return { environment: { i18n: { lang: 'ru' } } };
                  },
                };
                queueMicrotask(() => script.onload());
              },
            },
          };

          eval(fs.readFileSync('dist-yandex/yandex-bootstrap.js', 'utf8'));
          (async () => {
            const sdk = await global.yandexGamesSDKReady;
            if (!appended || appended.src !== '/sdk.js' || appended.async !== true) {
              throw new Error('Yandex /sdk.js loader was not appended correctly');
            }
            if (!sdk || global.ysdk !== sdk) throw new Error('YaGames.init result was not published');
            if (global.yandexGameLanguage !== 'ru') throw new Error('Yandex locale was not applied');
            console.log('Yandex dynamic SDK bootstrap passed on arbitrary host.');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Create Yandex Games ZIP
        shell: bash
        run: |
          set -euo pipefail
          unpacked_bytes="$(du -sb dist-yandex | cut -f1)"
          echo "Unpacked Yandex bytes: ${unpacked_bytes}"
          test "${unpacked_bytes}" -lt 100000000
          (cd dist-yandex && zip -9 -X -r ../openttd-yandexgames-launch-safe.zip .)
          unzip -t openttd-yandexgames-launch-safe.zip
          sha256sum openttd-yandexgames-launch-safe.zip > openttd-yandexgames-launch-safe.zip.sha256

      - name: Upload Playgama artifact
        uses: actions/upload-artifact@v4
        with:
          name: openttd-playgama-v10-launch-safe
          path: |
            openttd-playgama-v10-launch-safe.zip
            openttd-playgama-v10-launch-safe.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Upload Yandex Games artifact
        uses: actions/upload-artifact@v4
        with:
          name: openttd-yandexgames-launch-safe
          path: |
            openttd-yandexgames-launch-safe.zip
            openttd-yandexgames-launch-safe.zip.sha256
          if-no-files-found: error
          retention-days: 90
