name: Build v14 baseline symbol map

on:
  workflow_dispatch:
  push:
    branches:
      - perf/v14-full-optimization
    paths:
      - '.github/workflows/build-v14-baseline-symbol-map.yml'

permissions:
  contents: read

jobs:
  build-symbol-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    container:
      image: emscripten/emsdk:3.1.57

    steps:
      - name: Checkout exact profiled v14 patch stack
        uses: actions/checkout@v4
        with:
          ref: fix/v14-profiler-performance
          path: baseline

      - name: Checkout exact tested single-file pipeline
        uses: actions/checkout@v4
        with:
          ref: fix/direct-file-launch
          path: legacy

      - name: Reproduce exact baseline runtime with symbol map only
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'OpenTTDLab==0.0.75'

          # patch-browser-ranking.py is an orchestrator. It resolves every
          # browser feature patch relative to its own directory, therefore the
          # diagnostic build must stage the same sibling stack as production.
          for f in \
            patch-playgama-newgrf-main-menu.py \
            patch-browser-ranking.py \
            patch-browser-ranking-core.py \
            patch-browser-ranking-readable.py \
            patch-browser-ranking-strict.py \
            patch-browser-font-web.py \
            patch-browser-tutorial.py \
            patch-browser-tutorial-toolbar.py \
            patch-browser-tutorial-level.py \
            patch-browser-tutorial-native-layout.py \
            patch-browser-tutorial-objectives.py \
            patch-browser-tutorial-compile-fix.py \
            patch-browser-tutorial-final-polish.py \
            patch-browser-tutorial-v15-compat.py \
            patch-browser-tutorial-real-objectives.py \
            patch-browser-tutorial-clean-ui.py \
            patch-browser-tutorial-highlights.py \
            patch-browser-game-speed-selector.py \
            patch-browser-startup-watchdog.py; do
            cp "baseline/playgama/${f}" "legacy/ci/${f}"
          done

          python3 -m py_compile \
            legacy/ci/patch-playgama-newgrf-main-menu.py \
            legacy/ci/patch-browser-ranking.py \
            legacy/ci/patch-browser-ranking-core.py \
            legacy/ci/patch-browser-ranking-readable.py \
            legacy/ci/patch-browser-ranking-strict.py \
            legacy/ci/patch-browser-font-web.py \
            legacy/ci/patch-browser-tutorial.py \
            legacy/ci/patch-browser-tutorial-toolbar.py \
            legacy/ci/patch-browser-tutorial-level.py \
            legacy/ci/patch-browser-tutorial-native-layout.py \
            legacy/ci/patch-browser-tutorial-objectives.py \
            legacy/ci/patch-browser-tutorial-compile-fix.py \
            legacy/ci/patch-browser-tutorial-final-polish.py \
            legacy/ci/patch-browser-tutorial-v15-compat.py \
            legacy/ci/patch-browser-tutorial-real-objectives.py \
            legacy/ci/patch-browser-tutorial-clean-ui.py \
            legacy/ci/patch-browser-tutorial-highlights.py \
            legacy/ci/patch-browser-game-speed-selector.py \
            legacy/ci/patch-browser-startup-watchdog.py \
            baseline/playgama/patch-browser-build-performance.py

          python3 - <<'PY'
          from pathlib import Path

          # Match build-v14-tutorial-highlight-runtime.yml exactly.
          p = Path('legacy/ci/build-yandex-release.sh')
          text = p.read_text(encoding='utf-8')
          ai_off = "    'python3 ci/patch-yandex-ai-offline.py\\n'\n"
          if text.count(ai_off) != 1:
              raise SystemExit(f'Expected one legacy AI-disable hook, got {text.count(ai_off)}')
          text = text.replace(ai_off, '', 1)

          anchor = "    'python3 ci/patch-yandex-runtime-cleanup.py source\\n'\n"
          if text.count(anchor) != 1:
              raise SystemExit(f'Expected one source patch anchor, got {text.count(anchor)}')
          addition = (
              "    'python3 ci/patch-playgama-newgrf-main-menu.py\\n'\n"
              "    'python3 ci/patch-browser-ranking.py\\n'\n"
          )
          text = text.replace(anchor, anchor + addition, 1)
          p.write_text(text, encoding='utf-8')

          build = Path('legacy/ci/build-final.sh')
          b = build.read_text(encoding='utf-8')
          fonts_anchor = 'mkdir -p openttd/build/yandex_baseset /tmp/ottd-assets\n'
          fonts_copy = (
              fonts_anchor
              + 'cp openttd/media/baseset/OpenTTD-Sans.ttf openttd/media/baseset/OpenTTD-Small.ttf '
              + 'openttd/media/baseset/OpenTTD-Serif.ttf openttd/media/baseset/OpenTTD-Mono.ttf '
              + 'openttd/build/yandex_baseset/\n'
          )
          if b.count(fonts_anchor) != 1:
              raise SystemExit('Could not find font staging anchor')
          build.write_text(b.replace(fonts_anchor, fonts_copy, 1), encoding='utf-8')
          PY

          python3 baseline/playgama/patch-browser-build-performance.py legacy/ci/build-final.sh

          # Add one diagnostic-only linker option. Emscripten documents this as
          # an external function-index/name map that avoids shipping names in
          # the wasm itself; no release optimization level is changed.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('legacy/ci/build-final.sh')
          s = p.read_text(encoding='utf-8')
          needle = '    -DOPTION_USE_ASSERTS=OFF\n'
          if s.count(needle) != 1:
              raise SystemExit(f'Expected one release configure tail, got {s.count(needle)}')
          s = s.replace(
              needle,
              '    -DOPTION_USE_ASSERTS=OFF \\\n    -DCMAKE_EXE_LINKER_FLAGS_RELEASE="--emit-symbol-map"\n',
              1,
          )
          p.write_text(s, encoding='utf-8')
          PY

          grep -Fq -- '--emit-symbol-map' legacy/ci/build-final.sh

      - name: Compile exact baseline plus symbol map
        working-directory: legacy
        shell: bash
        run: |
          set -euo pipefail
          bash ci/build-yandex-release.sh
          test -s OpenTTD-YandexGames-Direct.zip

          mapfile -t maps < <(find openttd/build -maxdepth 2 -type f -name '*.symbols' -print)
          printf 'Symbol maps found:\n'
          printf '%s\n' "${maps[@]}"
          test "${#maps[@]}" -ge 1

          mkdir -p symbol-output
          for f in "${maps[@]}"; do cp "$f" symbol-output/; done
          cp OpenTTD-YandexGames-Direct.zip symbol-output/baseline-runtime.zip
          sha256sum symbol-output/* > symbol-output/SHA256SUMS.txt

          # Ensure the expected hot indices from the captured Firefox profile
          # exist in the mapping before publishing it.
          primary="${maps[0]}"
          for idx in 3550 8967 16828 7148 1459 13342 1371 3549 5658; do
            grep -Eq "^${idx}:" "$primary" || {
              echo "Missing profiler function index ${idx} in ${primary}" >&2
              exit 1
            }
          done

      - name: Upload exact baseline symbol map
        uses: actions/upload-artifact@v4
        with:
          name: openttd-v14-baseline-symbol-map
          compression-level: 0
          path: legacy/symbol-output/
          if-no-files-found: error
