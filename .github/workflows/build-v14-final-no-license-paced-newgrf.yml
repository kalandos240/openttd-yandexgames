name: Build v14 final no-license paced NewGRF

on:
  push:
    branches:
      - fix/v14-final-no-license-newgrf-jank
    paths:
      - '.github/workflows/build-v14-final-no-license-paced-newgrf.yml'
      - 'playgama/patch-playgama-newgrf-main-menu.py'
      - 'playgama/openttd-bundled-addons.js'
      - 'playgama/patch-browser-build-performance.py'
      - 'ci/patch-v14-webgl-runtime.py'
      - 'ci/patch-v14-performance-package.py'
      - 'ci/patch-v14-playgama-single-file.py'
      - 'ci/platform-hosted-smoke.mjs'
      - 'yandex/neutralize_yandex_runtime.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    container:
      image: emscripten/emsdk:3.1.57
    env:
      LOCALIZED_ARTIFACT_ID: '9772768820'

    steps:
      - name: Checkout final branch
        uses: actions/checkout@v4

      - name: Checkout tested single-file pipeline
        uses: actions/checkout@v4
        with:
          ref: fix/direct-file-launch
          path: legacy

      - name: Wire current source patch stack
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'OpenTTDLab==0.0.75'

          cp playgama/patch-playgama-newgrf-main-menu.py legacy/ci/patch-playgama-newgrf-main-menu.py
          cp playgama/patch-browser-ranking.py legacy/ci/patch-browser-ranking.py

          python3 -m py_compile \
            legacy/ci/patch-playgama-newgrf-main-menu.py \
            legacy/ci/patch-browser-ranking.py \
            playgama/patch-browser-ranking-core.py \
            playgama/patch-browser-ranking-readable.py \
            playgama/patch-browser-ranking-strict.py \
            playgama/patch-browser-font-web.py \
            playgama/patch-browser-tutorial.py \
            playgama/patch-browser-tutorial-toolbar.py \
            playgama/patch-browser-tutorial-level.py \
            playgama/patch-browser-tutorial-native-layout.py \
            playgama/patch-browser-tutorial-objectives.py \
            playgama/patch-browser-tutorial-compile-fix.py \
            playgama/patch-browser-tutorial-final-polish.py \
            playgama/patch-browser-tutorial-v15-compat.py \
            playgama/patch-browser-tutorial-real-objectives.py \
            playgama/patch-browser-tutorial-clean-ui.py \
            playgama/patch-browser-tutorial-highlights.py \
            playgama/patch-browser-game-speed-selector.py \
            playgama/patch-browser-startup-watchdog.py \
            playgama/patch-browser-build-performance.py \
            ci/patch-v14-webgl-runtime.py \
            ci/patch-v14-performance-package.py \
            ci/patch-v14-playgama-single-file.py \
            yandex/neutralize_yandex_runtime.py

          python3 - <<'PY'
          from pathlib import Path

          p = Path('legacy/ci/build-yandex-release.sh')
          text = p.read_text(encoding='utf-8')
          ai_off = "    'python3 ci/patch-yandex-ai-offline.py\\n'\n"
          if text.count(ai_off) != 1:
              raise SystemExit(f'Expected one legacy AI-disable hook, got {text.count(ai_off)}')
          text = text.replace(ai_off, '', 1)

          anchor = "    'python3 ci/patch-yandex-runtime-cleanup.py source\\n'\n"
          if text.count(anchor) != 1:
              raise SystemExit(f'Expected one source patch anchor, got {text.count(anchor)}')
          addition = (
              "    'python3 ci/patch-playgama-newgrf-main-menu.py\\n'\n"
              "    'python3 ci/patch-browser-ranking.py\\n'\n"
          )
          text = text.replace(anchor, anchor + addition, 1)
          p.write_text(text, encoding='utf-8')

          build = Path('legacy/ci/build-final.sh')
          b = build.read_text(encoding='utf-8')
          fonts_anchor = 'mkdir -p openttd/build/yandex_baseset /tmp/ottd-assets\n'
          fonts_copy = (
              fonts_anchor
              + 'cp openttd/media/baseset/OpenTTD-Sans.ttf openttd/media/baseset/OpenTTD-Small.ttf '
              + 'openttd/media/baseset/OpenTTD-Serif.ttf openttd/media/baseset/OpenTTD-Mono.ttf '
              + 'openttd/build/yandex_baseset/\n'
          )
          if b.count(fonts_anchor) != 1:
              raise SystemExit('Could not find font staging anchor')
          build.write_text(b.replace(fonts_anchor, fonts_copy, 1), encoding='utf-8')
          PY

          python3 playgama/patch-browser-build-performance.py legacy/ci/build-final.sh

      - name: Compile clean OpenTTD 15.3 single-file runtime
        working-directory: legacy
        shell: bash
        run: |
          set -euo pipefail
          bash ci/build-yandex-release.sh
          test -s OpenTTD-YandexGames-Direct.zip

          # The stock Help action is preserved; the custom licenses UI is gone.
          grep -Fq 'case WID_SGI_HELP:            ShowHelpWindow(); break;' openttd/src/intro_gui.cpp
          grep -Fq 'ShowNewGRFSettings(true, true, false, _grfconfig_newgame);' openttd/src/intro_gui.cpp
          grep -Fq 'SetSpriteStringTip(SPR_IMG_SHOW_VEHICLES, STR_MAPGEN_NEWGRF_SETTINGS, STR_MAPGEN_NEWGRF_SETTINGS_TOOLTIP)' openttd/src/intro_gui.cpp
          ! grep -Fq 'PlaygamaLicensesWindow' openttd/src/intro_gui.cpp
          ! grep -Fq 'ShowPlaygamaLicenses' openttd/src/intro_gui.cpp
          ! grep -Fq 'PLAYGAMA-LICENSES.md' openttd/src/intro_gui.cpp
          ! grep -Fq 'STR_PLAYGAMA_LICENSES' openttd/src/lang/english.txt
          ! grep -Fq 'STR_PLAYGAMA_LICENSES' openttd/src/lang/russian.txt

          # Existing tutorial/AI/performance feature gates must remain intact.
          grep -Fq 'STR_BROWSER_TUTORIAL_LEVEL_28' openttd/src/lang/english.txt
          grep -Fq 'STR_BROWSER_TUTORIAL_LEVEL_28' openttd/src/lang/russian.txt
          grep -Fq 'BrowserTutorialResolveTarget' openttd/src/intro_gui.cpp
          grep -Fq 'BrowserTutorialTarget::RailToolbar' openttd/src/intro_gui.cpp
          grep -Fq 'BrowserTutorialTarget::WaterToolbar' openttd/src/intro_gui.cpp
          grep -Fq 'BrowserTutorialTarget::AirToolbar' openttd/src/intro_gui.cpp
          grep -Fq 'ChangeGameSpeed(_game_speed == 100);' openttd/src/toolbar_gui.cpp
          ! grep -Fq 'MenuClickGameSpeed' openttd/src/toolbar_gui.cpp
          ! grep -Fq '_game_speed = 400' openttd/src/toolbar_gui.cpp
          ! grep -Fq '_game_speed = 800' openttd/src/toolbar_gui.cpp

      - name: Extract rebuilt runtime and exact localized v4 packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/finalv14
          mkdir -p /tmp/finalv14/{native,localized-artifact,prod/ya,prod/pg,out}

          unzip -q legacy/OpenTTD-YandexGames-Direct.zip -d /tmp/finalv14/native
          test -s /tmp/finalv14/native/openttd-runtime.js
          test ! -e /tmp/finalv14/native/openttd.wasm
          test ! -e /tmp/finalv14/native/openttd.data
          node --check /tmp/finalv14/native/openttd-runtime.js

          curl -fL --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${LOCALIZED_ARTIFACT_ID}/zip" \
            -o /tmp/finalv14/localized-v4.zip
          unzip -q /tmp/finalv14/localized-v4.zip -d /tmp/finalv14/localized-artifact

          YA_ZIP="$(find /tmp/finalv14/localized-artifact -type f -name 'OpenTTD-v14-Yandex-Full-RU-EN-Localization.zip' -print -quit)"
          PG_ZIP="$(find /tmp/finalv14/localized-artifact -type f -name 'OpenTTD-v14-Playgama-Full-RU-EN-Localization.zip' -print -quit)"
          test -s "$YA_ZIP"; test -s "$PG_ZIP"
          unzip -q "$YA_ZIP" -d /tmp/finalv14/prod/ya
          unzip -q "$PG_ZIP" -d /tmp/finalv14/prod/pg

      - name: Install rebuilt runtime and paced add-on loader
        shell: bash
        run: |
          set -euo pipefail
          for d in /tmp/finalv14/prod/ya /tmp/finalv14/prod/pg; do
            cp /tmp/finalv14/native/openttd-runtime.js "$d/openttd-runtime.js"
            cp playgama/openttd-bundled-addons.js "$d/openttd-bundled-addons.js"
            rm -f "$d/openttd.wasm" "$d/openttd.data"
            python3 ci/patch-v14-webgl-runtime.py "$d/openttd-runtime.js"
          done

          python3 ci/patch-v14-performance-package.py /tmp/finalv14/prod/ya --platform yandex
          python3 ci/patch-v14-playgama-single-file.py /tmp/finalv14/prod/pg
          python3 yandex/neutralize_yandex_runtime.py /tmp/finalv14/prod/ya

          # Remove obsolete Playgama change note that describes the deleted UI.
          rm -f /tmp/finalv14/prod/pg/PLAYGAMA-V8-CHANGES.txt

          python3 - <<'PY'
          from pathlib import Path

          old = 'This document is bundled with the game and can be opened from the main menu using the Licenses / Лицензии button.'
          new = 'This document is bundled with the distribution as a static licenses and third-party notices file.'
          specs = [
              (Path('/tmp/finalv14/prod/ya/THIRD-PARTY-LICENSES.md'), '# OpenTTD Playgama — licenses and third-party notices', '# OpenTTD Web Edition — licenses and third-party notices'),
              (Path('/tmp/finalv14/prod/pg/PLAYGAMA-ALL-LICENSES.md'), None, None),
          ]
          for path, old_heading, new_heading in specs:
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one stale licenses-button sentence in {path}, got {text.count(old)}')
              text = text.replace(old, new, 1)
              if old_heading is not None:
                  if text.count(old_heading) != 1:
                      raise SystemExit(f'Expected one Yandex legal heading in {path}')
                  text = text.replace(old_heading, new_heading, 1)
              path.write_text(text, encoding='utf-8')
          PY

          node --check /tmp/finalv14/prod/ya/openttd-runtime.js
          node --check /tmp/finalv14/prod/pg/openttd-runtime.js
          node --check /tmp/finalv14/prod/ya/openttd-bundled-addons.js
          node --check /tmp/finalv14/prod/pg/openttd-bundled-addons.js

      - name: Static regression, localization and payload gates
        shell: bash
        run: |
          set -euo pipefail

          for d in /tmp/finalv14/prod/ya /tmp/finalv14/prod/pg; do
            test -s "$d/openttd-runtime.js"
            test ! -e "$d/openttd.wasm"
            test ! -e "$d/openttd.data"
            test "$(stat -c%s "$d/openttd-runtime.js")" -gt 20000000
            grep -Fq '__openttdWebGLPresenter' "$d/openttd-runtime.js"
            grep -Fq 'texSubImage2D' "$d/openttd-runtime.js"
            grep -Fq 'Canvas2D fallback' "$d/openttd-runtime.js"
            grep -Fq 'paced_writes: true' "$d/openttd-bundled-addons.js"
            grep -Fq 'waitForIdle' "$d/openttd-bundled-addons.js"
            grep -Fq 'INTER_ITEM_YIELD_MS' "$d/openttd-bundled-addons.js"
            ! grep -Eiq 'LICENSE_BUNDLE_URL|LICENSE_TARGET|installLicenseBundle|__openttdLicenseBundlePath|__openttdBundledLicenseStatus|PLAYGAMA-LICENSES|THIRD-PARTY-LICENSES|license bundle' "$d/openttd-bundled-addons.js"
            grep -Fq 'Module.calledRun === true' "$d/openttd-ranking-core.js"
            grep -Fq "typeof HEAP8 !== 'undefined'" "$d/openttd-ranking-core.js"
            grep -Fq 'const MAX_SCORE = 1000' "$d/openttd-global-ranking.js"
            test -s "$d/LOCALIZATION-REPORT.md"
          done

          test -s /tmp/finalv14/prod/ya/THIRD-PARTY-LICENSES.md
          test "$(stat -c%s /tmp/finalv14/prod/ya/THIRD-PARTY-LICENSES.md)" -gt 100000
          ! grep -Fq 'Licenses / Лицензии button' /tmp/finalv14/prod/ya/THIRD-PARTY-LICENSES.md
          ! grep -Fq '# OpenTTD Playgama — licenses and third-party notices' /tmp/finalv14/prod/ya/THIRD-PARTY-LICENSES.md
          test ! -e /tmp/finalv14/prod/ya/PLAYGAMA-ALL-LICENSES.md
          ! grep -Eiq 'playgama' /tmp/finalv14/prod/ya/openttd-bundled-addons.js
          grep -Fq "script.src = '/sdk.js'" /tmp/finalv14/prod/ya/yandex-bootstrap.js
          ! grep -Eiq 'https?://[^"[:space:]]+' /tmp/finalv14/prod/ya/index.html

          test -s /tmp/finalv14/prod/pg/PLAYGAMA-ALL-LICENSES.md
          test "$(stat -c%s /tmp/finalv14/prod/pg/PLAYGAMA-ALL-LICENSES.md)" -gt 100000
          ! grep -Fq 'Licenses / Лицензии button' /tmp/finalv14/prod/pg/PLAYGAMA-ALL-LICENSES.md
          test ! -e /tmp/finalv14/prod/pg/PLAYGAMA-V8-CHANGES.txt
          ! grep -Fq 'bridge.playgama.com' /tmp/finalv14/prod/pg/index.html
          grep -Fq 'https://bridge.playgama.com/v1.31.0/playgama-bridge.js' /tmp/finalv14/prod/pg/platform-bridge-loader.js
          grep -Fq 'script.async = true' /tmp/finalv14/prod/pg/platform-bridge-loader.js
          grep -Fq 'window.__openttdPlatformStartupIndependent===true' /tmp/finalv14/prod/pg/openttd-runtime.js

          python3 - <<'PY'
          import gzip
          import hashlib
          import json
          from pathlib import Path

          expected_ids = {
              'newgrf/43411223', 'newgrf/f1250009', 'newgrf/9787eafe',
              'newgrf/55440100', 'newgrf/474c0501', 'newgrf/4f475a01',
              'base-graphics/6f676678',
          }
          for root_name in ('ya', 'pg'):
              root = Path('/tmp/finalv14/prod') / root_name
              manifest = json.loads((root / 'OPENTTD-BUNDLED-ADDONS.json').read_text(encoding='utf-8'))
              items = manifest.get('items') or []
              ids = {item['content_id'] for item in items}
              if len(items) != 7 or ids != expected_ids:
                  raise SystemExit(f'{root_name}: unexpected add-on set: {ids}')
              if manifest.get('enabled_by_default') is not False:
                  raise SystemExit(f'{root_name}: add-ons must stay opt-in')

              for item in items:
                  asset = root / item['asset']
                  packed = asset.read_bytes()
                  if len(packed) != int(item['packaged_bytes']):
                      raise SystemExit(f'{root_name}:{item["content_id"]}: packaged size mismatch')
                  if hashlib.sha256(packed).hexdigest() != item['packaged_sha256']:
                      raise SystemExit(f'{root_name}:{item["content_id"]}: packaged sha256 mismatch')
                  data = gzip.decompress(packed) if item.get('compression') == 'gzip' else packed
                  if len(data) != int(item['installed_bytes']):
                      raise SystemExit(f'{root_name}:{item["content_id"]}: installed size mismatch')
                  if hashlib.sha256(data).hexdigest() != item['sha256']:
                      raise SystemExit(f'{root_name}:{item["content_id"]}: installed sha256 mismatch')
                  localization = item.get('localization') or item.get('localization_audit') or {}
                  if localization.get('coverage') != 'complete':
                      raise SystemExit(f'{root_name}:{item["content_id"]}: localization coverage not complete')
              print(f'{root_name}: 7/7 payloads verified, localization complete')
          PY

      - name: Create candidate archives and QA report
        shell: bash
        run: |
          set -euo pipefail
          YA_OUT=/tmp/finalv14/out/OpenTTD-v14-Yandex-Final-RU-EN-NoLicenseUI-PacedNewGRF.zip
          PG_OUT=/tmp/finalv14/out/OpenTTD-v14-Playgama-Final-RU-EN-NoLicenseUI-PacedNewGRF.zip
          (cd /tmp/finalv14/prod/ya && zip -q -r -9 "$YA_OUT" .)
          (cd /tmp/finalv14/prod/pg && zip -q -r -9 "$PG_OUT" .)
          unzip -tq "$YA_OUT"
          unzip -tq "$PG_OUT"
          (cd /tmp/finalv14/out && sha256sum \
            OpenTTD-v14-Yandex-Final-RU-EN-NoLicenseUI-PacedNewGRF.zip \
            OpenTTD-v14-Playgama-Final-RU-EN-NoLicenseUI-PacedNewGRF.zip > SHA256SUMS.txt)

          {
            echo "Source branch: ${GITHUB_REF_NAME}"
            echo "Source commit: ${GITHUB_SHA}"
            echo "Localized baseline artifact: ${LOCALIZED_ARTIFACT_ID}"
            echo "Yandex runtime SHA256: $(sha256sum /tmp/finalv14/prod/ya/openttd-runtime.js | awk '{print $1}')"
            echo "Playgama runtime SHA256: $(sha256sum /tmp/finalv14/prod/pg/openttd-runtime.js | awk '{print $1}')"
            echo "Licenses UI: removed at native source level; stock Help restored"
            echo "Legal notices: retained as static files only; no MEMFS installer/runtime globals"
            echo "Bundled add-ons: 7/7 preserved, opt-in, RU/EN localization complete"
            echo "NewGRF installer: single-concurrency, idle-paced MEMFS writes, base graphics last"
            echo "WebGL presenter, tutorial, AI, ranking and platform startup hardening: preserved"
          } > /tmp/finalv14/out/FINAL-QA.txt

      - name: Upload smoke candidate
        uses: actions/upload-artifact@v4
        with:
          name: openttd-v14-final-candidate-no-license-paced-newgrf
          compression-level: 0
          if-no-files-found: error
          path: |
            /tmp/finalv14/out/OpenTTD-v14-Yandex-Final-RU-EN-NoLicenseUI-PacedNewGRF.zip
            /tmp/finalv14/out/OpenTTD-v14-Playgama-Final-RU-EN-NoLicenseUI-PacedNewGRF.zip
            /tmp/finalv14/out/SHA256SUMS.txt
            /tmp/finalv14/out/FINAL-QA.txt

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout smoke controller
        uses: actions/checkout@v4

      - name: Download candidate
        uses: actions/download-artifact@v4
        with:
          name: openttd-v14-final-candidate-no-license-paced-newgrf
          path: /tmp/finalv14/out

      - name: Prepare browser smoke copies
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/finalv14/out
          sha256sum -c SHA256SUMS.txt
          mkdir -p /tmp/finalv14/test/ya /tmp/finalv14/test/pg-mock /tmp/finalv14/test/pg-exact
          unzip -q OpenTTD-v14-Yandex-Final-RU-EN-NoLicenseUI-PacedNewGRF.zip -d /tmp/finalv14/test/ya
          unzip -q OpenTTD-v14-Playgama-Final-RU-EN-NoLicenseUI-PacedNewGRF.zip -d /tmp/finalv14/test/pg-mock
          unzip -q OpenTTD-v14-Playgama-Final-RU-EN-NoLicenseUI-PacedNewGRF.zip -d /tmp/finalv14/test/pg-exact

          cat > /tmp/finalv14/test/ya/sdk.js <<'JS'
          (() => {
            const data = Object.create(null);
            const player = {
              async getData(keys) { const out = {}; for (const key of (keys || [])) if (Object.prototype.hasOwnProperty.call(data, key)) out[key] = data[key]; return out; },
              async setData(value) { Object.assign(data, value || {}); return true; },
              getMode() { return 'full'; }, getUniqueID() { return 'final-no-license-smoke'; },
              getName() { return 'Final Smoke'; }, isAuthorized() { return true; }
            };
            const ysdk = {
              environment: { i18n: { lang: 'en' }, app: { id: 'final-no-license-smoke' } },
              features: { LoadingAPI: { ready() { return Promise.resolve(true); } }, GameplayAPI: { start() { return Promise.resolve(true); }, stop() { return Promise.resolve(true); } } },
              adv: { showFullscreenAdv({ callbacks } = {}) { callbacks?.onOpen?.(); callbacks?.onClose?.(true); } },
              leaderboards: { async getEntries() { return { entries: [] }; }, async setScore() { return true; } },
              async getPlayer() { return player; }, isAvailableMethod() { return Promise.resolve(true); }, on() {}, off() {}
            };
            window.YaGames = { async init() { document.documentElement.dataset.yandexSdk = 'ready'; return ysdk; } };
          })();
          JS

          cat > /tmp/finalv14/test/pg-mock/platform-bridge-loader.js <<'JS'
          (() => {
            const storageData = new Map();
            window.__openttdPlatformStartupIndependent = true;
            window.bridge = {
              version: 'final-no-license-smoke', engine: 'javascript',
              PLATFORM_MESSAGE: { GAME_READY: 'game_ready', GAMEPLAY_STARTED: 'gameplay_started', GAMEPLAY_STOPPED: 'gameplay_stopped' },
              EVENT_NAME: { PAUSE_STATE_CHANGED: 'pause_state_changed', AUDIO_STATE_CHANGED: 'audio_state_changed', INTERSTITIAL_STATE_CHANGED: 'interstitial_state_changed' },
              INTERSTITIAL_STATE: { OPENED: 'opened', CLOSED: 'closed', FAILED: 'failed' }, STORAGE_TYPE: { PLATFORM_INTERNAL: 'platform_internal' },
              async initialize() { return true; },
              platform: { language: 'en', id: 'playgama-final-smoke', isAudioEnabled: true, on() {}, off() {}, async sendMessage() { return true; } },
              storage: { async isSupported() { return true; }, async isAvailable() { return true; }, async get(key) { return Array.isArray(key) ? key.map(k => storageData.get(String(k)) ?? null) : (storageData.get(String(key)) ?? null); }, async set(key, value) { if (Array.isArray(key)) key.forEach((k, i) => storageData.set(String(k), Array.isArray(value) ? value[i] : value)); else storageData.set(String(key), value); return true; } },
              advertisement: { isInterstitialSupported: false, setMinimumDelayBetweenInterstitial() {}, on() {}, off() {}, showInterstitial() {} },
              player: { id: 'final-smoke-player', isAuthorizationSupported: false, isAuthorized: true, async authorize() { return true; } },
              leaderboards: { type: 'not_available', async getEntries() { return []; }, async setScore() { return true; } }
            };
            window.playgamaBridgeScriptReady = Promise.resolve(window.bridge);
          })();
          JS

      - name: Install browser controller
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -n "$CHROME_BIN"
          mkdir -p /tmp/finalv14/smoke-node
          cd /tmp/finalv14/smoke-node
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund puppeteer-core@24.16.0
          cp "$GITHUB_WORKSPACE/ci/platform-hosted-smoke.mjs" ./smoke.mjs

      - name: Hosted Chromium smoke - Yandex
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          cd /tmp/finalv14/test/ya
          python3 -m http.server 8153 --bind 127.0.0.1 >/tmp/final-ya-http.log 2>&1 &
          pid=$!; trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do curl -fsS http://127.0.0.1:8153/index.html >/dev/null && break; sleep 0.1; done
          cd /tmp/finalv14/smoke-node
          node smoke.mjs yandex http://127.0.0.1:8153/index.html /tmp/finalv14/out/yandex-smoke.json
          grep -Fq '"passed": true' /tmp/finalv14/out/yandex-smoke.json

      - name: Hosted Chromium smoke - Playgama adapter
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          cd /tmp/finalv14/test/pg-mock
          python3 -m http.server 8154 --bind 127.0.0.1 >/tmp/final-pg-http.log 2>&1 &
          pid=$!; trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do curl -fsS http://127.0.0.1:8154/index.html >/dev/null && break; sleep 0.1; done
          cd /tmp/finalv14/smoke-node
          node smoke.mjs playgama http://127.0.0.1:8154/index.html /tmp/finalv14/out/playgama-smoke.json
          grep -Fq '"passed": true' /tmp/finalv14/out/playgama-smoke.json

      - name: Exact Playgama core smoke with external Bridge blocked
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          cd /tmp/finalv14/test/pg-exact
          python3 -m http.server 8155 --bind 127.0.0.1 >/tmp/final-pg-exact-http.log 2>&1 &
          pid=$!; trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do curl -fsS http://127.0.0.1:8155/index.html >/dev/null && break; sleep 0.1; done
          cd /tmp/finalv14/smoke-node
          cat > offline-core.mjs <<'JS'
          import fs from 'node:fs';
          import puppeteer from 'puppeteer-core';
          const output = '/tmp/finalv14/out/playgama-offline-core.json';
          const browser = await puppeteer.launch({ executablePath: process.env.CHROME_BIN, headless: true, args: ['--no-sandbox','--disable-dev-shm-usage','--use-angle=swiftshader','--enable-webgl','--ignore-gpu-blocklist','--autoplay-policy=no-user-gesture-required'] });
          const page = await browser.newPage();
          await page.setViewport({width:1280,height:720,deviceScaleFactor:1});
          const blocked = [], pageErrors = [], responses = [];
          await page.setRequestInterception(true);
          page.on('request', request => {
            const u = new URL(request.url());
            if (u.hostname === '127.0.0.1' || u.hostname === 'localhost') request.continue();
            else { blocked.push(request.url()); request.abort(); }
          });
          page.on('pageerror', error => pageErrors.push(String(error)));
          page.on('response', response => { const u = response.url(); if (u.startsWith('http://127.0.0.1:8155/')) responses.push({url:u,status:response.status()}); });
          await page.goto('http://127.0.0.1:8155/index.html', {waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForFunction(() => window.Module?.calledRun === true, {timeout:60000,polling:100});
          await new Promise(r => setTimeout(r, 2500));
          const result = await page.evaluate(async () => {
            const canvas = document.getElementById('canvas');
            const start = performance.now(); let frames = 0;
            await new Promise(resolve => { const tick = t => { frames++; if (t-start >= 1500) resolve(); else requestAnimationFrame(tick); }; requestAnimationFrame(tick); });
            const elapsed = performance.now()-start;
            return {
              calledRun: !!window.Module?.calledRun,
              webglPresenter: !!window.Module?.SDL2?.__openttdWebGLPresenter,
              canvasWidth: canvas?.width || 0,
              canvasHeight: canvas?.height || 0,
              rafFps: frames*1000/elapsed,
              pacedWrites: window.__openttdBundledAddonsStatus?.paced_writes === true || window.__openttdBundledAddonsState === 'installing-after-main' || window.__openttdBundledAddonsState === 'waiting-for-main'
            };
          });
          const bridgeBlocked = blocked.some(u => u === 'https://bridge.playgama.com/v1.31.0/playgama-bridge.js');
          const report = {...result, bridgeBlocked, blocked, pageErrors, responses};
          fs.writeFileSync(output, JSON.stringify(report,null,2));
          await page.screenshot({path:'/tmp/finalv14/out/playgama-offline-core.png'});
          await browser.close();
          if (!result.calledRun || !result.webglPresenter || result.canvasWidth !== 1280 || result.canvasHeight !== 720 || result.rafFps < 50 || !bridgeBlocked || pageErrors.length) process.exit(1);
          JS
          node offline-core.mjs
          cat /tmp/finalv14/out/playgama-offline-core.json

