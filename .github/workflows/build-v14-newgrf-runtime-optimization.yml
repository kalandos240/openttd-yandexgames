name: Build v14 NewGRF runtime optimization

on:
  push:
    branches:
      - perf/newgrf-runtime-optimization-v14
    paths:
      - 'ci/patch-newgrf-runtime-v14.py'
      - '.github/workflows/build-v14-newgrf-runtime-optimization.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-newgrf-optimized-yandex:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    container:
      image: emscripten/emsdk:3.1.57
    env:
      CURRENT_LOCALIZED_ARTIFACT_ID: '9772768820'

    steps:
      - name: Checkout optimization branch
        uses: actions/checkout@v4

      - name: Checkout tested Yandex build pipeline
        uses: actions/checkout@v4
        with:
          ref: fix/direct-file-launch
          path: legacy

      - name: Wire current stable patch stack plus NewGRF hot-path patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'OpenTTDLab==0.0.75'

          cp playgama/patch-playgama-newgrf-main-menu.py legacy/ci/patch-playgama-newgrf-main-menu.py
          cp playgama/patch-browser-ranking.py legacy/ci/patch-browser-ranking.py
          cp ci/patch-newgrf-runtime-v14.py legacy/ci/patch-newgrf-runtime-v14.py

          python3 - <<'PY'
          from pathlib import Path
          p = Path('legacy/ci/build-yandex-release.sh')
          text = p.read_text(encoding='utf-8')

          ai_off = "    'python3 ci/patch-yandex-ai-offline.py\\n'\n"
          if text.count(ai_off) != 1:
              raise SystemExit(f'Expected one legacy AI-disable hook, got {text.count(ai_off)}')
          text = text.replace(ai_off, '', 1)

          anchor = "    'python3 ci/patch-yandex-runtime-cleanup.py source\\n'\n"
          if text.count(anchor) != 1:
              raise SystemExit(f'Expected one source patch anchor, got {text.count(anchor)}')
          addition = (
              "    'python3 ci/patch-newgrf-runtime-v14.py\\n'\n"
              "    'python3 ci/patch-playgama-newgrf-main-menu.py\\n'\n"
              "    'python3 ci/patch-browser-ranking.py\\n'\n"
          )
          text = text.replace(anchor, anchor + addition, 1)
          p.write_text(text, encoding='utf-8')

          build = Path('legacy/ci/build-final.sh')
          b = build.read_text(encoding='utf-8')
          fonts_anchor = 'mkdir -p openttd/build/yandex_baseset /tmp/ottd-assets\n'
          fonts_copy = fonts_anchor + 'cp openttd/media/baseset/OpenTTD-Sans.ttf openttd/media/baseset/OpenTTD-Small.ttf openttd/media/baseset/OpenTTD-Serif.ttf openttd/media/baseset/OpenTTD-Mono.ttf openttd/build/yandex_baseset/\n'
          if b.count(fonts_anchor) != 1:
              raise SystemExit('Could not find font staging anchor')
          build.write_text(b.replace(fonts_anchor, fonts_copy, 1), encoding='utf-8')
          PY

          python3 playgama/patch-browser-build-performance.py legacy/ci/build-final.sh
          python3 -m py_compile legacy/ci/patch-newgrf-runtime-v14.py

      - name: Build optimized native WebAssembly runtime
        working-directory: legacy
        shell: bash
        run: |
          set -euo pipefail
          bash ci/build-yandex-release.sh
          test -s OpenTTD-YandexGames-Direct.zip
          rm -rf /tmp/optimized-runtime
          mkdir -p /tmp/optimized-runtime
          unzip -q OpenTTD-YandexGames-Direct.zip -d /tmp/optimized-runtime
          test -s /tmp/optimized-runtime/openttd-runtime.js
          test "$(stat -c%s /tmp/optimized-runtime/openttd-runtime.js)" -gt 20000000
          grep -Fq 'Browser edition fast path: NewGRF profiling is normally inactive.' openttd/src/newgrf_spritegroup.cpp
          grep -Fq 'if (_newgrf_profilers.empty()) [[likely]] return group->Resolve(object);' openttd/src/newgrf_spritegroup.cpp

      - name: Download exact current Yandex package with bundled NewGRFs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/current-artifact /tmp/current-release /tmp/final-release
          mkdir -p /tmp/current-artifact /tmp/current-release /tmp/final-release
          curl -fL --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CURRENT_LOCALIZED_ARTIFACT_ID}/zip" \
            -o /tmp/current-artifact.zip
          unzip -q /tmp/current-artifact.zip -d /tmp/current-artifact
          YAZIP="$(find /tmp/current-artifact -type f -name 'OpenTTD-v14-Yandex-Full-RU-EN-Localization.zip' -print -quit)"
          test -s "$YAZIP"
          unzip -q "$YAZIP" -d /tmp/current-release
          cp -a /tmp/current-release/. /tmp/final-release/
          test -s /tmp/current-release/openttd-runtime.js

      - name: Replace only native runtime and prove package preservation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re, base64

          base = Path('/tmp/current-release')
          final = Path('/tmp/final-release')
          optimized = Path('/tmp/optimized-runtime/openttd-runtime.js')

          def manifest(root: Path, skip_runtime: bool = False):
              out = {}
              for p in sorted(root.rglob('*')):
                  if not p.is_file():
                      continue
                  rel = p.relative_to(root).as_posix()
                  if skip_runtime and rel == 'openttd-runtime.js':
                      continue
                  out[rel] = hashlib.sha256(p.read_bytes()).hexdigest()
              return out

          before = manifest(base, skip_runtime=True)
          final_runtime = final / 'openttd-runtime.js'
          final_runtime.write_bytes(optimized.read_bytes())
          after = manifest(final, skip_runtime=True)
          if before != after:
              missing = sorted(set(before) - set(after))
              added = sorted(set(after) - set(before))
              changed = sorted(k for k in set(before) & set(after) if before[k] != after[k])
              raise SystemExit(f'Non-runtime package files changed: missing={missing}, added={added}, changed={changed}')

          def embedded_wasm(path: Path) -> bytes:
              raw = path.read_bytes()
              m = re.search(br'wasmBinaryFile="data:application/octet-stream;base64,([A-Za-z0-9+/=]+)"', raw)
              if not m:
                  raise SystemExit(f'Embedded WASM not found in {path}')
              return base64.b64decode(m.group(1))

          old_wasm = embedded_wasm(base / 'openttd-runtime.js')
          new_wasm = embedded_wasm(final_runtime)
          if old_wasm == new_wasm:
              raise SystemExit('Optimized WASM is byte-identical to baseline; source patch did not affect runtime')

          if (final / 'openttd.wasm').exists() or (final / 'openttd.data').exists():
              raise SystemExit('Unexpected sidecar wasm/data in final package')

          report = Path('/tmp/newgrf-runtime-optimization.txt')
          report.write_text(
              'NewGRF runtime optimization build\n'
              f'baseline_runtime_sha256={hashlib.sha256((base / "openttd-runtime.js").read_bytes()).hexdigest()}\n'
              f'optimized_runtime_sha256={hashlib.sha256(final_runtime.read_bytes()).hexdigest()}\n'
              f'baseline_wasm_bytes={len(old_wasm)}\n'
              f'optimized_wasm_bytes={len(new_wasm)}\n'
              f'preserved_non_runtime_files={len(before)}\n'
              'optimization=SpriteGroup::Resolve inactive-profiler fast path\n'
              'gameplay_semantics_changed=false\n',
              encoding='utf-8',
          )
          print(report.read_text())
          PY

      - name: Validate Yandex package invariants
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/final-release/index.html
          test -s /tmp/final-release/openttd-runtime.js
          test -s /tmp/final-release/yandex-bootstrap.js
          test ! -e /tmp/final-release/openttd.wasm
          test ! -e /tmp/final-release/openttd.data
          ! grep -RniE 'playgama|playgamma' /tmp/final-release/index.html /tmp/final-release/*.js || {
            echo 'Playgama marker found in executable Yandex package' >&2
            exit 1
          }
          grep -Fq 'yandex-bootstrap.js' /tmp/final-release/index.html
          grep -Fq '/sdk.js' /tmp/final-release/yandex-bootstrap.js

          # The current localization bundle stores NewGRF payloads as .grf.bin/.tar.bin.
          addon_count="$(find /tmp/final-release -type f \( -iname '*.grf' -o -iname '*.tar' -o -iname '*.grf.bin' -o -iname '*.tar.bin' \) | wc -l)"
          echo "Bundled GRF/TAR payload files: ${addon_count}"
          test "${addon_count}" -ge 7

      - name: Create ready archives
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/out
          mkdir -p /tmp/out/source-patch
          (cd /tmp/final-release && zip -9 -r /tmp/out/OpenTTD-v14-Yandex-NewGRF-Optimized.zip .)
          cp ci/patch-newgrf-runtime-v14.py /tmp/out/source-patch/
          cp .github/workflows/build-v14-newgrf-runtime-optimization.yml /tmp/out/source-patch/
          cp /tmp/newgrf-runtime-optimization.txt /tmp/out/source-patch/RESULTS.txt
          (cd /tmp/out/source-patch && zip -9 -r /tmp/out/OpenTTD-v14-NewGRF-Optimization-Source.zip .)
          sha256sum /tmp/out/*.zip | tee /tmp/out/SHA256SUMS.txt
          ls -lah /tmp/out

      - name: Upload optimized Yandex archives
        uses: actions/upload-artifact@v4
        with:
          name: openttd-v14-yandex-newgrf-optimized
          path: |
            /tmp/out/OpenTTD-v14-Yandex-NewGRF-Optimized.zip
            /tmp/out/OpenTTD-v14-NewGRF-Optimization-Source.zip
            /tmp/out/SHA256SUMS.txt
            /tmp/newgrf-runtime-optimization.txt
          if-no-files-found: error
