name: Build OpenTTD v14 root fixes Playgama + Yandex

on:
  workflow_dispatch:
  push:
    branches:
      - feature/global-ranking-tutorial
    paths:
      - '.github/workflows/build-v14-root-fixes.yml'
      - 'playgama/patch-browser-ranking.py'
      - 'playgama/patch-browser-ranking-core.py'
      - 'playgama/patch-browser-ranking-readable.py'
      - 'playgama/patch-browser-ranking-strict.py'
      - 'playgama/patch-browser-font-web.py'
      - 'playgama/patch-browser-tutorial.py'
      - 'playgama/patch-browser-tutorial-toolbar.py'
      - 'playgama/patch-browser-tutorial-level.py'
      - 'playgama/patch-browser-tutorial-native-layout.py'
      - 'playgama/patch-browser-tutorial-objectives.py'
      - 'playgama/patch-browser-tutorial-compile-fix.py'
      - 'playgama/patch-browser-tutorial-final-polish.py'
      - 'playgama/patch-browser-tutorial-v15-compat.py'
      - 'playgama/patch-browser-tutorial-real-objectives.py'
      - 'playgama/patch-browser-ai-static.py'
      - 'playgama/openttd-ranking-core.js'
      - 'playgama/install-classic-ai-package.py'
      - 'playgama/upgrade_playgama_v10.py'
      - 'yandex/package_yandex_from_playgama.py'

permissions:
  actions: read
  contents: read

env:
  V8_ARTIFACT_ID: '9306987648'
  LEGACY_BUILD_REF: fix/direct-file-launch

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    container:
      image: emscripten/emsdk:3.1.57

    steps:
      - name: Checkout root-fix sources
        uses: actions/checkout@v4

      - name: Checkout tested OpenTTD browser pipeline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.LEGACY_BUILD_REF }}
          path: legacy

      - name: Wire native root-cause patches
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'OpenTTDLab==0.0.75'

          cp playgama/patch-playgama-newgrf-main-menu.py legacy/ci/patch-playgama-newgrf-main-menu.py
          cp playgama/patch-browser-ranking.py legacy/ci/patch-browser-ranking.py
          python3 -m py_compile \
            legacy/ci/patch-playgama-newgrf-main-menu.py \
            legacy/ci/patch-browser-ranking.py \
            playgama/patch-browser-ranking-strict.py \
            playgama/patch-browser-font-web.py \
            playgama/patch-browser-tutorial-real-objectives.py \
            playgama/patch-browser-ai-static.py \
            playgama/install-classic-ai-package.py

          python3 - <<'PY'
          from pathlib import Path
          p = Path('legacy/ci/build-yandex-release.sh')
          text = p.read_text(encoding='utf-8')

          # The legacy browser pipeline intentionally disabled AI. Remove that
          # source hook entirely; the current browser build bundles AI locally
          # while OpenTTD itself owns the player's AI count and start interval.
          ai_off = "    'python3 ci/patch-yandex-ai-offline.py\\n'\n"
          if text.count(ai_off) != 1:
              raise SystemExit(f'Expected one legacy AI-disable hook, got {text.count(ai_off)}')
          text = text.replace(ai_off, '', 1)

          anchor = "    'python3 ci/patch-yandex-runtime-cleanup.py source\\n'\n"
          additions = (
              "    'python3 ci/patch-playgama-newgrf-main-menu.py\\n'\n"
              "    'python3 ci/patch-browser-ranking.py\\n'\n"
          )
          if text.count(anchor) != 1:
              raise SystemExit(f'Expected one source patch anchor, got {text.count(anchor)}')
          text = text.replace(anchor, anchor + additions, 1)
          p.write_text(text, encoding='utf-8')

          build = Path('legacy/ci/build-final.sh')
          b = build.read_text(encoding='utf-8')

          # Keep the official OpenTTD fonts in the generated browser data set.
          anchor = 'mkdir -p openttd/build/yandex_baseset /tmp/ottd-assets\n'
          addition = (
              anchor
              + 'cp openttd/media/baseset/OpenTTD-Sans.ttf openttd/media/baseset/OpenTTD-Small.ttf '
              + 'openttd/media/baseset/OpenTTD-Serif.ttf openttd/media/baseset/OpenTTD-Mono.ttf '
              + 'openttd/build/yandex_baseset/\n'
          )
          if b.count(anchor) != 1:
              raise SystemExit('Could not find font staging anchor')
          b = b.replace(anchor, addition, 1)

          # Large maps grow the Wasm heap quickly. Start with a larger heap to
          # avoid repeated stop-the-world memory growth during early gameplay.
          memory_old = 'INITIAL_MEMORY=67108864'
          if b.count(memory_old) != 1:
              raise SystemExit(f'Expected one 64 MiB initial-memory setting, got {b.count(memory_old)}')
          b = b.replace(memory_old, 'INITIAL_MEMORY=134217728', 1)

          # Release already disables game assertions. Explicitly enable Wasm
          # SIMD/autovectorization and use geometric heap growth so later large
          # allocations happen less often. This keeps single-threaded OpenTTD
          # semantics intact while improving the browser hot path.
          configure_old = '''  emcmake cmake .. \\
    -DHOST_BINARY_DIR=../build-host \\
    -DCMAKE_BUILD_TYPE=Release \\
    -DOPTION_USE_ASSERTS=OFF
'''
          configure_new = '''  emcmake cmake .. \\
    -DHOST_BINARY_DIR=../build-host \\
    -DCMAKE_BUILD_TYPE=Release \\
    -DOPTION_USE_ASSERTS=OFF \\
    -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG -msimd128" \\
    -DCMAKE_EXE_LINKER_FLAGS_RELEASE="-O3 -msimd128 -s MEMORY_GROWTH_GEOMETRIC_STEP=0.5 -s MEMORY_GROWTH_GEOMETRIC_CAP=268435456"
'''
          if b.count(configure_old) != 1:
              raise SystemExit('Could not find Emscripten Release configure block')
          b = b.replace(configure_old, configure_new, 1)
          build.write_text(b, encoding='utf-8')
          PY

      - name: Rebuild OpenTTD 15.3 with native AI and real tutorial
        working-directory: legacy
        shell: bash
        run: |
          set -euo pipefail
          bash ci/build-yandex-release.sh
          test -s OpenTTD-YandexGames-Direct.zip

          # AI must be part of the Emscripten filesystem before AI::Initialize.
          grep -Fq 'browser_ai@/ai' openttd/CMakeLists.txt
          test "$(find openttd/browser_ai -maxdepth 1 -type f -name '*.tar' | wc -l)" -ge 1
          test "$(find openttd/browser_ai/library -type f -name '*.tar' | wc -l)" -ge 1
          test "$(find openttd/browser_ai -maxdepth 1 -type f -name 'compat_*.nut' | wc -l)" -ge 1

          # Browser integration must not redefine the player's AI settings.
          python3 - <<'PY'
          from pathlib import Path
          s = Path('openttd/src/table/settings/difficulty_settings.ini').read_text()
          max_block = s[s.index('var      = difficulty.max_no_competitors'):]
          max_block = max_block[:max_block.index('[SDT_VAR]', 1)]
          assert 'def      = 0' in max_block, max_block
          interval = s[s.index('var      = difficulty.competitors_interval'):]
          interval = interval[:interval.index('[SDT_VAR]', 1)]
          assert 'def      = 10' in interval, interval
          print('Native AI defaults remain upstream; player controls AI count and interval.')
          PY

          # Performance build invariants.
          grep -Fq 'INITIAL_MEMORY=134217728' openttd/CMakeLists.txt
          grep -Fq -- '-msimd128' openttd/build/CMakeCache.txt
          grep -Fq 'MEMORY_GROWTH_GEOMETRIC_STEP=0.5' openttd/build/CMakeCache.txt

          # Ranking rejects stale packed snapshots; it never clamps them to 1000.
          grep -Fq 'BROWSER_RANKING_MAX_SCORE = SCORE_MAX' openttd/src/highscore_gui.cpp
          grep -Fq 'fields[1] == "3"' openttd/src/highscore_gui.cpp
          grep -Fq 'parsed_score > BROWSER_RANKING_MAX_SCORE' openttd/src/highscore_gui.cpp
          ! grep -Fq 'entry.score = std::min<uint64_t>(parsed_score' openttd/src/highscore_gui.cpp

          # The browser build no longer raises the desktop-only missing-glyph dialog.
          grep -Fq 'The browser edition ships its own OpenTTD fonts' openttd/src/strings.cpp

          # Tutorial uses actual station facilities and actual visits, not tile-count proxies.
          grep -Fq 'Практическое обучение - реальные цели' openttd/src/lang/russian.txt
          grep -Fq 'BrowserTutorialObjective::TrainService' openttd/src/intro_gui.cpp
          grep -Fq 'BrowserTutorialCargoIndustryStationCount' openttd/src/intro_gui.cpp
          grep -Fq 'StationFacility::Dock) >= 2' openttd/src/intro_gui.cpp
          grep -Fq 'HVOT_SHIP' openttd/src/intro_gui.cpp
          grep -Fq 'StationFacility::Airport) >= 2' openttd/src/intro_gui.cpp
          grep -Fq 'HVOT_AIRCRAFT' openttd/src/intro_gui.cpp
          grep -Fq 'BrowserTutorialServedTownCount' openttd/src/intro_gui.cpp
          grep -Fq 'custom_industry_number = 16' openttd/src/intro_gui.cpp
          grep -Fq 'StartNewGameWithoutGUI(0x4F545444U)' openttd/src/intro_gui.cpp

          rm -rf /tmp/v14-native
          mkdir -p /tmp/v14-native
          unzip -q OpenTTD-YandexGames-Direct.zip -d /tmp/v14-native
          test -s /tmp/v14-native/openttd-runtime.js
          node --check /tmp/v14-native/openttd-runtime.js

      - name: Assemble current Playgama package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V8_ARTIFACT_ID}/zip" \
            -o /tmp/v8-artifact.zip

          rm -rf /tmp/v8-artifact dist-v14 /tmp/rebuilt-runtime /tmp/classic-ai
          mkdir -p /tmp/v8-artifact dist-v14 /tmp/rebuilt-runtime /tmp/classic-ai
          unzip -q /tmp/v8-artifact.zip -d /tmp/v8-artifact
          inner="$(find /tmp/v8-artifact -type f -name 'openttd-playgama-v8-addons-licenses.zip' -print -quit)"
          test -s "$inner"
          unzip -q "$inner" -d dist-v14

          python3 playgama/upgrade_playgama_v10.py dist-v14 \
            --loader playgama/openttd-bundled-addons.js \
            --cloud-saves playgama/openttd-playgama-cloud-saves.js \
            --adapter playgama/playgama-yandex-compat.js
          cp playgama/playgama-bridge-config.json dist-v14/playgama-bridge-config.json
          python3 playgama/build-license-bundle.py dist-v14 --repo-license LICENSE

      - name: Install SimpleAI recovery bundle and native runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 playgama/build-simple-ai-bundle.py \
            --output-js /tmp/classic-ai/openttd-classic-ai.js \
            --output-manifest /tmp/classic-ai/OPENTTD-CLASSIC-AI-MANIFEST.json
          python3 playgama/install-classic-ai-package.py dist-v14 \
            --bundle /tmp/classic-ai/openttd-classic-ai.js \
            --manifest /tmp/classic-ai/OPENTTD-CLASSIC-AI-MANIFEST.json

          unzip -q legacy/OpenTTD-YandexGames-Direct.zip -d /tmp/rebuilt-runtime
          test -s /tmp/rebuilt-runtime/openttd-runtime.js
          cp /tmp/rebuilt-runtime/openttd-runtime.js dist-v14/openttd-runtime.js

          node --check dist-v14/openttd-runtime.js
          node --check dist-v14/openttd-classic-ai.js
          node --check dist-v14/openttd-ranking-core.js
          node --check dist-v14/openttd-playgama-fixes.js
          node --check dist-v14/yandex-bridge.js
          ! grep -Fq 'const COMPETITORS =' dist-v14/openttd-playgama-fixes.js
          ! grep -Fq 'const COMPETITOR_INTERVAL =' dist-v14/openttd-playgama-fixes.js
          ! grep -Fq "'max_no_competitors = 3'" dist-v14/yandex-bridge.js
          ! grep -Fq "'competitors_interval = 0'" dist-v14/yandex-bridge.js
          grep -Fq 'gameplayStateRequest' dist-v14/yandex-bridge.js
          grep -Fq 'setPlatformGameplay(gameplayActive);' dist-v14/yandex-bridge.js
          grep -Fq 'openttd.localRanking.v4' dist-v14/openttd-ranking-core.js
          grep -Fq "'openttd.localRanking.v3'" dist-v14/openttd-ranking-core.js
          grep -Fq "version\\t3" dist-v14/openttd-ranking-core.js

      - name: Unit-test strict local ranking purge
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          global.window = global;
          const store = new Map([
            ['openttd.localRanking.v1', '[]'],
            ['openttd.localRanking.v2', JSON.stringify([{name:'packed',score:Number.MAX_SAFE_INTEGER}])],
            ['openttd.localRanking.v3', JSON.stringify([{name:'stale',score:1000}])],
          ]);
          global.localStorage = {
            getItem: k => store.has(k) ? store.get(k) : null,
            setItem: (k,v) => store.set(k,String(v)),
            removeItem: k => store.delete(k),
          };
          let snapshot = '';
          global.FS = {
            mkdirTree() {},
            writeFile(path, data) { if (path.includes('local-ranking')) snapshot = String(data); },
          };
          eval(fs.readFileSync('dist-v14/openttd-ranking-core.js','utf8'));
          for (const key of ['openttd.localRanking.v1','openttd.localRanking.v2','openttd.localRanking.v3']) {
            if (store.has(key)) throw new Error('legacy key survived: ' + key);
          }
          if (OpenTTDRankingCore.submit(String(Number.MAX_SAFE_INTEGER),'broken',true)) throw new Error('oversized score accepted');
          if (!OpenTTDRankingCore.submit('1000','Real Company',true)) throw new Error('valid score rejected');
          OpenTTDRankingCore.requestLocalSnapshot();
          if (!snapshot.startsWith('version\t3\n')) throw new Error('wrong snapshot version: ' + snapshot);
          if (!snapshot.includes('entry\t1\t1000\tReal Company')) throw new Error('valid entry missing');
          if (snapshot.includes('packed') || snapshot.includes('stale') || snapshot.includes('broken')) throw new Error('legacy data leaked');
          console.log('Strict local ranking purge passed.');
          NODE

      - name: Create Playgama v14 ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -s dist-v14/index.html
          test -s dist-v14/openttd-runtime.js
          test -s dist-v14/openttd-classic-ai.js
          (cd dist-v14 && zip -9 -X -r ../openttd-playgama-v14-root-fixes.zip .)
          unzip -t openttd-playgama-v14-root-fixes.zip
          sha256sum openttd-playgama-v14-root-fixes.zip > openttd-playgama-v14-root-fixes.zip.sha256

      - name: Convert exact v14 base to Yandex Games
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-yandex-v14
          cp -a dist-v14 dist-yandex-v14
          python3 yandex/package_yandex_from_playgama.py dist-yandex-v14

          test -s dist-yandex-v14/index.html
          test -s dist-yandex-v14/openttd-runtime.js
          test -s dist-yandex-v14/openttd-classic-ai.js
          test -s dist-yandex-v14/openttd-yandex-fixes.js
          test -s dist-yandex-v14/yandex-bridge.js
          node --check dist-yandex-v14/openttd-runtime.js
          node --check dist-yandex-v14/openttd-ranking-core.js
          node --check dist-yandex-v14/openttd-yandex-fixes.js
          node --check dist-yandex-v14/yandex-bridge.js
          grep -Fq '/sdk.js' dist-yandex-v14/yandex-bootstrap.js
          ! grep -Fq 'bridge.playgama.com' dist-yandex-v14/index.html
          ! test -e dist-yandex-v14/openttd-playgama-fixes.js
          ! grep -Fq 'const COMPETITORS =' dist-yandex-v14/openttd-yandex-fixes.js
          ! grep -Fq 'const COMPETITOR_INTERVAL =' dist-yandex-v14/openttd-yandex-fixes.js
          ! grep -Fq "'max_no_competitors = 3'" dist-yandex-v14/yandex-bridge.js
          ! grep -Fq "'competitors_interval = 0'" dist-yandex-v14/yandex-bridge.js
          grep -Fq 'gameplayStateRequest' dist-yandex-v14/yandex-bridge.js
          grep -Fq 'setPlatformGameplay(gameplayActive);' dist-yandex-v14/yandex-bridge.js
          grep -Fq 'openttd.localRanking.v4' dist-yandex-v14/openttd-ranking-core.js

      - name: Create Yandex Games v14 ZIP
        shell: bash
        run: |
          set -euo pipefail
          (cd dist-yandex-v14 && zip -9 -X -r ../openttd-yandexgames-v14-root-fixes.zip .)
          unzip -t openttd-yandexgames-v14-root-fixes.zip
          sha256sum openttd-yandexgames-v14-root-fixes.zip > openttd-yandexgames-v14-root-fixes.zip.sha256

      - name: Upload Playgama v14 artifact
        uses: actions/upload-artifact@v4
        with:
          name: openttd-playgama-v14-root-fixes
          path: |
            openttd-playgama-v14-root-fixes.zip
            openttd-playgama-v14-root-fixes.zip.sha256
          if-no-files-found: error

      - name: Upload Yandex Games v14 artifact
        uses: actions/upload-artifact@v4
        with:
          name: openttd-yandexgames-v14-root-fixes
          path: |
            openttd-yandexgames-v14-root-fixes.zip
            openttd-yandexgames-v14-root-fixes.zip.sha256
          if-no-files-found: error
