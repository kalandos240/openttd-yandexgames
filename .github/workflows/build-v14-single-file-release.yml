name: Build final single-file Playgama + Yandex archives

on:
  push:
    branches:
      - feature/global-ranking-tutorial
    paths:
      - '.github/workflows/build-v14-single-file-release.yml'
      - 'playgama/patch-direct-file-launch.py'
      - 'playgama/smoke-direct-file.cjs'
      - 'playgama/patch-browser-ranking.py'
      - 'playgama/patch-browser-game-speed-selector.py'
      - 'playgama/openttd-ai-prerun.js'
      - 'playgama/openttd-bundled-addons.js'
      - 'playgama/package_optional_addons.py'
      - 'playgama/newgrf-localization/**'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  V8_ARTIFACT_ID: '9306987648'
  LOCALIZED_NEWGRF_ARTIFACT_ID: '9723687566'
  LEGACY_BUILD_REF: fix/direct-file-launch

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    container:
      image: emscripten/emsdk:3.1.57

    steps:
      - name: Checkout full-feature integration sources
        uses: actions/checkout@v4

      - name: Checkout tested single-file browser pipeline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.LEGACY_BUILD_REF }}
          path: legacy

      - name: Wire current native fixes into tested single-file pipeline
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'OpenTTDLab==0.0.75'

          cp playgama/patch-playgama-newgrf-main-menu.py legacy/ci/patch-playgama-newgrf-main-menu.py
          cp playgama/patch-browser-ranking.py legacy/ci/patch-browser-ranking.py

          python3 -m py_compile \
            legacy/ci/patch-playgama-newgrf-main-menu.py \
            legacy/ci/patch-browser-ranking.py \
            playgama/patch-browser-ranking-core.py \
            playgama/patch-browser-ranking-readable.py \
            playgama/patch-browser-ranking-strict.py \
            playgama/patch-browser-font-web.py \
            playgama/patch-browser-tutorial.py \
            playgama/patch-browser-tutorial-toolbar.py \
            playgama/patch-browser-tutorial-level.py \
            playgama/patch-browser-tutorial-native-layout.py \
            playgama/patch-browser-tutorial-objectives.py \
            playgama/patch-browser-tutorial-compile-fix.py \
            playgama/patch-browser-tutorial-final-polish.py \
            playgama/patch-browser-tutorial-v15-compat.py \
            playgama/patch-browser-tutorial-real-objectives.py \
            playgama/patch-browser-tutorial-clean-ui.py \
            playgama/patch-browser-game-speed-selector.py \
            playgama/patch-browser-startup-watchdog.py \
            playgama/patch-browser-build-performance.py \
            playgama/install-classic-ai-package.py \
            playgama/package_optional_addons.py \
            playgama/patch-direct-file-launch.py
          node --check playgama/smoke-direct-file.cjs
          node --check playgama/openttd-ai-prerun.js
          node --check playgama/openttd-bundled-addons.js
          node --check playgama/test-cold-start-addon-gate.cjs
          node --check playgama/test-persistent-bundled-content-migration.cjs
          node playgama/test-cold-start-addon-gate.cjs
          node playgama/test-persistent-bundled-content-migration.cjs

          python3 - <<'PY'
          from pathlib import Path

          p = Path('legacy/ci/build-yandex-release.sh')
          text = p.read_text(encoding='utf-8')
          ai_off = "    'python3 ci/patch-yandex-ai-offline.py\\n'\n"
          if text.count(ai_off) != 1:
              raise SystemExit(f'Expected one legacy AI-disable hook, got {text.count(ai_off)}')
          text = text.replace(ai_off, '', 1)

          anchor = "    'python3 ci/patch-yandex-runtime-cleanup.py source\\n'\n"
          additions = (
              "    'python3 ci/patch-playgama-newgrf-main-menu.py\\n'\n"
              "    'python3 ci/patch-browser-ranking.py\\n'\n"
          )
          if text.count(anchor) != 1:
              raise SystemExit(f'Expected one source-patch anchor, got {text.count(anchor)}')
          text = text.replace(anchor, anchor + additions, 1)
          p.write_text(text, encoding='utf-8')

          build = Path('legacy/ci/build-final.sh')
          b = build.read_text(encoding='utf-8')
          anchor = 'mkdir -p openttd/build/yandex_baseset /tmp/ottd-assets\n'
          addition = (
              anchor
              + 'cp openttd/media/baseset/OpenTTD-Sans.ttf openttd/media/baseset/OpenTTD-Small.ttf '
              + 'openttd/media/baseset/OpenTTD-Serif.ttf openttd/media/baseset/OpenTTD-Mono.ttf '
              + 'openttd/build/yandex_baseset/\n'
          )
          if b.count(anchor) != 1:
              raise SystemExit('Could not find font staging anchor')
          build.write_text(b.replace(anchor, addition, 1), encoding='utf-8')
          PY

          # Keep the conservative runtime profile. The tested legacy wrapper
          # itself supplies SINGLE_FILE=1 + embedded assets.
          python3 playgama/patch-browser-build-performance.py legacy/ci/build-final.sh

      - name: Rebuild OpenTTD 15.3 single-file runtime
        working-directory: legacy
        shell: bash
        run: |
          set -euo pipefail
          bash ci/build-yandex-release.sh
          test -s OpenTTD-YandexGames-Direct.zip

          # Native feature regression gates on the source that actually built.
          grep -Fq 'MenuClickGameSpeed' openttd/src/toolbar_gui.cpp
          grep -Fq '_game_speed = 200' openttd/src/toolbar_gui.cpp
          grep -Fq '_game_speed = 400' openttd/src/toolbar_gui.cpp
          grep -Fq '_game_speed = 800' openttd/src/toolbar_gui.cpp
          grep -Fq 'STR_GAME_SPEED_X8' openttd/src/lang/english.txt
          grep -Fq 'Ускорение ×8' openttd/src/lang/russian.txt

          rm -rf /tmp/v14-native
          mkdir -p /tmp/v14-native
          unzip -q OpenTTD-YandexGames-Direct.zip -d /tmp/v14-native

          # Validate the actual generated single-file runtime.
          test -s /tmp/v14-native/openttd-runtime.js
          test ! -e /tmp/v14-native/openttd.wasm
          test ! -e /tmp/v14-native/openttd.data
          test "$(stat -c%s /tmp/v14-native/openttd-runtime.js)" -gt 20000000
          node --check /tmp/v14-native/openttd-runtime.js

      - name: Assemble package with localized bundled NewGRFs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V8_ARTIFACT_ID}/zip" \
            -o /tmp/v8-artifact.zip

          curl -fL --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${LOCALIZED_NEWGRF_ARTIFACT_ID}/zip" \
            -o /tmp/localized-newgrf-artifact.zip

          rm -rf /tmp/v8-artifact /tmp/localized-newgrf dist-v14 /tmp/rebuilt-runtime /tmp/classic-ai /tmp/final-addons-work
          mkdir -p /tmp/v8-artifact /tmp/localized-newgrf dist-v14 /tmp/rebuilt-runtime /tmp/classic-ai /tmp/final-addons-work
          unzip -q /tmp/v8-artifact.zip -d /tmp/v8-artifact
          unzip -q /tmp/localized-newgrf-artifact.zip -d /tmp/localized-newgrf

          inner="$(find /tmp/v8-artifact -type f -name 'openttd-playgama-v8-addons-licenses.zip' -print -quit)"
          test -s "$inner"
          unzip -q "$inner" -d dist-v14

          firs="$(find /tmp/localized-newgrf -type f -name 'firs-5.2.0-russian.grf' -print -quit)"
          iron="$(find /tmp/localized-newgrf -type f -name 'iron-horse-4.29.0-russian.grf' -print -quit)"
          early="$(find /tmp/localized-newgrf -type f -name 'early-vehicle-set-russian.grf' -print -quit)"
          test -s "$firs"
          test -s "$iron"
          test -s "$early"
          printf '%s  %s\n' '5dddc9b2921102ad555907512550f47fc5087f0347960095fe0d270d9112cb1e' "$firs" | sha256sum -c -
          printf '%s  %s\n' '5116e34970dd37af83402ae05ddb1abc130556f365d6be9f0b32be0fbb45733b' "$iron" | sha256sum -c -
          printf '%s  %s\n' '4bd73c2d7a0ea293fa33f96b7f08749256e48816c9d46e0ddd8430c67308a5da' "$early" | sha256sum -c -

          cp "$firs" /tmp/final-addons-work/firs-5.2.0.grf
          cp "$iron" /tmp/final-addons-work/iron-horse-4.29.0.grf
          cp "$early" /tmp/final-addons-work/early-vehicle-set-0.0.2.grf
          python3 playgama/package_optional_addons.py --work-dir /tmp/final-addons-work

          # Replace the old English bundled payload entirely before the upgrade
          # script normalizes .gz assets to neutral .bin delivery names.
          rm -rf dist-v14/addons
          cp -a /tmp/final-addons-work/addons dist-v14/addons
          cp /tmp/final-addons-work/OPENTTD-BUNDLED-ADDONS.json dist-v14/OPENTTD-BUNDLED-ADDONS.json
          cp /tmp/final-addons-work/THIRD-PARTY-ADDONS.md dist-v14/THIRD-PARTY-ADDONS.md

          python3 playgama/upgrade_playgama_v10.py dist-v14 \
            --loader playgama/openttd-bundled-addons.js \
            --cloud-saves playgama/openttd-playgama-cloud-saves.js \
            --adapter playgama/playgama-yandex-compat.js
          cp playgama/playgama-bridge-config.json dist-v14/playgama-bridge-config.json

          # Prove the manifest now describes the localized source-built binaries.
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('dist-v14/OPENTTD-BUNDLED-ADDONS.json').read_text(encoding='utf-8'))
          rows = {row['content_id']: row for row in manifest['items']}
          expected = {
              'newgrf/f1250009': '5dddc9b2921102ad555907512550f47fc5087f0347960095fe0d270d9112cb1e',
              'newgrf/43411223': '5116e34970dd37af83402ae05ddb1abc130556f365d6be9f0b32be0fbb45733b',
              'newgrf/474c0501': '4bd73c2d7a0ea293fa33f96b7f08749256e48816c9d46e0ddd8430c67308a5da',
          }
          for cid, digest in expected.items():
              row = rows[cid]
              if row.get('sha256') != digest:
                  raise SystemExit(f'Localized NewGRF hash mismatch for {cid}: {row.get("sha256")}')
              if not row.get('built_from_source'):
                  raise SystemExit(f'Localized NewGRF lost source-build provenance: {cid}')
          print('Localized bundled NewGRF manifest verified.')
          PY

      - name: Install SimpleAI and single-file native runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 playgama/build-simple-ai-bundle.py \
            --output-js /tmp/classic-ai/openttd-classic-ai.js \
            --output-manifest /tmp/classic-ai/OPENTTD-CLASSIC-AI-MANIFEST.json
          python3 playgama/install-classic-ai-package.py dist-v14 \
            --bundle /tmp/classic-ai/openttd-classic-ai.js \
            --manifest /tmp/classic-ai/OPENTTD-CLASSIC-AI-MANIFEST.json

          unzip -q legacy/OpenTTD-YandexGames-Direct.zip -d /tmp/rebuilt-runtime
          test -s /tmp/rebuilt-runtime/openttd-runtime.js
          test ! -e /tmp/rebuilt-runtime/openttd.wasm
          test ! -e /tmp/rebuilt-runtime/openttd.data
          rm -f dist-v14/openttd.wasm dist-v14/openttd.data
          cp /tmp/rebuilt-runtime/openttd-runtime.js dist-v14/openttd-runtime.js

          # Build legal bundle only after the final AI and localized add-on
          # manifests are both in place.
          python3 playgama/build-license-bundle.py dist-v14 --repo-license LICENSE

          node --check dist-v14/openttd-runtime.js
          node --check dist-v14/openttd-classic-ai.js
          node --check dist-v14/openttd-ranking-core.js
          node --check dist-v14/openttd-playgama-fixes.js
          node --check dist-v14/openttd-bundled-addons.js
          node --check dist-v14/yandex-bridge.js
          test "$(stat -c%s dist-v14/openttd-runtime.js)" -gt 20000000
          test ! -e dist-v14/openttd.wasm
          test ! -e dist-v14/openttd.data
          test -s dist-v14/openttd-full-viewport.js
          test -s dist-v14/openttd-ranking-core.js
          test -s dist-v14/openttd-global-ranking.js
          grep -Fq 'openttd.localRanking.v4' dist-v14/openttd-ranking-core.js
          grep -Fq "return '/newgrf'" dist-v14/openttd-bundled-addons.js
          ! grep -Fq "personalDir + '/newgrf'" dist-v14/openttd-bundled-addons.js
          ! grep -Fq 'const COMPETITORS =' dist-v14/openttd-playgama-fixes.js
          ! grep -Fq 'const COMPETITOR_INTERVAL =' dist-v14/openttd-playgama-fixes.js
          ! grep -Fq "'max_no_competitors = 3'" dist-v14/yandex-bridge.js
          ! grep -Fq "'competitors_interval = 0'" dist-v14/yandex-bridge.js

          # Replace parser-active Playgama CDN loading with a local bootstrap.
          # Hosted Playgama still gets its Bridge; file:// launch performs no
          # HTTP(S) request and falls back immediately to the embedded game.
          python3 playgama/patch-direct-file-launch.py prepare-playgama dist-v14
          node --check dist-v14/platform-bridge-loader.js
          node --check dist-v14/openttd-ai-prerun.js
          grep -Fq 'BUNDLED_STATIC_CONTENT_PATHS' dist-v14/openttd-ai-prerun.js

      - name: Create Playgama candidate ZIP
        shell: bash
        run: |
          set -euo pipefail
          # Preserve a converter-compatible copy before removing its temporary marker.
          rm -rf /tmp/yandex-base
          cp -a dist-v14 /tmp/yandex-base
          python3 playgama/patch-direct-file-launch.py finalize-playgama dist-v14

          test -s dist-v14/index.html
          test -s dist-v14/openttd-runtime.js
          test ! -e dist-v14/openttd.wasm
          test ! -e dist-v14/openttd.data
          test -s dist-v14/openttd-classic-ai.js
          test -s dist-v14/platform-bridge-loader.js
          test -s dist-v14/openttd-ai-prerun.js
          ! grep -Fq 'openttd-yandex-converter-marker' dist-v14/index.html
          (cd dist-v14 && zip -9 -X -r ../openttd-playgama-v14-single-file-fixed.zip .)
          unzip -t openttd-playgama-v14-single-file-fixed.zip
          sha256sum openttd-playgama-v14-single-file-fixed.zip > openttd-playgama-v14-single-file-fixed.zip.sha256

      - name: Convert exact Playgama base to Yandex Games
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-yandex-v14
          cp -a /tmp/yandex-base dist-yandex-v14
          python3 yandex/package_yandex_from_playgama.py dist-yandex-v14
          python3 playgama/patch-direct-file-launch.py finalize-yandex dist-yandex-v14

          test -s dist-yandex-v14/index.html
          test -s dist-yandex-v14/openttd-runtime.js
          test ! -e dist-yandex-v14/openttd.wasm
          test ! -e dist-yandex-v14/openttd.data
          test -s dist-yandex-v14/openttd-classic-ai.js
          test -s dist-yandex-v14/openttd-ai-prerun.js
          test -s dist-yandex-v14/openttd-yandex-fixes.js
          test -s dist-yandex-v14/yandex-bridge.js
          test -s dist-yandex-v14/openttd-full-viewport.js
          test -s dist-yandex-v14/openttd-ranking-core.js
          test -s dist-yandex-v14/openttd-global-ranking.js
          test ! -e dist-yandex-v14/platform-bridge-loader.js
          node --check dist-yandex-v14/openttd-runtime.js
          node --check dist-yandex-v14/openttd-ranking-core.js
          node --check dist-yandex-v14/openttd-yandex-fixes.js
          node --check dist-yandex-v14/yandex-bridge.js
          node --check dist-yandex-v14/yandex-bootstrap.js
          node --check dist-yandex-v14/openttd-ai-prerun.js
          grep -Fq '/sdk.js' dist-yandex-v14/yandex-bootstrap.js
          grep -Fq "location.protocol === 'file:'" dist-yandex-v14/yandex-bootstrap.js
          grep -Fq "const LEADERBOARD_NAME = 'companyrating';" dist-yandex-v14/openttd-global-ranking.js
          grep -Fq 'openttd.localRanking.v4' dist-yandex-v14/openttd-ranking-core.js
          grep -Fq 'BUNDLED_STATIC_CONTENT_PATHS' dist-yandex-v14/openttd-ai-prerun.js
          grep -Fq "return '/newgrf'" dist-yandex-v14/openttd-bundled-addons.js
          ! grep -Fq 'bridge.playgama.com' dist-yandex-v14/index.html
          ! grep -Fq 'platform-bridge-loader.js' dist-yandex-v14/index.html
          ! test -e dist-yandex-v14/openttd-playgama-fixes.js
          test "$(stat -c%s dist-yandex-v14/openttd-runtime.js)" -gt 20000000
          ! grep -Fq 'const COMPETITORS =' dist-yandex-v14/openttd-yandex-fixes.js
          ! grep -Fq 'const COMPETITOR_INTERVAL =' dist-yandex-v14/openttd-yandex-fixes.js
          ! grep -Fq "'max_no_competitors = 3'" dist-yandex-v14/yandex-bridge.js
          ! grep -Fq "'competitors_interval = 0'" dist-yandex-v14/yandex-bridge.js

      - name: Create Yandex Games candidate ZIP
        shell: bash
        run: |
          set -euo pipefail
          (cd dist-yandex-v14 && zip -9 -X -r ../openttd-yandexgames-v14-single-file-fixed.zip .)
          unzip -t openttd-yandexgames-v14-single-file-fixed.zip
          sha256sum openttd-yandexgames-v14-single-file-fixed.zip > openttd-yandexgames-v14-single-file-fixed.zip.sha256

      - name: Upload Playgama smoke candidate
        uses: actions/upload-artifact@v4
        with:
          name: candidate-openttd-playgama-v14-single-file-fixed
          path: |
            openttd-playgama-v14-single-file-fixed.zip
            openttd-playgama-v14-single-file-fixed.zip.sha256
          if-no-files-found: error

      - name: Upload Yandex Games smoke candidate
        uses: actions/upload-artifact@v4
        with:
          name: candidate-openttd-yandexgames-v14-single-file-fixed
          path: |
            openttd-yandexgames-v14-single-file-fixed.zip
            openttd-yandexgames-v14-single-file-fixed.zip.sha256
          if-no-files-found: error

  smoke-test:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout smoke test
        uses: actions/checkout@v4

      - name: Download Playgama candidate
        uses: actions/download-artifact@v4
        with:
          name: candidate-openttd-playgama-v14-single-file-fixed
          path: candidate-playgama

      - name: Download Yandex Games candidate
        uses: actions/download-artifact@v4
        with:
          name: candidate-openttd-yandexgames-v14-single-file-fixed
          path: candidate-yandex

      - name: Verify candidate checksums and unpack
        shell: bash
        run: |
          set -euo pipefail
          (cd candidate-playgama && sha256sum -c openttd-playgama-v14-single-file-fixed.zip.sha256)
          (cd candidate-yandex && sha256sum -c openttd-yandexgames-v14-single-file-fixed.zip.sha256)
          rm -rf /tmp/smoke-playgama /tmp/smoke-yandex
          mkdir -p /tmp/smoke-playgama /tmp/smoke-yandex
          unzip -q candidate-playgama/openttd-playgama-v14-single-file-fixed.zip -d /tmp/smoke-playgama
          unzip -q candidate-yandex/openttd-yandexgames-v14-single-file-fixed.zip -d /tmp/smoke-yandex
          test -s /tmp/smoke-playgama/openttd-runtime.js
          test -s /tmp/smoke-yandex/openttd-runtime.js
          test ! -e /tmp/smoke-playgama/openttd.wasm
          test ! -e /tmp/smoke-playgama/openttd.data
          test ! -e /tmp/smoke-yandex/openttd.wasm
          test ! -e /tmp/smoke-yandex/openttd.data
          test -s /tmp/smoke-yandex/openttd-ai-prerun.js
          test -s /tmp/smoke-yandex/openttd-full-viewport.js
          test -s /tmp/smoke-yandex/openttd-ranking-core.js
          test -s /tmp/smoke-yandex/openttd-global-ranking.js
          grep -Fq "const LEADERBOARD_NAME = 'companyrating';" /tmp/smoke-yandex/openttd-global-ranking.js
          grep -Fq 'openttd.localRanking.v4' /tmp/smoke-yandex/openttd-ranking-core.js
          grep -Fq 'BUNDLED_STATIC_CONTENT_PATHS' /tmp/smoke-yandex/openttd-ai-prerun.js

      - name: Install browser test driver
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser
          npm install --no-save --ignore-scripts playwright-core@1.55.0

      - name: Launch Playgama directly from file
        shell: bash
        run: |
          set -euo pipefail
          node playgama/smoke-direct-file.cjs /tmp/smoke-playgama Playgama "$PWD/smoke-playgama.png"

      - name: Launch Yandex Games directly from file
        shell: bash
        run: |
          set -euo pipefail
          node playgama/smoke-direct-file.cjs /tmp/smoke-yandex YandexGames "$PWD/smoke-yandex.png"

      - name: Upload tested Playgama archive
        uses: actions/upload-artifact@v4
        with:
          name: openttd-playgama-v14-single-file-fixed
          path: |
            candidate-playgama/openttd-playgama-v14-single-file-fixed.zip
            candidate-playgama/openttd-playgama-v14-single-file-fixed.zip.sha256
          if-no-files-found: error

      - name: Upload tested Yandex Games archive
        uses: actions/upload-artifact@v4
        with:
          name: openttd-yandexgames-v14-single-file-fixed
          path: |
            candidate-yandex/openttd-yandexgames-v14-single-file-fixed.zip
            candidate-yandex/openttd-yandexgames-v14-single-file-fixed.zip.sha256
          if-no-files-found: error

      - name: Upload launch-test screenshots
        uses: actions/upload-artifact@v4
        with:
          name: openttd-v14-direct-file-smoke-evidence
          path: |
            smoke-playgama.png
            smoke-yandex.png
          if-no-files-found: error
