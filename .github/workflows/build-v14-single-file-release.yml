name: Build final single-file Playgama + Yandex archives

on:
  push:
    branches:
      - feature/global-ranking-tutorial
    paths:
      - '.github/workflows/build-v14-single-file-release.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  V8_ARTIFACT_ID: '9306987648'
  LEGACY_BUILD_REF: fix/direct-file-launch

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    container:
      image: emscripten/emsdk:3.1.57

    steps:
      - name: Checkout root-fix sources
        uses: actions/checkout@v4

      - name: Checkout tested single-file browser pipeline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.LEGACY_BUILD_REF }}
          path: legacy

      - name: Wire current native fixes into tested single-file pipeline
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'OpenTTDLab==0.0.75'

          cp playgama/patch-playgama-newgrf-main-menu.py legacy/ci/patch-playgama-newgrf-main-menu.py
          cp playgama/patch-browser-ranking.py legacy/ci/patch-browser-ranking.py

          python3 -m py_compile \
            legacy/ci/patch-playgama-newgrf-main-menu.py \
            legacy/ci/patch-browser-ranking.py \
            playgama/patch-browser-ranking-core.py \
            playgama/patch-browser-ranking-readable.py \
            playgama/patch-browser-ranking-strict.py \
            playgama/patch-browser-font-web.py \
            playgama/patch-browser-tutorial.py \
            playgama/patch-browser-tutorial-toolbar.py \
            playgama/patch-browser-tutorial-level.py \
            playgama/patch-browser-tutorial-native-layout.py \
            playgama/patch-browser-tutorial-objectives.py \
            playgama/patch-browser-tutorial-compile-fix.py \
            playgama/patch-browser-tutorial-final-polish.py \
            playgama/patch-browser-tutorial-v15-compat.py \
            playgama/patch-browser-tutorial-real-objectives.py \
            playgama/patch-browser-tutorial-clean-ui.py \
            playgama/patch-browser-ai-static.py \
            playgama/patch-browser-ai-runtime-v2.py \
            playgama/patch-browser-startup-watchdog.py \
            playgama/patch-browser-build-performance.py \
            playgama/install-classic-ai-package.py

          python3 - <<'PY'
          from pathlib import Path

          p = Path('legacy/ci/build-yandex-release.sh')
          text = p.read_text(encoding='utf-8')
          ai_off = "    'python3 ci/patch-yandex-ai-offline.py\\n'\n"
          if text.count(ai_off) != 1:
              raise SystemExit(f'Expected one legacy AI-disable hook, got {text.count(ai_off)}')
          text = text.replace(ai_off, '', 1)

          anchor = "    'python3 ci/patch-yandex-runtime-cleanup.py source\\n'\n"
          additions = (
              "    'python3 ci/patch-playgama-newgrf-main-menu.py\\n'\n"
              "    'python3 ci/patch-browser-ranking.py\\n'\n"
          )
          if text.count(anchor) != 1:
              raise SystemExit(f'Expected one source-patch anchor, got {text.count(anchor)}')
          text = text.replace(anchor, anchor + additions, 1)
          p.write_text(text, encoding='utf-8')

          build = Path('legacy/ci/build-final.sh')
          b = build.read_text(encoding='utf-8')
          anchor = 'mkdir -p openttd/build/yandex_baseset /tmp/ottd-assets\n'
          addition = (
              anchor
              + 'cp openttd/media/baseset/OpenTTD-Sans.ttf openttd/media/baseset/OpenTTD-Small.ttf '
              + 'openttd/media/baseset/OpenTTD-Serif.ttf openttd/media/baseset/OpenTTD-Mono.ttf '
              + 'openttd/build/yandex_baseset/\n'
          )
          if b.count(anchor) != 1:
              raise SystemExit('Could not find font staging anchor')
          build.write_text(b.replace(anchor, addition, 1), encoding='utf-8')
          PY

          # Keep the conservative runtime profile. The tested legacy wrapper
          # itself supplies SINGLE_FILE=1 + embedded assets.
          python3 playgama/patch-browser-build-performance.py legacy/ci/build-final.sh

      - name: Rebuild OpenTTD 15.3 single-file runtime
        working-directory: legacy
        shell: bash
        run: |
          set -euo pipefail
          bash ci/build-yandex-release.sh
          test -s OpenTTD-YandexGames-Direct.zip

          rm -rf /tmp/v14-native
          mkdir -p /tmp/v14-native
          unzip -q OpenTTD-YandexGames-Direct.zip -d /tmp/v14-native

          # Validate the produced bytes, not fragile source formatting.
          test -s /tmp/v14-native/openttd.js
          test ! -e /tmp/v14-native/openttd.wasm
          test ! -e /tmp/v14-native/openttd.data
          test "$(stat -c%s /tmp/v14-native/openttd.js)" -gt 20000000
          node --check /tmp/v14-native/openttd.js
          ! grep -Fq 'Preparing game data...' /tmp/v14-native/openttd.js

      - name: Assemble current Playgama package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V8_ARTIFACT_ID}/zip" \
            -o /tmp/v8-artifact.zip

          rm -rf /tmp/v8-artifact dist-v14 /tmp/rebuilt-runtime /tmp/classic-ai
          mkdir -p /tmp/v8-artifact dist-v14 /tmp/rebuilt-runtime /tmp/classic-ai
          unzip -q /tmp/v8-artifact.zip -d /tmp/v8-artifact
          inner="$(find /tmp/v8-artifact -type f -name 'openttd-playgama-v8-addons-licenses.zip' -print -quit)"
          test -s "$inner"
          unzip -q "$inner" -d dist-v14

          python3 playgama/upgrade_playgama_v10.py dist-v14 \
            --loader playgama/openttd-bundled-addons.js \
            --cloud-saves playgama/openttd-playgama-cloud-saves.js \
            --adapter playgama/playgama-yandex-compat.js
          cp playgama/playgama-bridge-config.json dist-v14/playgama-bridge-config.json
          python3 playgama/build-license-bundle.py dist-v14 --repo-license LICENSE

      - name: Install SimpleAI and single-file native runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 playgama/build-simple-ai-bundle.py \
            --output-js /tmp/classic-ai/openttd-classic-ai.js \
            --output-manifest /tmp/classic-ai/OPENTTD-CLASSIC-AI-MANIFEST.json
          python3 playgama/install-classic-ai-package.py dist-v14 \
            --bundle /tmp/classic-ai/openttd-classic-ai.js \
            --manifest /tmp/classic-ai/OPENTTD-CLASSIC-AI-MANIFEST.json

          unzip -q legacy/OpenTTD-YandexGames-Direct.zip -d /tmp/rebuilt-runtime
          test -s /tmp/rebuilt-runtime/openttd.js
          test ! -e /tmp/rebuilt-runtime/openttd.wasm
          test ! -e /tmp/rebuilt-runtime/openttd.data
          rm -f dist-v14/openttd.wasm dist-v14/openttd.data
          cp /tmp/rebuilt-runtime/openttd.js dist-v14/openttd-runtime.js

          node --check dist-v14/openttd-runtime.js
          node --check dist-v14/openttd-classic-ai.js
          node --check dist-v14/openttd-ranking-core.js
          node --check dist-v14/openttd-playgama-fixes.js
          node --check dist-v14/yandex-bridge.js
          test "$(stat -c%s dist-v14/openttd-runtime.js)" -gt 20000000
          test ! -e dist-v14/openttd.wasm
          test ! -e dist-v14/openttd.data
          ! grep -Fq 'Preparing game data...' dist-v14/openttd-runtime.js
          ! grep -Fq 'const COMPETITORS =' dist-v14/openttd-playgama-fixes.js
          ! grep -Fq 'const COMPETITOR_INTERVAL =' dist-v14/openttd-playgama-fixes.js
          ! grep -Fq "'max_no_competitors = 3'" dist-v14/yandex-bridge.js
          ! grep -Fq "'competitors_interval = 0'" dist-v14/yandex-bridge.js

      - name: Create Playgama ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -s dist-v14/index.html
          test -s dist-v14/openttd-runtime.js
          test ! -e dist-v14/openttd.wasm
          test ! -e dist-v14/openttd.data
          test -s dist-v14/openttd-classic-ai.js
          (cd dist-v14 && zip -9 -X -r ../openttd-playgama-v14-single-file-fixed.zip .)
          unzip -t openttd-playgama-v14-single-file-fixed.zip
          sha256sum openttd-playgama-v14-single-file-fixed.zip > openttd-playgama-v14-single-file-fixed.zip.sha256

      - name: Convert exact Playgama base to Yandex Games
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-yandex-v14
          cp -a dist-v14 dist-yandex-v14
          python3 yandex/package_yandex_from_playgama.py dist-yandex-v14

          test -s dist-yandex-v14/index.html
          test -s dist-yandex-v14/openttd-runtime.js
          test ! -e dist-yandex-v14/openttd.wasm
          test ! -e dist-yandex-v14/openttd.data
          test -s dist-yandex-v14/openttd-classic-ai.js
          test -s dist-yandex-v14/openttd-yandex-fixes.js
          test -s dist-yandex-v14/yandex-bridge.js
          node --check dist-yandex-v14/openttd-runtime.js
          node --check dist-yandex-v14/openttd-ranking-core.js
          node --check dist-yandex-v14/openttd-yandex-fixes.js
          node --check dist-yandex-v14/yandex-bridge.js
          grep -Fq '/sdk.js' dist-yandex-v14/yandex-bootstrap.js
          ! grep -Fq 'bridge.playgama.com' dist-yandex-v14/index.html
          ! test -e dist-yandex-v14/openttd-playgama-fixes.js
          test "$(stat -c%s dist-yandex-v14/openttd-runtime.js)" -gt 20000000
          ! grep -Fq 'Preparing game data...' dist-yandex-v14/openttd-runtime.js
          ! grep -Fq 'const COMPETITORS =' dist-yandex-v14/openttd-yandex-fixes.js
          ! grep -Fq 'const COMPETITOR_INTERVAL =' dist-yandex-v14/openttd-yandex-fixes.js
          ! grep -Fq "'max_no_competitors = 3'" dist-yandex-v14/yandex-bridge.js
          ! grep -Fq "'competitors_interval = 0'" dist-yandex-v14/yandex-bridge.js

      - name: Create Yandex Games ZIP
        shell: bash
        run: |
          set -euo pipefail
          (cd dist-yandex-v14 && zip -9 -X -r ../openttd-yandexgames-v14-single-file-fixed.zip .)
          unzip -t openttd-yandexgames-v14-single-file-fixed.zip
          sha256sum openttd-yandexgames-v14-single-file-fixed.zip > openttd-yandexgames-v14-single-file-fixed.zip.sha256

      - name: Upload Playgama archive
        uses: actions/upload-artifact@v4
        with:
          name: openttd-playgama-v14-single-file-fixed
          path: |
            openttd-playgama-v14-single-file-fixed.zip
            openttd-playgama-v14-single-file-fixed.zip.sha256
          if-no-files-found: error

      - name: Upload Yandex Games archive
        uses: actions/upload-artifact@v4
        with:
          name: openttd-yandexgames-v14-single-file-fixed
          path: |
            openttd-yandexgames-v14-single-file-fixed.zip
            openttd-yandexgames-v14-single-file-fixed.zip.sha256
          if-no-files-found: error
