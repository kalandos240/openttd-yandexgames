name: Build v14 Yandex adaptive desktop-mobile V24

on:
  push:
    branches:
      - fix/v14-yandex-adaptive-v24-host-resize-recovery
    paths:
      - 'ci/patch-yandex-adaptive-package-v24.py'
      - '.github/workflows/build-v14-yandex-adaptive-v24.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  V23_ARTIFACT_ID: '9935792511'

jobs:
  build-yandex-adaptive-v24:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout V24 branch
        uses: actions/checkout@v4

      - name: Download verified V23 package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v23 /tmp/package /tmp/out
          mkdir -p /tmp/v23 /tmp/package /tmp/out
          curl -fL --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V23_ARTIFACT_ID}/zip" \
            -o /tmp/v23-artifact.zip
          unzip -q /tmp/v23-artifact.zip -d /tmp/v23
          V23="$(find /tmp/v23 -type f -name 'OpenTTD-v14-Yandex-Adaptive-Desktop-Mobile-V23.zip' -print -quit)"
          test -s "$V23"
          unzip -q "$V23" -d /tmp/package

      - name: Apply V24 host-aware resize recovery
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ci/patch-yandex-adaptive-package-v24.py
          python3 ci/patch-yandex-adaptive-package-v24.py /tmp/package

      - name: Validate V24 invariants
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/package/index.html
          test -s /tmp/package/openttd-runtime.js
          test -s /tmp/package/openttd-yandex-mobile.js
          test -s /tmp/package/openttd-full-viewport.js
          test -s /tmp/package/openttd-vanilla-migration.js
          test -s /tmp/package/openttd-classic-ai.js
          test ! -e /tmp/package/addons
          test ! -e /tmp/package/licenses/addons
          test "$(find /tmp/package -type f \( -iname '*.grf' -o -iname '*.grf.bin' -o -iname '*.tar.bin' \) | wc -l)" -eq 0

          # V21/V22/V23 verified behavior is carried forward from the V23 artifact.
          grep -Fq '_em_openttd_set_touch_ui' /tmp/package/openttd-runtime.js
          grep -Fq '_em_openttd_touch_mouse_event' /tmp/package/openttd-runtime.js
          grep -Fq '_em_openttd_touch_context' /tmp/package/openttd-runtime.js
          grep -Fq '_em_openttd_touch_pan' /tmp/package/openttd-runtime.js
          grep -Fq 'V8-deferred-fixed-placement' /tmp/package/openttd-yandex-mobile.js
          grep -Fq "if (gestureMode === 'place')" /tmp/package/openttd-yandex-mobile.js
          grep -Fq 'stats.placementTaps++' /tmp/package/openttd-yandex-mobile.js
          grep -Fq 'V21: calledRun is the Emscripten lifecycle signal' /tmp/package/openttd-yandex-mobile.js
          grep -Fq "['openttd.cfg', 'openttd-mobile.cfg']" /tmp/package/openttd-vanilla-migration.js

          # V24: host-aware recovery on top of V23 child viewport handling.
          grep -Fq 'Adaptive V24 host-aware full-viewport desktop + touch layout.' /tmp/package/openttd-full-viewport.js
          grep -Fq 'const hostOuter = () => ({' /tmp/package/openttd-full-viewport.js
          grep -Fq 'deltaHeight: Math.max(0, outer.height - raw.height)' /tmp/package/openttd-full-viewport.js
          grep -Fq 'const recoverDesktopBox = raw => {' /tmp/package/openttd-full-viewport.js
          grep -Fq 'raw.height < expectedHeight * 0.86' /tmp/package/openttd-full-viewport.js
          grep -Fq 'window.openttdGetAdaptiveHostResizeState' /tmp/package/openttd-full-viewport.js
          grep -Fq 'const nudgeYandexShellOnGesture = event => {' /tmp/package/openttd-full-viewport.js
          grep -Fq 'fullscreen.request()' /tmp/package/openttd-full-viewport.js
          grep -Fq 'fullscreen.exit()' /tmp/package/openttd-full-viewport.js
          grep -Fq "window.addEventListener('pointerup', nudgeYandexShellOnGesture" /tmp/package/openttd-full-viewport.js
          grep -Fq 'module.setCanvasSize(box.width, box.height)' /tmp/package/openttd-full-viewport.js
          ! grep -Fq 'MAX_DESKTOP_ASPECT_RATIO' /tmp/package/openttd-full-viewport.js
          ! grep -Fq 'setInterval(apply, 250)' /tmp/package/openttd-full-viewport.js

          # Autonomous/Yandex-only rules remain unchanged.
          grep -Fq '/sdk.js' /tmp/package/yandex-bootstrap.js
          ! grep -RniE 'playgama|playgamma' /tmp/package --include='*.html' --include='*.js' --include='*.json'
          ! grep -RniE 'https?://' /tmp/package --include='*.html' --include='*.js' --exclude='openttd-runtime.js'
          ! grep -RniF 'early-vehicle-set-0.0.2.grf' /tmp/package

          node --check /tmp/package/openttd-yandex-mobile.js
          node --check /tmp/package/openttd-full-viewport.js
          node --check /tmp/package/openttd-vanilla-migration.js
          node --check /tmp/package/yandex-bridge.js
          node --check /tmp/package/openttd-yandex-fixes.js
          node --check /tmp/package/openttd-runtime.js

          UNPACKED="$(find /tmp/package -type f -printf '%s\n' | awk '{s+=$1} END {print s+0}')"
          test "$UNPACKED" -lt 100000000
          echo "adaptive_v24_unpacked_bytes=$UNPACKED"

      - name: Create V24 archive
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/package && zip -9 -r /tmp/out/OpenTTD-v14-Yandex-Adaptive-Desktop-Mobile-V24.zip .)
          unzip -t /tmp/out/OpenTTD-v14-Yandex-Adaptive-Desktop-Mobile-V24.zip >/dev/null
          sha256sum /tmp/out/OpenTTD-v14-Yandex-Adaptive-Desktop-Mobile-V24.zip | tee /tmp/out/SHA256SUMS.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('/tmp/package')
          z=Path('/tmp/out/OpenTTD-v14-Yandex-Adaptive-Desktop-Mobile-V24.zip')
          unpacked=sum(p.stat().st_size for p in root.rglob('*') if p.is_file())
          report=(
              'OpenTTD v14 Yandex adaptive desktop-mobile V24\n'
              'base_line=verified_V23_plus_host_geometry_recovery\n'
              'desktop_devtools_stale_height_recovery=host_outer_delta_baseline\n'
              'yandex_shell_resize_nudge=one_guarded_fullscreen_request_exit_on_trusted_gesture\n'
              'mobile_v8_release_placement_preserved=true\n'
              'mobile_native_tooltips=false\n'
              'desktop_native_tooltips=true\n'
              'v21_newgrf_cleanup_preserved=true\n'
              'simpleai_preserved=true\n'
              'optimization_changes=false\n'
              'bundled_newgrf_count=0\n'
              f'unpacked_file_bytes={unpacked}\n'
              f'zip_sha256={hashlib.sha256(z.read_bytes()).hexdigest()}\n'
          )
          Path('/tmp/out/YANDEX-ADAPTIVE-V24-RESULTS.txt').write_text(report,encoding='utf-8')
          print(report)
          PY

      - name: Upload V24 adaptive release
        uses: actions/upload-artifact@v4
        with:
          name: openttd-v14-yandex-adaptive-desktop-mobile-v24
          path: |
            /tmp/out/OpenTTD-v14-Yandex-Adaptive-Desktop-Mobile-V24.zip
            /tmp/out/SHA256SUMS.txt
            /tmp/out/YANDEX-ADAPTIVE-V24-RESULTS.txt
          if-no-files-found: error
