name: Build v14 Yandex mobile touch-pan V5

on:
  push:
    branches:
      - feature/v14-mobile-adaptive
    paths:
      - 'ci/patch-yandex-mobile-pan-v5.py'
      - '.github/workflows/build-v14-yandex-mobile-touchpan-v5.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  V3_ARTIFACT_ID: '9866771365'
  NATIVE_RUN_ID: '33693806350'

jobs:
  build-yandex-mobile-touchpan-v5:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Checkout mobile branch
        uses: actions/checkout@v4

      - name: Wait for direct-pan native runtime
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 180); do
            JSON="$(curl -fsSL --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${NATIVE_RUN_ID}")"
            STATUS="$(printf '%s' "$JSON" | python3 -c 'import sys,json; print(json.load(sys.stdin)["status"])')"
            CONCLUSION="$(printf '%s' "$JSON" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("conclusion") or "")')"
            echo "native_run_status=${STATUS} conclusion=${CONCLUSION}"
            if [ "$STATUS" = completed ]; then
              test "$CONCLUSION" = success
              exit 0
            fi
            sleep 30
          done
          echo 'Timed out waiting for direct-pan runtime' >&2
          exit 1

      - name: Download crisp V3 and direct-pan runtime
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v3 /tmp/native-art /tmp/native-pkg /tmp/mobile /tmp/out
          mkdir -p /tmp/v3 /tmp/native-art /tmp/native-pkg /tmp/mobile /tmp/out

          curl -fL --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V3_ARTIFACT_ID}/zip" \
            -o /tmp/v3-artifact.zip
          unzip -q /tmp/v3-artifact.zip -d /tmp/v3
          V3="$(find /tmp/v3 -type f -name 'OpenTTD-v14-Yandex-Mobile-Crisp-Fullscreen-V3.zip' -print -quit)"
          test -s "$V3"
          unzip -q "$V3" -d /tmp/mobile

          ARTIFACTS="$(curl -fsSL --retry 5 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${NATIVE_RUN_ID}/artifacts")"
          NATIVE_ID="$(printf '%s' "$ARTIFACTS" | python3 -c 'import sys,json; d=json.load(sys.stdin); xs=[a for a in d.get("artifacts",[]) if a.get("name")=="openttd-v14-yandex-mobile-hidpi-fullscreen-release"]; print(xs[0]["id"] if xs else "")')"
          test -n "$NATIVE_ID"
          echo "native_artifact_id=$NATIVE_ID"

          curl -fL --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${NATIVE_ID}/zip" \
            -o /tmp/native-artifact.zip
          unzip -q /tmp/native-artifact.zip -d /tmp/native-art
          NATIVE_ZIP="$(find /tmp/native-art -type f -name 'OpenTTD-v14-Yandex-Mobile-HiDPI-Fullscreen-Release.zip' -print -quit)"
          test -s "$NATIVE_ZIP"
          unzip -q "$NATIVE_ZIP" -d /tmp/native-pkg
          test -s /tmp/native-pkg/openttd-runtime.js
          cp /tmp/native-pkg/openttd-runtime.js /tmp/mobile/openttd-runtime.js

      - name: Apply V5 direct viewport touch pan
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ci/patch-yandex-mobile-pan-v5.py
          python3 ci/patch-yandex-mobile-pan-v5.py /tmp/mobile

      - name: Validate V5 package
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/mobile/index.html
          test -s /tmp/mobile/openttd-runtime.js
          test -s /tmp/mobile/openttd-yandex-mobile.js
          test -s /tmp/mobile/openttd-full-viewport.js
          test -s /tmp/mobile/openttd-classic-ai.js
          test ! -e /tmp/mobile/addons
          test ! -e /tmp/mobile/licenses/addons
          test "$(find /tmp/mobile -type f \( -iname '*.grf' -o -iname '*.grf.bin' -o -iname '*.tar.bin' \) | wc -l)" -eq 0

          # Direct native viewport pan must be exported and used by JS.
          grep -Fq '_em_openttd_touch_pan' /tmp/mobile/openttd-runtime.js
          grep -Fq '_em_openttd_touch_mouse_event' /tmp/mobile/openttd-runtime.js
          grep -Fq 'V5-direct-viewport-pan' /tmp/mobile/openttd-yandex-mobile.js
          grep -Fq 'module._em_openttd_touch_pan' /tmp/mobile/openttd-yandex-mobile.js
          grep -Fq 'const nativePan = (p, previous)' /tmp/mobile/openttd-yandex-mobile.js
          grep -Fq 'nativePan(p, last)' /tmp/mobile/openttd-yandex-mobile.js
          grep -Fq 'panConsumed' /tmp/mobile/openttd-yandex-mobile.js
          grep -Fq '__openttdMobileTouchStats' /tmp/mobile/openttd-yandex-mobile.js

          # Drag must no longer synthesize a held LMB sequence.
          ! grep -Fq 'nativeEvent(1, down)' /tmp/mobile/openttd-yandex-mobile.js
          ! grep -Fq 'nativeEvent(0, p)' /tmp/mobile/openttd-yandex-mobile.js

          # Keep known-good V3 crisp fullscreen presentation.
          grep -Fq 'Module.setCanvasSize(box.width, box.height)' /tmp/mobile/openttd-full-viewport.js
          ! grep -Fq 'backingWidth' /tmp/mobile/openttd-full-viewport.js
          ! grep -Fq 'MAX_TOUCH_DPR' /tmp/mobile/openttd-full-viewport.js
          grep -Fq 'cursor: none !important' /tmp/mobile/openttd-yandex-mobile.js

          # Portal/release invariants.
          grep -Fq '/sdk.js' /tmp/mobile/yandex-bootstrap.js
          grep -Fq "const CLOUD_CONFIG_KEY = 'openttdMobileConfigV1';" /tmp/mobile/yandex-bridge.js
          ! grep -RniE 'playgama|playgamma' /tmp/mobile --include='*.html' --include='*.js' --include='*.json'
          ! grep -RniE 'https?://' /tmp/mobile --include='*.html' --include='*.js' --exclude='openttd-runtime.js'

          node --check /tmp/mobile/openttd-yandex-mobile.js
          node --check /tmp/mobile/openttd-full-viewport.js
          node --check /tmp/mobile/yandex-bridge.js
          node --check /tmp/mobile/openttd-yandex-fixes.js
          node --check /tmp/mobile/openttd-runtime.js

          UNPACKED="$(find /tmp/mobile -type f -printf '%s\n' | awk '{s+=$1} END {print s+0}')"
          test "$UNPACKED" -lt 100000000
          echo "mobile_v5_unpacked_bytes=$UNPACKED"

      - name: Create V5 archive
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/mobile && zip -9 -r /tmp/out/OpenTTD-v14-Yandex-Mobile-DirectPan-V5.zip .)
          unzip -t /tmp/out/OpenTTD-v14-Yandex-Mobile-DirectPan-V5.zip >/dev/null
          sha256sum /tmp/out/OpenTTD-v14-Yandex-Mobile-DirectPan-V5.zip | tee /tmp/out/SHA256SUMS.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('/tmp/mobile')
          z=Path('/tmp/out/OpenTTD-v14-Yandex-Mobile-DirectPan-V5.zip')
          unpacked=sum(p.stat().st_size for p in root.rglob('*') if p.is_file())
          report=(
              'OpenTTD v14 Yandex mobile direct-pan V5\n'
              'base_visual=crisp-fullscreen-v3\n'
              'touch_pan_path=Window::OnScroll_direct\n'
              'desktop_mouse_scroll_state_bypassed=true\n'
              'native_viewport_hit_test=true\n'
              'tap=SDL_LMB_click\n'
              'long_press=SDL_RMB_click\n'
              'pinch_zoom=SDL_mousewheel\n'
              'touch_debug_stats=window.__openttdMobileTouchStats\n'
              'native_software_cursor=false\n'
              'browser_cursor=false\n'
              'logical_framebuffer_1to1=true\n'
              'simpleai_preserved=true\n'
              'bundled_newgrf_count=0\n'
              f'unpacked_file_bytes={unpacked}\n'
              f'zip_sha256={hashlib.sha256(z.read_bytes()).hexdigest()}\n'
          )
          Path('/tmp/out/YANDEX-MOBILE-V5-RESULTS.txt').write_text(report,encoding='utf-8')
          print(report)
          PY

      - name: Upload V5 release
        uses: actions/upload-artifact@v4
        with:
          name: openttd-v14-yandex-mobile-directpan-v5
          path: |
            /tmp/out/OpenTTD-v14-Yandex-Mobile-DirectPan-V5.zip
            /tmp/out/SHA256SUMS.txt
            /tmp/out/YANDEX-MOBILE-V5-RESULTS.txt
          if-no-files-found: error
