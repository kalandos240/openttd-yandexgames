name: Export v14 Puppeteer controller

on:
  push:
    branches:
      - perf/v14-simpleai-bridge-cache
    paths:
      - '.github/workflows/export-v14-puppeteer-controller.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Install pinned browser controller
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v14-browser-node
          cd /tmp/v14-browser-node
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund puppeteer-core@24.16.0
          node -e "const p=require('puppeteer-core/package.json'); if(p.version!=='24.16.0') process.exit(1); console.log(p.version)"
      - uses: actions/upload-artifact@v4
        with:
          name: v14-puppeteer-core-24.16.0
          compression-level: 0
          path: /tmp/v14-browser-node/
          if-no-files-found: error
