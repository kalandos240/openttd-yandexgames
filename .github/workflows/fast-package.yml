name: Fast OpenTTD Package

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk:3.1.57
    steps:
      - name: Checkout port repository
        uses: actions/checkout@v4
      - name: Assemble package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash ci/assemble-from-baseline.sh
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: openttd-yandexgames-fast
          path: openttd-yandexgames-fast.zip
          if-no-files-found: error
          retention-days: 14
