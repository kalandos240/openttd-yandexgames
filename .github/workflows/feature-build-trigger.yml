name: Trigger combined feature package

on:
  push:
    branches:
      - main
      - feature/global-ranking-tutorial
    paths:
      - '.github/workflows/feature-build-trigger.yml'
      - 'playgama/patch-browser-ranking-core.py'
      - 'playgama/patch-browser-tutorial.py'
      - 'playgama/patch-browser-tutorial-toolbar.py'
      - 'playgama/openttd-global-ranking.js'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch full Playgama and Yandex package build
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(printf '{\"ref\":\"%s\"}' "$TARGET_REF")"
          curl -fsSL --retry 3 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-v11-polished.yml/dispatches" \
            -d "$payload"
          echo "Dispatched full package build for ${TARGET_REF}."
