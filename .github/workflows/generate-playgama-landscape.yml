name: Generate Playgama landscape cover

on:
  push:
    branches:
      - main
    paths:
      - 'assets/playgama/cover-square-800x800.jpg'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate exact 1920x1080 cover
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter

          source = Path('assets/playgama/cover-square-800x800.jpg')
          target = Path('assets/playgama/cover-landscape-1920x1080.jpg')
          image = Image.open(source).convert('RGB')

          background = image.resize((1920, 1920), Image.Resampling.LANCZOS)
          top = (background.height - 1080) // 2
          background = background.crop((0, top, 1920, top + 1080)).filter(ImageFilter.GaussianBlur(18))

          foreground = image.resize((1040, 1040), Image.Resampling.LANCZOS)
          background.paste(foreground, ((1920 - 1040) // 2, 20))
          background.save(target, 'JPEG', quality=90, optimize=True, progressive=True)

          with Image.open(target) as check:
              assert check.size == (1920, 1080), check.size
          print(f'Generated {target} at 1920x1080')
          PY

      - name: Commit generated landscape cover
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/playgama/cover-landscape-1920x1080.jpg && git ls-files --error-unmatch assets/playgama/cover-landscape-1920x1080.jpg >/dev/null 2>&1; then
            echo 'Landscape cover is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/playgama/cover-landscape-1920x1080.jpg
          git commit -m 'Generate Playgama 1920x1080 cover'
          git push
