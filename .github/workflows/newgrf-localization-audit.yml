name: Audit bundled NewGRF localization

on:
  workflow_dispatch:
  push:
    branches:
      - feature/global-ranking-tutorial
    paths:
      - '.github/workflows/newgrf-localization-audit.yml'
      - 'playgama/newgrf-localization/**'

permissions:
  contents: read

env:
  IRON_HORSE_COMMIT: 'ec0523c6f80459ec40cb4488e9a23e5aaa3705c3'
  FIRS_COMMIT: '8844b7da36e919690322dcd69ffd9977e4e9a9c4'
  FIRS_RUSSIAN_BASE_COMMIT: 'f72116eb31d8823b1dd4e0c30319aefa66b11936'
  EARLY_COMMIT: 'ae1a35b127cf089bce697afee1bc7cb6a0608b2a'

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout integration
        uses: actions/checkout@v4

      - name: Fetch pinned NewGRF sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/addons
          mkdir -p /tmp/addons

          git clone --filter=blob:none https://github.com/andythenorth/firs.git /tmp/addons/firs
          git -C /tmp/addons/firs checkout "${FIRS_COMMIT}"
          git -C /tmp/addons/firs show "${FIRS_RUSSIAN_BASE_COMMIT}:src/grf/lang/russian.toml" > /tmp/firs-russian-base.toml

          git clone --filter=blob:none https://github.com/andythenorth/iron-horse.git /tmp/addons/iron-horse
          git -C /tmp/addons/iron-horse checkout "${IRON_HORSE_COMMIT}"

          git clone --filter=blob:none https://github.com/DonaldDuck313/OpenTTD-NewGRFs.git /tmp/addons/early
          git -C /tmp/addons/early checkout "${EARLY_COMMIT}"

      - name: Generate strict Russian FIRS table
        shell: bash
        run: |
          set -euo pipefail
          python3 playgama/newgrf-localization/prepare_firs_russian.py \
            --english /tmp/addons/firs/src/grf/lang/english.toml \
            --historical-russian /tmp/firs-russian-base.toml \
            --output /tmp/firs-russian-generated.toml

          # The generated table must parse and must use the Russian NewGRF id.
          python3 - <<'PY'
          import tomllib
          with open('/tmp/firs-russian-generated.toml', 'rb') as fh:
              data = tomllib.load(fh)
          assert data['GLOBAL_PRAGMA']['grflangid'] == '0x07'
          assert len(data) > 500
          print('FIRS strict Russian coverage OK:', len(data) - 1, 'strings')
          PY

      - name: Audit language coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import tomllib
          from pathlib import Path

          def load_toml(path: str):
              with open(path, 'rb') as fh:
                  return tomllib.load(fh)

          def sections_without_pragma(data):
              return {k: v for k, v in data.items() if k != 'GLOBAL_PRAGMA'}

          firs_en = sections_without_pragma(load_toml('/tmp/addons/firs/src/grf/lang/english.toml'))
          firs_ru = sections_without_pragma(load_toml('/tmp/firs-russian-generated.toml'))
          assert set(firs_en) == set(firs_ru), 'Generated FIRS Russian section coverage is incomplete'
          for section in firs_en:
              assert set(firs_en[section]) == set(firs_ru[section]), f'FIRS field mismatch: {section}'
          print(f'FIRS generated Russian sections: {len(firs_ru)}/{len(firs_en)}')

          iron_en = sections_without_pragma(load_toml('/tmp/addons/iron-horse/src/lang/english.toml'))
          print(f'IRON_HORSE English sections requiring Russian review: {len(iron_en)}')
          for item in sorted(iron_en):
              print('IRON_HORSE_SECTION', item)

          def read_lng_keys(path: str):
              keys = []
              for raw in Path(path).read_text(encoding='utf-8').splitlines():
                  line = raw.strip()
                  if not line or line.startswith('#') or ':' not in line:
                      continue
                  key = line.split(':', 1)[0].strip()
                  if key.startswith('STR_'):
                      keys.append(key)
              return keys

          early_en_path = '/tmp/addons/early/EarlyVehicleSet/lang/english.lng'
          early_ru_path = 'playgama/newgrf-localization/early-vehicle-set/russian.lng'
          en_keys = set(read_lng_keys(early_en_path))
          ru_keys = set(read_lng_keys(early_ru_path))
          print(f'EARLY English keys: {len(en_keys)}')
          print(f'EARLY Russian keys: {len(ru_keys)}')
          missing_early = sorted(en_keys - ru_keys)
          extra_early = sorted(ru_keys - en_keys)
          print('EARLY missing keys:', missing_early)
          print('EARLY extra keys:', extra_early)
          if missing_early:
              raise SystemExit('Early Vehicle Set Russian localization is incomplete')
          PY