name: Package Playgama v3 build

on:
  workflow_dispatch:
  push:
    paths:
      - 'playgama/**'
      - '.github/workflows/package-playgama.yml'

permissions:
  actions: read
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Playgama packaging files
        uses: actions/checkout@v4

      - name: Download pinned verified OpenTTD runtime
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED_ARTIFACT_ID: '9289589121'
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PINNED_ARTIFACT_ID}/zip" \
            -o /tmp/openttd-playgama-v1-artifact.zip
          rm -rf base-artifact dist-playgama
          mkdir base-artifact dist-playgama
          unzip -q /tmp/openttd-playgama-v1-artifact.zip -d base-artifact
          inner="$(find base-artifact -type f -name 'openttd-playgama.zip' -print -quit)"
          test -s "${inner}"
          unzip -q "${inner}" -d dist-playgama
          test -s dist-playgama/index.html
          test -s dist-playgama/openttd-runtime.js
          test -s dist-playgama/yandex-bridge.js
          test -s dist-playgama/openttd-shell-2.js

          # The packaging fixes below intentionally patch only the three browser
          # startup competitor defaults in openttd-runtime.js. Verify the exact
          # tested input before making any changes.
          echo 'e730bceadfef3a51adf9b830586a10df81801e697dd6726570287a6609001ce4  dist-playgama/openttd-runtime.js' | sha256sum -c -
          echo 'e85a89f0610fc178b75c8d3b8a23707d0c11f6bc27bbb4058724c4466ec2f6ff  dist-playgama/yandex-bridge.js' | sha256sum -c -
          echo 'af77f33fc3e0aad897400af1e8ba4b3c81732dce71b201b2be74fbecd2f681be  dist-playgama/openttd-shell-2.js' | sha256sum -c -

      - name: Build bundled classic AI payload from BaNaNaS
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'OpenTTDLab==0.0.75'

          python3 - <<'PY'
          from pathlib import Path
          import base64
          import json
          from openttdlab import download_from_bananas

          # SimpleAI content id from BaNaNaS. OpenTTDLab resolves and downloads
          # all direct/transitive AI-library dependencies from the content service.
          payload = {}
          manifest = []
          with download_from_bananas('ai/534d504c') as files:
              for item in files:
                  if len(item) == 5:
                      content_id, filename, license_name, md5, get_data = item
                  elif len(item) == 4:
                      content_id, filename, md5, get_data = item
                      license_name = 'unknown'
                  else:
                      raise RuntimeError(f'Unexpected BaNaNaS item: {item!r}')

                  with get_data() as chunks:
                      data = b''.join(chunks)
                  if not data:
                      raise RuntimeError(f'Empty BaNaNaS payload: {content_id}')

                  if str(content_id).startswith('ai/'):
                      relative = 'ai/' + filename
                  elif str(content_id).startswith(('ai-library/', 'ailibrary/')):
                      relative = 'ai/library/' + filename
                  else:
                      raise RuntimeError(f'Unexpected dependency type: {content_id}')

                  payload[relative] = base64.b64encode(data).decode('ascii')
                  manifest.append({
                      'content_id': content_id,
                      'filename': filename,
                      'license': str(license_name),
                      'md5': md5,
                      'bytes': len(data),
                      'install_path': relative,
                  })

          if not any(row['content_id'] == 'ai/534d504c' for row in manifest):
              raise RuntimeError('SimpleAI was not returned by BaNaNaS')
          if len(manifest) < 3:
              raise RuntimeError(f'Expected SimpleAI plus pathfinder dependencies, got {manifest!r}')

          out = Path('playgama/openttd-classic-ai.generated.js')
          out.write_text(
              '/* Generated in CI from OpenTTD BaNaNaS content and dependencies. */\n'
              'window.__openttdClassicAIArchives = ' + json.dumps(payload, separators=(',', ':')) + ';\n'
              'window.__openttdClassicAIManifest = ' + json.dumps(manifest, separators=(',', ':')) + ';\n',
              encoding='utf-8',
          )
          Path('playgama/openttd-classic-ai-manifest.json').write_text(
              json.dumps(manifest, indent=2), encoding='utf-8'
          )
          print(json.dumps(manifest, indent=2))
          print('Generated AI bundle bytes:', out.stat().st_size)
          PY
          node --check playgama/openttd-classic-ai.generated.js

      - name: Install Playgama Bridge v2 integration and QA fixes
        run: |
          set -euo pipefail
          python3 playgama/package_playgama.py dist-playgama \
            --adapter playgama/playgama-yandex-compat.js \
            --config playgama/playgama-bridge-config.json \
            --fixes playgama/openttd-playgama-fixes.js \
            --ai-bundle playgama/openttd-classic-ai.generated.js
          cp playgama/openttd-classic-ai-manifest.json dist-playgama/OPENTTD-CLASSIC-AI-MANIFEST.json

      - name: Validate Playgama v3 package
        run: |
          set -euo pipefail
          grep -q 'https://bridge.playgama.com/v2/stable/playgama-bridge.js' dist-playgama/index.html
          ! grep -q 'bridge.playgama.com/v1/' dist-playgama/index.html
          grep -q 'playgama-yandex-compat.js' dist-playgama/index.html
          grep -q 'openttd-classic-ai.js' dist-playgama/index.html
          grep -q 'openttd-playgama-fixes.js' dist-playgama/index.html
          grep -q "window.bridge.engine = 'javascript'" dist-playgama/playgama-yandex-compat.js
          grep -q "Bridge v2 required" dist-playgama/playgama-yandex-compat.js
          ! grep -q 'showRewardedVideo' dist-playgama/playgama-yandex-compat.js
          grep -q 'openttdConfigV1' dist-playgama/yandex-bridge.js
          grep -q 'openttdSaveV1' dist-playgama/yandex-bridge.js
          grep -q 'player.getData' dist-playgama/yandex-bridge.js
          grep -q 'player.setData' dist-playgama/yandex-bridge.js
          grep -q 'showFullscreenAdv' dist-playgama/yandex-bridge.js

          # Intentional OpenTTD-specific fixes.
          test "$(grep -ao 'max_no_competitors = 3' dist-playgama/openttd-runtime.js | wc -l)" -ge 3
          ! grep -aq 'max_no_competitors = 0' dist-playgama/openttd-runtime.js
          grep -q 'max_no_competitors = 3' dist-playgama/openttd-playgama-fixes.js
          grep -q 'english.lng' dist-playgama/openttd-playgama-fixes.js
          grep -q 'russian.lng' dist-playgama/openttd-playgama-fixes.js
          grep -q 'Browser.mainLoop.pause' dist-playgama/openttd-playgama-fixes.js
          grep -q 'PAUSE_STATE_CHANGED' dist-playgama/openttd-playgama-fixes.js
          grep -q 'AUDIO_STATE_CHANGED' dist-playgama/openttd-playgama-fixes.js
          grep -q 'aspect-ratio: 16 / 9' dist-playgama/openttd-playgama-fixes.js
          grep -q '__openttdClassicAIArchives' dist-playgama/openttd-classic-ai.js
          grep -q 'ai/534d504c' dist-playgama/OPENTTD-CLASSIC-AI-MANIFEST.json

          node --check dist-playgama/playgama-yandex-compat.js
          node --check dist-playgama/openttd-playgama-fixes.js
          node --check dist-playgama/openttd-classic-ai.js
          python3 -m json.tool dist-playgama/playgama-bridge-config.json >/dev/null
          python3 -m json.tool dist-playgama/OPENTTD-CLASSIC-AI-MANIFEST.json >/dev/null
          python3 - <<'PY'
          import json
          with open('dist-playgama/playgama-bridge-config.json', encoding='utf-8') as f:
              cfg = json.load(f)
          assert cfg['advertisement']['interstitial']['disable'] is False
          assert cfg['advertisement']['rewarded']['disable'] is True
          assert cfg['advertisement']['banner']['disable'] is True
          assert cfg['device']['supportedOrientations'] == ['landscape']
          with open('dist-playgama/OPENTTD-CLASSIC-AI-MANIFEST.json', encoding='utf-8') as f:
              manifest = json.load(f)
          assert any(row['content_id'] == 'ai/534d504c' for row in manifest)
          assert len(manifest) >= 3
          PY

          # Files unrelated to the targeted runtime startup patch stay identical
          # to the pinned tested package.
          echo 'e85a89f0610fc178b75c8d3b8a23707d0c11f6bc27bbb4058724c4466ec2f6ff  dist-playgama/yandex-bridge.js' | sha256sum -c -
          echo 'af77f33fc3e0aad897400af1e8ba4b3c81732dce71b201b2be74fbecd2f681be  dist-playgama/openttd-shell-2.js' | sha256sum -c -

          unpacked_bytes="$(du -sb dist-playgama | cut -f1)"
          echo "Unpacked Playgama bytes: ${unpacked_bytes}"
          test "${unpacked_bytes}" -lt 300000000

      - name: Create Playgama ZIP
        run: |
          set -euo pipefail
          (cd dist-playgama && zip -9 -X -r ../openttd-playgama-v3-fixed.zip .)
          unzip -t openttd-playgama-v3-fixed.zip
          ls -lh openttd-playgama-v3-fixed.zip

      - name: Upload Playgama v3 build
        uses: actions/upload-artifact@v4
        with:
          name: openttd-playgama-v3-fixed
          path: openttd-playgama-v3-fixed.zip
          if-no-files-found: error
          retention-days: 90
