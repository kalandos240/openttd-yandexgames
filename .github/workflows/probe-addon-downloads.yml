name: Probe OpenTTD addon HTTPS releases

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/.qa-v6-addons-probe'
      - '.github/workflows/probe-addon-downloads.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect official project release pages
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            'https://grf.farm/iron-horse/4.29.0/index.html' \
            'https://grf.farm/firs/5.2.0/index.html' \
            'https://grf.farm/road-hog/1.4.1/index.html'; do
            echo "===== ${url} ====="
            curl -fLsS --retry 3 "$url" -o /tmp/page.html
            grep -Eoi 'href=["'"'][^"'"']+["'"']' /tmp/page.html | sed -n '1,120p' || true
            grep -Eoi 'https?://[^"'"' <>]+' /tmp/page.html | sed -n '1,120p' || true
          done

      - name: Inspect GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for repo in \
            'UweDomaratius/GermanIndustries' \
            'DonaldDuck313/OpenTTD-NewGRFs' \
            'OpenTTD/OpenGFX2'; do
            echo "===== ${repo} releases ====="
            curl -fsSL --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${repo}/releases?per_page=10" \
              | python3 -c 'import json,sys; data=json.load(sys.stdin); [(print(r.get("tag_name"), r.get("name")), [print("  ",a.get("name"),a.get("size"),a.get("browser_download_url")) for a in r.get("assets",[])]) for r in data]'
          done
