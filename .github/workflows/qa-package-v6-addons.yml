name: QA package OpenTTD Playgama v6 add-ons

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qa-package-v6-addons.yml'
      - 'playgama/openttd-bundled-addons.js'
      - 'docs/PLAYGAMA_ADDONS.md'
      - 'docs/.qa-v6-addons-package'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  V5_ARTIFACT_ID: '9302568671'
  IRON_HORSE_COMMIT: 'ec0523c6f80459ec40cb4488e9a23e5aaa3705c3'
  FIRS_COMMIT: '8844b7da36e919690322dcd69ffd9977e4e9a9c4'
  EARLY_VEHICLE_CUTOFF: '2022-02-06T14:43:05Z'

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download verified v5 AI-enabled runtime
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V5_ARTIFACT_ID}/zip" \
            -o /tmp/v5-artifact.zip
          rm -rf /tmp/v5-artifact dist-playgama
          mkdir -p /tmp/v5-artifact dist-playgama
          unzip -q /tmp/v5-artifact.zip -d /tmp/v5-artifact
          inner="$(find /tmp/v5-artifact -type f -name '*.zip' -print -quit)"
          test -s "$inner"
          unzip -q "$inner" -d dist-playgama
          test -s dist-playgama/index.html
          test -s dist-playgama/openttd-runtime.js
          test -s dist-playgama/openttd-playgama-fixes.js
          test -s dist-playgama/openttd-classic-ai.js
          grep -q 'playgama-bridge' dist-playgama/index.html
          grep -q 'openttd-classic-ai.js' dist-playgama/index.html

      - name: Install NewGRF build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git make zip unzip xz-utils graphviz grfcodec
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            'nml==0.9.0' chameleon markdown pillow
          command -v nmlc
          command -v grfcodec
          nmlc --version

      - name: Build pinned GPL NewGRFs from source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf addon-work dist-addons
          mkdir -p addon-work dist-addons/addons dist-addons/licenses

          git clone --filter=blob:none https://github.com/andythenorth/iron-horse.git addon-work/iron-horse
          cd addon-work/iron-horse
          git checkout "${IRON_HORSE_COMMIT}"
          make grf GRF=horse PW=2 SD=True
          test -s generated/iron-horse.grf
          cp generated/iron-horse.grf ../../dist-addons/iron-horse-4.29.0.grf
          cp license.pt ../../dist-addons/licenses/iron-horse-GPL-2.0.txt
          cd ../..

          git clone --filter=blob:none https://github.com/andythenorth/firs.git addon-work/firs
          cd addon-work/firs
          git checkout "${FIRS_COMMIT}"
          make grf
          test -s generated/firs.grf
          cp generated/firs.grf ../../dist-addons/firs-5.2.0.grf
          if test -f license.pt; then cp license.pt ../../dist-addons/licenses/firs-GPL-2.0.txt; fi
          cd ../..

          git clone https://github.com/DonaldDuck313/OpenTTD-NewGRFs.git addon-work/early-repo
          cd addon-work/early-repo
          early_commit="$(git rev-list -1 --before="${EARLY_VEHICLE_CUTOFF}" main -- EarlyVehicleSet)"
          test -n "$early_commit"
          echo "$early_commit" | tee ../../dist-addons/EARLY-VEHICLE-SOURCE-COMMIT.txt
          git checkout "$early_commit"
          cd EarlyVehicleSet
          nmlc -c --grf=EarlyVehicleSet.grf EarlyVehicleSet.nml
          test -s EarlyVehicleSet.grf
          cp EarlyVehicleSet.grf ../../../dist-addons/early-vehicle-set-0.0.2.grf
          cp readme.md ../../../dist-addons/licenses/early-vehicle-set-readme.txt
          cd ../../..

          echo "Source-built NewGRFs:"
          sha256sum dist-addons/*.grf
          ls -lh dist-addons/*.grf

      - name: Download pinned HTTPS add-ons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p addon-work/road addon-work/gist addon-work/ogfx

          curl -fL --retry 5 --retry-all-errors \
            'https://bundles.openttdcoop.org/road-hog/releases/LATEST/road-hog-1.4.1.zip' \
            -o addon-work/road-hog-1.4.1.zip
          unzip -q addon-work/road-hog-1.4.1.zip -d addon-work/road
          road="$(find addon-work/road -type f -iname '*.grf' -print -quit)"
          test -s "$road"
          test "$(md5sum "$road" | cut -c1-8)" = '04acd20a'
          cp "$road" dist-addons/road-hog-1.4.1.grf
          road_license="$(find addon-work/road -type f \( -iname 'license*' -o -iname 'copying*' \) -print -quit || true)"
          if test -n "$road_license"; then cp "$road_license" dist-addons/licenses/road-hog-GPL-2.0.txt; fi

          curl -fL --retry 5 --retry-all-errors \
            'https://github.com/UweDomaratius/GermanIndustries/releases/download/v0.21.10/german_industries.zip' \
            -o addon-work/gist-0.21.10.zip
          unzip -q addon-work/gist-0.21.10.zip -d addon-work/gist
          gist="$(find addon-work/gist -type f -iname '*.grf' -print -quit)"
          test -s "$gist"
          test "$(md5sum "$gist" | cut -c1-8)" = 'e314aaa0'
          cp "$gist" dist-addons/gist-0.21.10.grf
          gist_license="$(find addon-work/gist -type f \( -iname 'license*' -o -iname 'copying*' \) -print -quit || true)"
          if test -n "$gist_license"; then cp "$gist_license" dist-addons/licenses/gist-GPL-2.0.txt; fi

          curl -fL --retry 5 --retry-all-errors \
            'https://github.com/OpenTTD/OpenGFX2/releases/download/v0.7/ogfx2_settings.grf' \
            -o dist-addons/ogfx2-settings-0.7.grf
          test "$(md5sum dist-addons/ogfx2-settings-0.7.grf | cut -c1-8)" = '0d04bc9a'

          curl -fL --retry 5 --retry-all-errors \
            'https://github.com/OpenTTD/OpenGFX2/releases/download/0.8.1/OpenGFX2_Classic-0.8.1.tar' \
            -o dist-addons/OpenGFX2_Classic-0.8.1.tar
          test -s dist-addons/OpenGFX2_Classic-0.8.1.tar
          tar -tf dist-addons/OpenGFX2_Classic-0.8.1.tar | grep -Eq '\.(obg|grf)$'

          curl -fL --retry 5 --retry-all-errors \
            'https://raw.githubusercontent.com/OpenTTD/OpenGFX2/0.8.1/LICENSE' \
            -o dist-addons/licenses/OpenGFX2-GPL-2.0.txt || \
          curl -fL --retry 5 --retry-all-errors \
            'https://raw.githubusercontent.com/OpenTTD/OpenGFX2/0.8.1/LICENSE.md' \
            -o dist-addons/licenses/OpenGFX2-GPL-2.0.txt || true

          sha256sum dist-addons/*.grf dist-addons/*.tar
          ls -lh dist-addons/*.grf dist-addons/*.tar

      - name: Compress add-ons and generate manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import gzip, hashlib, json, shutil

          root = Path('dist-addons')
          out = root / 'addons'
          out.mkdir(exist_ok=True)

          specs = [
              dict(content_id='newgrf/43411223', name='Iron Horse 4 (Trains)', version='4.29.0', source_file='iron-horse-4.29.0.grf', install_filename='iron-horse-4.29.0.grf', type='newgrf', category='trains', license='GPL-2.0', source='https://github.com/andythenorth/iron-horse/tree/ec0523c6f80459ec40cb4488e9a23e5aaa3705c3', published_md5_prefix='bd0a3c2f'),
              dict(content_id='newgrf/f1250009', name='FIRS Industries 5', version='5.2.0', source_file='firs-5.2.0.grf', install_filename='firs-5.2.0.grf', type='newgrf', category='industry', conflict_group='industry-set', license='GPL-2.0', source='https://github.com/andythenorth/firs/tree/8844b7da36e919690322dcd69ffd9977e4e9a9c4', published_md5_prefix='6bb8b38e'),
              dict(content_id='newgrf/9787eafe', name='Road Hog (Buses, Trucks, Trams)', version='1.4.1', source_file='road-hog-1.4.1.grf', install_filename='road-hog-1.4.1.grf', type='newgrf', category='road-vehicles', license='GPL-2.0', source='https://bundles.openttdcoop.org/road-hog/releases/LATEST/', published_md5_prefix='04acd20a'),
              dict(content_id='newgrf/55440100', name='GIST - German Industries Set', version='0.21.10', source_file='gist-0.21.10.grf', install_filename='gist-0.21.10.grf', type='newgrf', category='industry', conflict_group='industry-set', license='GPL-2.0', source='https://github.com/UweDomaratius/GermanIndustries/tree/v0.21.10', published_md5_prefix='e314aaa0'),
              dict(content_id='newgrf/474c0501', name='Early Vehicle Set', version='0.0.2', source_file='early-vehicle-set-0.0.2.grf', install_filename='early-vehicle-set-0.0.2.grf', type='newgrf', category='vehicles', license='GPL-2.0', source='https://github.com/DonaldDuck313/OpenTTD-NewGRFs/tree/main/EarlyVehicleSet', published_md5_prefix='f13d428d'),
              dict(content_id='newgrf/4f475a01', name='OpenGFX2 Settings', version='0.7', source_file='ogfx2-settings-0.7.grf', install_filename='ogfx2-settings-0.7.grf', type='newgrf', category='graphics-settings', license='GPL-2.0', source='https://github.com/OpenTTD/OpenGFX2/tree/v0.7', published_md5_prefix='0d04bc9a'),
              dict(content_id='base-graphics/6f676678', name='OpenGFX2 Classic', version='0.8.1', source_file='OpenGFX2_Classic-0.8.1.tar', install_filename='OpenGFX2_Classic-0.8.1.tar', type='base-graphics', category='base-graphics', license='GPL-2.0', source='https://github.com/OpenTTD/OpenGFX2/tree/0.8.1', published_md5_prefix='9511dce1'),
          ]

          items=[]
          for spec in specs:
              src=root/spec.pop('source_file')
              if not src.is_file() or src.stat().st_size <= 0:
                  raise SystemExit(f'Missing source payload: {src}')
              packed_name=src.name + '.gz'
              packed=out/packed_name
              with src.open('rb') as fi, gzip.GzipFile(filename='', mode='wb', fileobj=packed.open('wb'), compresslevel=9, mtime=0) as gz:
                  shutil.copyfileobj(fi, gz, length=1024*1024)
              row=dict(spec)
              row.update({
                  'asset':'addons/'+packed_name,
                  'compression':'gzip',
                  'packaged_bytes':packed.stat().st_size,
                  'installed_bytes':src.stat().st_size,
                  'sha256':hashlib.sha256(src.read_bytes()).hexdigest(),
                  'packaged_sha256':hashlib.sha256(packed.read_bytes()).hexdigest(),
                  'enabled_by_default':False,
              })
              items.append(row)

          manifest={
              'manifest_version':'2026-08-18-v6',
              'enabled_by_default':False,
              'notes':{
                  'industry_conflict':'FIRS Industries 5 and GIST are alternatives; enable at most one in a new game.',
                  'newgrf_ui':'Main menu -> NewGRF Settings',
                  'base_graphics_ui':'Game Options -> Base graphics set',
                  'startup':'All bundled content is available locally but nothing is activated automatically.',
              },
              'total_packaged_bytes':sum(x['packaged_bytes'] for x in items),
              'total_installed_bytes':sum(x['installed_bytes'] for x in items),
              'items':items,
          }
          (root/'OPENTTD-BUNDLED-ADDONS.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          print(json.dumps(manifest, indent=2))
          PY

          sha256sum dist-addons/addons/* | tee dist-addons/ADDON-PACKAGE-SHA256SUMS.txt
          du -h dist-addons/addons/*

      - name: Add third-party notices
        shell: bash
        run: |
          set -euo pipefail
          cat > dist-addons/THIRD-PARTY-ADDONS.md <<'EOF'
          # Bundled optional OpenTTD content

          These files are included so players can opt in through OpenTTD's normal NewGRF Settings / Game Options UI. None are enabled automatically.

          - Iron Horse 4.29.0 — GPL-2.0 — source commit ec0523c6f80459ec40cb4488e9a23e5aaa3705c3: https://github.com/andythenorth/iron-horse
          - FIRS 5.2.0 — GPL-2.0 — source commit 8844b7da36e919690322dcd69ffd9977e4e9a9c4: https://github.com/andythenorth/firs
          - Road Hog 1.4.1 — GPL-2.0 — binary/source release: https://bundles.openttdcoop.org/road-hog/releases/LATEST/
          - GIST 0.21.10 — GPL-2.0 — source tag v0.21.10: https://github.com/UweDomaratius/GermanIndustries
          - Early Vehicle Set 0.0.2 — GPL-2.0 — source: https://github.com/DonaldDuck313/OpenTTD-NewGRFs/tree/main/EarlyVehicleSet
          - OpenGFX2 Settings 0.7 — GPL-2.0 — source tag v0.7: https://github.com/OpenTTD/OpenGFX2
          - OpenGFX2 Classic 0.8.1 — GPL-2.0 upstream source — source tag 0.8.1: https://github.com/OpenTTD/OpenGFX2

          FIRS and GIST are alternative industry sets and should not be enabled together in the same new game.
          EOF

      - name: Assemble optimized v6 package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-playgama/addons
          cp playgama/openttd-bundled-addons.js dist-playgama/openttd-bundled-addons.js
          cp docs/PLAYGAMA_ADDONS.md dist-playgama/BUNDLED-ADDONS.md
          cp dist-addons/THIRD-PARTY-ADDONS.md dist-playgama/THIRD-PARTY-ADDONS.md
          cp dist-addons/ADDON-PACKAGE-SHA256SUMS.txt dist-playgama/ADDON-PACKAGE-SHA256SUMS.txt
          cp dist-addons/OPENTTD-BUNDLED-ADDONS.json dist-playgama/OPENTTD-BUNDLED-ADDONS.json
          cp -a dist-addons/addons dist-playgama/addons
          mkdir -p dist-playgama/licenses/addons
          cp -a dist-addons/licenses/. dist-playgama/licenses/addons/ || true
          cp dist-addons/EARLY-VEHICLE-SOURCE-COMMIT.txt dist-playgama/licenses/addons/EARLY-VEHICLE-SOURCE-COMMIT.txt

          python3 - <<'PY'
          from pathlib import Path
          p=Path('dist-playgama/index.html')
          html=p.read_text(encoding='utf-8')
          marker='<script src="openttd-playgama-fixes.js"></script>'
          addon='<script src="openttd-bundled-addons.js"></script>'
          if addon not in html:
              if marker not in html: raise SystemExit('Missing fixes insertion point')
              html=html.replace(marker, marker + addon, 1)
          p.write_text(html, encoding='utf-8')
          PY

      - name: Validate v6 package
        shell: bash
        run: |
          set -euo pipefail
          node --check dist-playgama/openttd-bundled-addons.js
          python3 -m json.tool dist-playgama/OPENTTD-BUNDLED-ADDONS.json >/dev/null
          grep -q 'openttd-bundled-addons.js' dist-playgama/index.html
          grep -q "INSTALL_CONCURRENCY = 1" dist-playgama/openttd-bundled-addons.js
          grep -q "DecompressionStream('gzip')" dist-playgama/openttd-bundled-addons.js
          grep -q "cache: 'force-cache'" dist-playgama/openttd-bundled-addons.js
          grep -q 'FS.stat(target)' dist-playgama/openttd-bundled-addons.js
          grep -q 'openttd-classic-ai.js' dist-playgama/index.html
          ! grep -q '\[newgrf\]' dist-playgama/openttd-bundled-addons.js

          python3 - <<'PY'
          import gzip, hashlib, json
          from pathlib import Path
          root=Path('dist-playgama')
          manifest=json.loads((root/'OPENTTD-BUNDLED-ADDONS.json').read_text())
          required={'newgrf/43411223','newgrf/f1250009','newgrf/9787eafe','newgrf/55440100','newgrf/474c0501','newgrf/4f475a01','base-graphics/6f676678'}
          ids={row['content_id'] for row in manifest['items']}
          assert ids == required, (ids, required)
          assert manifest['enabled_by_default'] is False
          assert all(row['enabled_by_default'] is False for row in manifest['items'])
          assert all(row['compression']=='gzip' for row in manifest['items'])
          conflicts={row['content_id'] for row in manifest['items'] if row.get('conflict_group')=='industry-set'}
          assert conflicts == {'newgrf/f1250009','newgrf/55440100'}, conflicts
          for row in manifest['items']:
              asset=root/row['asset']
              assert asset.is_file(), asset
              packed=asset.read_bytes()
              assert len(packed)==row['packaged_bytes']
              assert hashlib.sha256(packed).hexdigest()==row['packaged_sha256']
              data=gzip.decompress(packed)
              assert len(data)==row['installed_bytes']
              assert hashlib.sha256(data).hexdigest()==row['sha256']
              assert row['install_filename'].endswith(('.grf','.tar'))
              assert not row['install_filename'].endswith(('.zip','.gz'))
          print('Optional packaged bytes:', manifest['total_packaged_bytes'])
          print('Optional installed bytes:', manifest['total_installed_bytes'])
          PY

          python3 - <<'PY'
          from pathlib import Path
          bad=[]
          for p in Path('dist-playgama').rglob('*'):
              if p.is_file():
                  rel=p.relative_to('dist-playgama').as_posix()
                  if ' ' in rel or any(ord(c)>127 for c in rel): bad.append(rel)
          if bad: raise SystemExit(f'Invalid archive paths: {bad}')
          PY

          unpacked_bytes=$(du -sb dist-playgama | cut -f1)
          echo "Unpacked Playgama bytes: ${unpacked_bytes}"
          test "$unpacked_bytes" -lt 300000000

      - name: Create v6 ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f openttd-playgama-v6-addons.zip
          (cd dist-playgama && zip -9 -X -r ../openttd-playgama-v6-addons.zip .)
          unzip -t openttd-playgama-v6-addons.zip
          test "$(unzip -Z1 openttd-playgama-v6-addons.zip | grep -c '^index.html$')" = 1
          sha256sum openttd-playgama-v6-addons.zip | tee OPENTTD-PLAYGAMA-V6-SHA256.txt
          ls -lh openttd-playgama-v6-addons.zip

      - name: Upload v6 package
        uses: actions/upload-artifact@v4
        with:
          name: openttd-playgama-v6-addons
          path: |
            openttd-playgama-v6-addons.zip
            OPENTTD-PLAYGAMA-V6-SHA256.txt
          if-no-files-found: error
          retention-days: 90
