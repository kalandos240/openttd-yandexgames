name: Release v14 final v7 AI order

on:
  push:
    branches:
      - perf/v14-combined-final-v6
    paths:
      - '.github/workflows/release-v14-final-v7-ai-order.yml'
      - 'ci/patch-v14-playgama-ai-startup-order.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  package-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V6_VALIDATED_ARTIFACT_ID: '9767582593'
      V6_YANDEX_SHA256: 'f8233a7f61d7470208cdc4c6196e9123433d6c5ffbcb6cc8e7ebae2f6d5cdf0a'
      V6_PLAYGAMA_SHA256: '1f098040683cd2ec7ee8783d975201cf68dab12a4c9bdd2be8a25bd5197ba9ef'

    steps:
      - name: Checkout v7 packaging and validation tooling
        uses: actions/checkout@v4

      - name: Recover exact fully validated v6 inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/v7
          mkdir -p "$ROOT"/{source,prod/pg,test/ya,test/pg,out,browser-node}
          curl -fL --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V6_VALIDATED_ARTIFACT_ID}/zip" \
            -o "$ROOT/v6-artifact.zip"
          unzip -q "$ROOT/v6-artifact.zip" -d "$ROOT/source"

          YA_V6="$ROOT/source/OpenTTD-v14-Yandex-v6-2sweep-WebGL2.zip"
          PG_V6="$ROOT/source/OpenTTD-v14-Playgama-v6-2sweep-WebGL2.zip"
          test -s "$YA_V6"; test -s "$PG_V6"
          echo "${V6_YANDEX_SHA256}  $YA_V6" | sha256sum -c -
          echo "${V6_PLAYGAMA_SHA256}  $PG_V6" | sha256sum -c -
          unzip -tq "$YA_V6"
          unzip -tq "$PG_V6"

          # Yandex v7 intentionally reuses the byte-identical, already validated
          # v6 package. The Playgama package gets exactly one HTML ordering fix.
          cp "$YA_V6" "$ROOT/out/OpenTTD-v14-Yandex-v7-FINAL.zip"
          unzip -q "$PG_V6" -d "$ROOT/prod/pg"

      - name: Apply one-factor Playgama AI startup-order fix
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/v7
          python3 -m py_compile ci/patch-v14-playgama-ai-startup-order.py
          python3 ci/patch-v14-playgama-ai-startup-order.py "$ROOT/prod/pg"

          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/v7/prod/pg/index.html')
          s = p.read_text(encoding='utf-8')
          names = [
              'openttd-classic-ai.js',
              'openttd-playgama-cloud-saves.js',
              'openttd-playgama-fixes.js',
              'openttd-bundled-addons.js',
              'openttd-runtime.js',
          ]
          pos = [s.index(name) for name in names]
          print(dict(zip(names, pos)))
          if pos != sorted(pos):
              raise SystemExit('Playgama mandatory AI wrapper is not after the cloud provider')
          PY

          # Everything except index.html must remain byte-identical to v6.
          rm -rf "$ROOT/v6pg-compare"
          mkdir -p "$ROOT/v6pg-compare"
          unzip -q "$ROOT/source/OpenTTD-v14-Playgama-v6-2sweep-WebGL2.zip" -d "$ROOT/v6pg-compare"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          old=Path('/tmp/v7/v6pg-compare'); new=Path('/tmp/v7/prod/pg')
          old_files={str(p.relative_to(old)) for p in old.rglob('*') if p.is_file()}
          new_files={str(p.relative_to(new)) for p in new.rglob('*') if p.is_file()}
          if old_files != new_files:
              raise SystemExit(f'Playgama file set changed: only_old={old_files-new_files}, only_new={new_files-old_files}')
          changed=[]
          for rel in sorted(old_files):
              if (old/rel).read_bytes() != (new/rel).read_bytes(): changed.append(rel)
          print('Changed files:', changed)
          if changed != ['index.html']:
              raise SystemExit(f'Expected only index.html to change, got {changed}')
          PY

          for f in openttd-runtime.js openttd-playgama-fixes.js openttd-playgama-cloud-saves.js openttd-bundled-addons.js; do
            node --check "$ROOT/prod/pg/$f"
          done
          grep -Fq '__openttdWebGLPresenter' "$ROOT/prod/pg/openttd-runtime.js"
          grep -Fq 'UNPACK_ROW_LENGTH' "$ROOT/prod/pg/openttd-runtime.js"
          grep -Fq '__openttdAIStats' "$ROOT/prod/pg/openttd-runtime.js"
          grep -Fq 'const originalRestore = window.yandexRestoreOpenTTDCloud;' "$ROOT/prod/pg/openttd-playgama-fixes.js"
          grep -Fq 'installClassicAI(FS, personalDir);' "$ROOT/prod/pg/openttd-playgama-fixes.js"
          grep -Fq 'installAICompatibility(FS, personalDir);' "$ROOT/prod/pg/openttd-playgama-fixes.js"

      - name: Build final v7 Playgama archive and checksums
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/v7
          (cd "$ROOT/prod/pg" && zip -q -r -9 "$ROOT/out/OpenTTD-v14-Playgama-v7-FINAL.zip" .)
          unzip -tq "$ROOT/out/OpenTTD-v14-Yandex-v7-FINAL.zip"
          unzip -tq "$ROOT/out/OpenTTD-v14-Playgama-v7-FINAL.zip"
          (cd "$ROOT/out" && sha256sum OpenTTD-v14-Yandex-v7-FINAL.zip OpenTTD-v14-Playgama-v7-FINAL.zip > SHA256SUMS.txt)
          # Prove Yandex remained byte-identical to the validated v6 release.
          echo "${V6_YANDEX_SHA256}  $ROOT/out/OpenTTD-v14-Yandex-v7-FINAL.zip" | sha256sum -c -
          cat "$ROOT/out/SHA256SUMS.txt"

      - name: Prepare isolated platform test copies
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/v7
          unzip -q "$ROOT/out/OpenTTD-v14-Yandex-v7-FINAL.zip" -d "$ROOT/test/ya"
          cp -a "$ROOT/prod/pg/." "$ROOT/test/pg/"

          cat > "$ROOT/test/ya/sdk.js" <<'JS'
          (() => {
            const data=Object.create(null);
            const player={async getData(keys){const out={};for(const key of(keys||[]))if(Object.prototype.hasOwnProperty.call(data,key))out[key]=data[key];return out},async setData(v){Object.assign(data,v||{});return true},getMode(){return'full'},getUniqueID(){return'v7-final'},getName(){return'V7 Final'},isAuthorized(){return true}};
            const ysdk={environment:{i18n:{lang:'en'},app:{id:'v7-final'}},features:{LoadingAPI:{ready(){document.documentElement.dataset.yandexLoadingReady='ready';return Promise.resolve(true)}},GameplayAPI:{start(){document.documentElement.dataset.yandexGameplay='started';return Promise.resolve(true)},stop(){document.documentElement.dataset.yandexGameplay='stopped';return Promise.resolve(true)}}},adv:{showFullscreenAdv({callbacks}={}){callbacks?.onOpen?.();callbacks?.onClose?.(true)}},leaderboards:{async getEntries(){return{entries:[]}},async setScore(){return true}},async getPlayer(){return player},isAvailableMethod(){return Promise.resolve(true)},on(){},off(){}};
            window.YaGames={async init(){document.documentElement.dataset.yandexSdk='ready';return ysdk}};
          })();
          JS

          cat > "$ROOT/test/pg/platform-bridge-loader.js" <<'JS'
          (() => {
            const m=new Map();window.__openttdPlatformStartupIndependent=true;
            window.bridge={version:'v7-final',engine:'javascript',PLATFORM_MESSAGE:{GAME_READY:'game_ready',GAMEPLAY_STARTED:'gameplay_started',GAMEPLAY_STOPPED:'gameplay_stopped'},EVENT_NAME:{PAUSE_STATE_CHANGED:'pause_state_changed',AUDIO_STATE_CHANGED:'audio_state_changed',INTERSTITIAL_STATE_CHANGED:'interstitial_state_changed'},INTERSTITIAL_STATE:{OPENED:'opened',CLOSED:'closed',FAILED:'failed'},STORAGE_TYPE:{PLATFORM_INTERNAL:'platform_internal'},async initialize(){document.documentElement.dataset.playgamaSdk='ready';document.documentElement.dataset.playgamaBridge='ready';return true},platform:{language:'en',id:'playgama-v7-final',isAudioEnabled:true,on(){},off(){},async sendMessage(x){document.documentElement.dataset.playgamaMessage=String(x||'sent');return true}},storage:{async isSupported(){return true},async isAvailable(){return true},async get(k){return Array.isArray(k)?k.map(x=>m.get(String(x))??null):(m.get(String(k))??null)},async set(k,v){if(Array.isArray(k))k.forEach((x,i)=>m.set(String(x),Array.isArray(v)?v[i]:v));else m.set(String(k),v);return true}},advertisement:{isInterstitialSupported:false,setMinimumDelayBetweenInterstitial(){},on(){},off(){},showInterstitial(){}},player:{id:'v7-final-player',isAuthorizationSupported:false,isAuthorized:true,async authorize(){return true}},leaderboards:{type:'not_available',async getEntries(){return[]},async setScore(){return true}}};
            window.playgamaBridgeScriptReady=Promise.resolve(window.bridge);document.documentElement.dataset.playgamaSdk='ready';document.documentElement.dataset.playgamaBridge='ready';
          })();
          JS

      - name: Install proven browser controller
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/v7
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          "$CHROME_BIN" --version | tee "$ROOT/out/CHROME-VERSION.txt"
          cd "$ROOT/browser-node"
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund puppeteer-core@24.16.0
          cp "$GITHUB_WORKSPACE/ci/platform-hosted-smoke.mjs" smoke.mjs
          cp "$GITHUB_WORKSPACE/ci/v14-performance-browser.mjs" perf.mjs
          node --check smoke.mjs
          node --check perf.mjs
          grep -Fq 'mainThreadProbeBlockedMs: mainThreadBlockedMs' perf.mjs

      - name: Functional smoke Yandex and Playgama
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/v7
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          run_one(){ local dir="$1" p="$2" port="$3" out="$4"; cd "$dir"; python3 -m http.server "$port" --bind 127.0.0.1 >"/tmp/${p}-v7-smoke-http.log" 2>&1 & local pid=$!; for _ in $(seq 1 100);do curl -fsS "http://127.0.0.1:${port}/index.html" >/dev/null&&break;sleep .1;done; cd "$ROOT/browser-node"; set +e; node smoke.mjs "$p" "http://127.0.0.1:${port}/index.html" "$out"; local rc=$?; set -e; kill "$pid" 2>/dev/null||true;wait "$pid" 2>/dev/null||true;return "$rc"; }
          run_one "$ROOT/test/ya" yandex 8260 "$ROOT/out/yandex-smoke.json"
          run_one "$ROOT/test/pg" playgama 8261 "$ROOT/out/playgama-smoke.json"
          grep -Fq '"passed": true' "$ROOT/out/yandex-smoke.json"
          grep -Fq '"passed": true' "$ROOT/out/playgama-smoke.json"

      - name: Real 4096x4096 plus 14-AI stress on both final v7 packages
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/v7
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          run_one(){ local dir="$1" p="$2" port="$3" out="$4"; cd "$dir"; python3 -m http.server "$port" --bind 127.0.0.1 >"/tmp/${p}-v7-perf-http.log" 2>&1 & local pid=$!; for _ in $(seq 1 100);do curl -fsS "http://127.0.0.1:${port}/index.html" >/dev/null&&break;sleep .1;done; cd "$ROOT/browser-node"; set +e; node perf.mjs "$p" "http://127.0.0.1:${port}/index.html" "$out" optimized 12 30000 during; local rc=$?; set -e; kill "$pid" 2>/dev/null||true;wait "$pid" 2>/dev/null||true;return "$rc"; }
          run_one "$ROOT/test/ya" yandex 8270 "$ROOT/out/yandex-performance.json"
          run_one "$ROOT/test/pg" playgama 8271 "$ROOT/out/playgama-performance.json"

      - name: Strict AI health, performance and autonomy gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          out=Path('/tmp/v7/out')
          fatal_ai=re.compile(r'no suitable ai|dummy[\x27 ]+ai|script died unexpectedly|the script died|incomplete ai compatibility',re.I)
          report={'candidate':'OpenTTD v14 FINAL v7','sourceV6ArtifactId':9767582593,'playgamaFix':'cloud provider loads before mandatory AI wrapper','platforms':{}}
          for p in ('yandex','playgama'):
              smoke=json.loads((out/f'{p}-smoke.json').read_text()); d=json.loads((out/f'{p}-performance.json').read_text())
              if not smoke.get('passed'): raise SystemExit(f'{p}: smoke failed: {smoke.get("failure")}')
              if not d.get('passed'): raise SystemExit(f'{p}: performance harness failed: {d.get("failure")}')
              tail=list((d.get('console') or {}).get('tail') or [])
              fatal=[line for line in tail if fatal_ai.search(str(line))]
              if fatal: raise SystemExit(f'{p}: fatal AI diagnostics present: {fatal}')
              page_errors=list((d.get('console') or {}).get('pageErrors') or [])
              if page_errors: raise SystemExit(f'{p}: page errors: {page_errors}')
              s=d['ai14']['snapshot']; a=d.get('aiScheduler') or {}; r=d.get('renderer') or {}; u=r.get('upload') or {}; g=d.get('generation') or {}; n=d.get('network') or {}
              checks=[(a.get('activeAI')==14,'activeAI'),(a.get('configuredOpcodeBudget')==10000,'configured budget'),(a.get('effectiveOpcodeBudget')==4285,'effective budget'),(r.get('active') is True,'renderer active'),(u.get('webgl2') is True,'WebGL2'),(u.get('zeroCopyRectUploads',0)>0,'zero-copy uploads'),(u.get('packedRectUploads',0)==0,'packed fallback'),(not n.get('failedRequests'),'failed requests'),(not n.get('blockedExternal'),'blocked external')]
              for ok,name in checks:
                  if not ok: raise SystemExit(f'{p}: {name} gate failed')
              gen=g.get('wallMsUntilResponsive'); block=g.get('mainThreadProbeBlockedMs'); fps=s.get('estimatedFps',0); p95=s.get('p95FrameGapMs',999); p99=s.get('p99FrameGapMs',999); heap=s.get('wasmHeapBytes')
              if gen is None or gen>26000: raise SystemExit(f'{p}: generation regression {gen}')
              if block is None or block>25500: raise SystemExit(f'{p}: generation block regression {block}')
              if fps<48: raise SystemExit(f'{p}: FPS floor failed {fps}')
              if p95>33.5 or p99>50: raise SystemExit(f'{p}: frame-tail regression {p95}/{p99}')
              if heap is None or heap>448_000_000: raise SystemExit(f'{p}: heap regression {heap}')
              report['platforms'][p]={'passed':True,'generationMs':gen,'mainThreadBlockedMs':block,'fps14AI':fps,'p50FrameGapMs':s.get('p50FrameGapMs'),'p95FrameGapMs':p95,'p99FrameGapMs':p99,'longTaskCount':s.get('longTaskCount'),'longestLongTaskMs':s.get('longestLongTaskMs'),'wasmHeapBytes':heap,'aiScheduler':a,'renderer':r,'fatalAIDiagnostics':fatal,'consoleTail':tail}
          (out/'V7-FINAL-STRESS.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          md=['# OpenTTD v14 FINAL v7','']
          for p,x in report['platforms'].items(): md += [f'## {p}',f'- 4096² generation: {x["generationMs"]:.0f} ms',f'- main-thread block: {x["mainThreadBlockedMs"]:.0f} ms',f'- 14-AI FPS: {x["fps14AI"]:.2f}',f'- p95 / p99: {x["p95FrameGapMs"]:.2f} / {x["p99FrameGapMs"]:.2f} ms',f'- long tasks: {x["longTaskCount"]}, longest {x["longestLongTaskMs"]:.0f} ms',f'- heap: {x["wasmHeapBytes"]} B',f'- AI scheduler: {json.dumps(x["aiScheduler"])}','- fatal AI diagnostics: 0',f'- WebGL2 zero-copy uploads: {x["renderer"]["upload"].get("zeroCopyRectUploads")}','']
          (out/'V7-FINAL-STRESS.md').write_text('\n'.join(md),encoding='utf-8')
          print('\n'.join(md))
          PY
          cd /tmp/v7/out
          sha256sum -c SHA256SUMS.txt
          unzip -tq OpenTTD-v14-Yandex-v7-FINAL.zip
          unzip -tq OpenTTD-v14-Playgama-v7-FINAL.zip

      - name: Upload only fully validated v7 archives and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openttd-v14-FINAL-v7
          compression-level: 0
          path: /tmp/v7/out/
          if-no-files-found: error
