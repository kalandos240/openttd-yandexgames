name: Test v14 final release v3

on:
  push:
    branches:
      - perf/v14-simpleai-bridge-cache
    paths:
      - '.github/workflows/test-v14-final-release-v3.yml'
      - 'ci/v14-performance-browser.mjs'
      - 'ci/v14-viewport-smoke.mjs'
      - 'ci/platform-hosted-smoke.mjs'
      - 'ci/v14-yandex-sdk-mock.js'
      - 'ci/v14-playgama-loader-mock.js'
      - 'ci/patch-v14-webgl-runtime.py'
      - 'ci/patch-v14-performance-package.py'
      - 'ci/patch-v14-playgama-single-file.py'
      - 'ci/patch-v14-simpleai-bridge-cache.py'
      - 'yandex/neutralize_yandex_runtime.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  assemble-test-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NATIVE_ARTIFACT_ID: '9742752495'
      NATIVE_SOURCE_RUN: '33347711436'
      NATIVE_SOURCE_SHA: 'e04b47766a330f84ab8bbe78420f39e080e64672'
      VERIFIED_YA_ARTIFACT_ID: '9738530154'
      VERIFIED_PG_ARTIFACT_ID: '9738530460'

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v4

      - name: Download exact native runtime and verified platform baselines
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v14v3/{artifact/native,artifact/ya,artifact/pg,native,baseline/ya,baseline/pg,prod/ya,prod/pg,test,out,browser-node}
          download_artifact() {
            local id="$1" out="$2"
            curl -fL --retry 5 --retry-all-errors \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              -o "$out"
          }
          download_artifact "$NATIVE_ARTIFACT_ID" /tmp/v14v3/native-artifact.zip
          download_artifact "$VERIFIED_YA_ARTIFACT_ID" /tmp/v14v3/ya-artifact.zip
          download_artifact "$VERIFIED_PG_ARTIFACT_ID" /tmp/v14v3/pg-artifact.zip
          unzip -q /tmp/v14v3/native-artifact.zip -d /tmp/v14v3/artifact/native
          unzip -q /tmp/v14v3/ya-artifact.zip -d /tmp/v14v3/artifact/ya
          unzip -q /tmp/v14v3/pg-artifact.zip -d /tmp/v14v3/artifact/pg
          NATIVE_ZIP="$(find /tmp/v14v3/artifact/native -type f -name 'OpenTTD-YandexGames-Direct.zip' -print -quit)"
          YA_ZIP="$(find /tmp/v14v3/artifact/ya -type f -name '*.zip' -print -quit)"
          PG_ZIP="$(find /tmp/v14v3/artifact/pg -type f -name '*.zip' -print -quit)"
          test -s "$NATIVE_ZIP"; test -s "$YA_ZIP"; test -s "$PG_ZIP"
          unzip -q "$NATIVE_ZIP" -d /tmp/v14v3/native
          unzip -q "$YA_ZIP" -d /tmp/v14v3/baseline/ya
          unzip -q "$PG_ZIP" -d /tmp/v14v3/baseline/pg
          cp -a /tmp/v14v3/baseline/ya/. /tmp/v14v3/prod/ya/
          cp -a /tmp/v14v3/baseline/pg/. /tmp/v14v3/prod/pg/
          test -s /tmp/v14v3/native/openttd-runtime.js
          test ! -e /tmp/v14v3/native/openttd.wasm
          test ! -e /tmp/v14v3/native/openttd.data
          grep -Fq '__openttdDirtyRect' /tmp/v14v3/native/openttd-runtime.js
          grep -Fq '__openttdAIStats' /tmp/v14v3/native/openttd-runtime.js

      - name: Assemble final Yandex and Playgama packages
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            ci/patch-v14-webgl-runtime.py \
            ci/patch-v14-performance-package.py \
            ci/patch-v14-playgama-single-file.py \
            ci/patch-v14-simpleai-bridge-cache.py \
            yandex/neutralize_yandex_runtime.py
          for d in /tmp/v14v3/prod/ya /tmp/v14v3/prod/pg; do
            cp /tmp/v14v3/native/openttd-runtime.js "$d/openttd-runtime.js"
            rm -f "$d/openttd.wasm" "$d/openttd.data"
            python3 ci/patch-v14-webgl-runtime.py "$d/openttd-runtime.js"
            python3 ci/patch-v14-simpleai-bridge-cache.py "$d"
            node --check "$d/openttd-runtime.js"
            node --check "$d/openttd-classic-ai.js"
          done
          python3 ci/patch-v14-performance-package.py /tmp/v14v3/prod/ya --platform yandex
          python3 ci/patch-v14-playgama-single-file.py /tmp/v14v3/prod/pg
          python3 yandex/neutralize_yandex_runtime.py /tmp/v14v3/prod/ya

      - name: Static release autonomy and feature gates
        shell: bash
        run: |
          set -euo pipefail
          for d in /tmp/v14v3/prod/ya /tmp/v14v3/prod/pg; do
            test -s "$d/openttd-runtime.js"
            test -s "$d/openttd-classic-ai.js"
            test ! -e "$d/openttd.wasm"
            test ! -e "$d/openttd.data"
            node --check "$d/openttd-runtime.js"
            grep -Fq '__openttdWebGLPresenter' "$d/openttd-runtime.js"
            grep -Fq '__openttdDirtyRect' "$d/openttd-runtime.js"
            grep -Fq '__openttdUploadStats' "$d/openttd-runtime.js"
            grep -Fq '__openttdAIStats' "$d/openttd-runtime.js"
            grep -Fq 'texSubImage2D' "$d/openttd-runtime.js"
            grep -Fq 'bridge-type-cache-per-game-date-2026-08-31' "$d/openttd-classic-ai.js"
            grep -Fq 'web_payload_md5' "$d/openttd-classic-ai.js"
            grep -Fq 'const MAX_SCORE = 1000' "$d/openttd-global-ranking.js"
            grep -Fq 'Module.calledRun === true' "$d/openttd-ranking-core.js"
          done
          grep -Fq "script.src = '/sdk.js'" /tmp/v14v3/prod/ya/yandex-bootstrap.js
          test -s /tmp/v14v3/prod/ya/THIRD-PARTY-LICENSES.md
          test ! -e /tmp/v14v3/prod/ya/PLAYGAMA-ALL-LICENSES.md
          ! grep -Eiq 'playgama' /tmp/v14v3/prod/ya/openttd-bundled-addons.js
          ! grep -Eiq 'https?://' /tmp/v14v3/prod/ya/OPENTTD-BUNDLED-ADDONS.json
          ! grep -Eiq 'https?://[^"[:space:]]+' /tmp/v14v3/prod/ya/index.html
          ! grep -Fq 'bridge.playgama.com' /tmp/v14v3/prod/pg/index.html
          grep -Fq 'https://bridge.playgama.com/v1.31.0/playgama-bridge.js' /tmp/v14v3/prod/pg/platform-bridge-loader.js
          grep -Fq 'window.__openttdPlatformStartupIndependent===true' /tmp/v14v3/prod/pg/openttd-runtime.js
          cat > /tmp/v14v3/out/BUILD-PROVENANCE.txt <<EOF
          OpenTTD v14 final web release v3
          Native source run: ${NATIVE_SOURCE_RUN}
          Native source SHA: ${NATIVE_SOURCE_SHA}
          Native artifact ID: ${NATIVE_ARTIFACT_ID}
          Native artifact API digest: sha256:8721f9a3a4bd8954aeba11df40f8cc934f3b6462f3c7ddbc3c56940282290ca5
          Verified Yandex baseline artifact: ${VERIFIED_YA_ARTIFACT_ID}
          Verified Playgama baseline artifact: ${VERIFIED_PG_ARTIFACT_ID}
          Final package branch SHA: ${GITHUB_SHA}
          Benchmark methodology: 2048x2048 baseline/final A-B plus final-only 4096x4096 release stress, both with 14 AI.
          EOF

      - name: Build candidate release ZIPs
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/v14v3/prod/ya && zip -q -r -9 /tmp/v14v3/out/openttd-yandexgames-v14-final.zip .)
          (cd /tmp/v14v3/prod/pg && zip -q -r -9 /tmp/v14v3/out/openttd-playgama-v14-final.zip .)
          unzip -tq /tmp/v14v3/out/openttd-yandexgames-v14-final.zip
          unzip -tq /tmp/v14v3/out/openttd-playgama-v14-final.zip
          (cd /tmp/v14v3/out && sha256sum openttd-yandexgames-v14-final.zip openttd-playgama-v14-final.zip > SHA256SUMS.txt)

      - name: Prepare browser test copies and local SDK mocks
        shell: bash
        run: |
          set -euo pipefail
          for spec in baseline-ya baseline-pg final-ya final-pg; do mkdir -p "/tmp/v14v3/test/${spec}"; done
          cp -a /tmp/v14v3/baseline/ya/. /tmp/v14v3/test/baseline-ya/
          cp -a /tmp/v14v3/baseline/pg/. /tmp/v14v3/test/baseline-pg/
          cp -a /tmp/v14v3/prod/ya/. /tmp/v14v3/test/final-ya/
          cp -a /tmp/v14v3/prod/pg/. /tmp/v14v3/test/final-pg/
          cp ci/v14-yandex-sdk-mock.js /tmp/v14v3/test/baseline-ya/sdk.js
          cp ci/v14-yandex-sdk-mock.js /tmp/v14v3/test/final-ya/sdk.js
          cp ci/v14-playgama-loader-mock.js /tmp/v14v3/test/baseline-pg/platform-bridge-loader.js
          cp ci/v14-playgama-loader-mock.js /tmp/v14v3/test/final-pg/platform-bridge-loader.js

      - name: Install browser controller
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -n "$CHROME_BIN"
          cd /tmp/v14v3/browser-node
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund puppeteer-core@24.16.0
          cp "$GITHUB_WORKSPACE/ci/platform-hosted-smoke.mjs" ./smoke.mjs
          cp "$GITHUB_WORKSPACE/ci/v14-performance-browser.mjs" ./perf.mjs
          cp "$GITHUB_WORKSPACE/ci/v14-viewport-smoke.mjs" ./viewport.mjs
          node --check ./smoke.mjs
          node --check ./perf.mjs
          node --check ./viewport.mjs
          grep -Fq 'protocolTimeout: 900000' ./perf.mjs
          grep -Fq 'mapLog2Arg' ./perf.mjs

      - name: Hosted Chromium functional and multi-viewport smoke
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          run_server_test() {
            local dir="$1" platform="$2" port="$3"
            cd "$dir"
            python3 -m http.server "$port" --bind 127.0.0.1 >"/tmp/v14v3-${platform}-${port}.http.log" 2>&1 &
            local pid=$!
            for _ in $(seq 1 100); do curl -fsS "http://127.0.0.1:${port}/index.html" >/dev/null && break; sleep 0.1; done
            cd /tmp/v14v3/browser-node
            node smoke.mjs "$platform" "http://127.0.0.1:${port}/index.html" "/tmp/v14v3/out/${platform}-smoke.json"
            node viewport.mjs "$platform" "http://127.0.0.1:${port}/index.html" "/tmp/v14v3/out/viewport-${platform}"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          run_server_test /tmp/v14v3/test/final-ya yandex 8353
          run_server_test /tmp/v14v3/test/final-pg playgama 8354
          grep -Fq '"passed": true' /tmp/v14v3/out/yandex-smoke.json
          grep -Fq '"passed": true' /tmp/v14v3/out/playgama-smoke.json
          grep -Fq '"passed": true' /tmp/v14v3/out/viewport-yandex/yandex-viewport.json
          grep -Fq '"passed": true' /tmp/v14v3/out/viewport-playgama/playgama-viewport.json

      - name: Fair 2048x2048 baseline versus final A-B benchmark
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          run_perf() {
            local dir="$1" platform="$2" profile="$3" port="$4" name="$5" maplog="$6" sample="$7"
            cd "$dir"
            python3 -m http.server "$port" --bind 127.0.0.1 >"/tmp/v14v3-${name}.http.log" 2>&1 &
            local pid=$!
            for _ in $(seq 1 100); do curl -fsS "http://127.0.0.1:${port}/index.html" >/dev/null && break; sleep 0.1; done
            cd /tmp/v14v3/browser-node
            set +e
            node perf.mjs "$platform" "http://127.0.0.1:${port}/index.html" "/tmp/v14v3/out/${name}.json" "$profile" "$maplog" "$sample"
            local rc=$?
            set -e
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            return "$rc"
          }
          run_perf /tmp/v14v3/test/baseline-ya yandex baseline 8360 ab-baseline-yandex 11 15000
          run_perf /tmp/v14v3/test/final-ya yandex optimized 8361 ab-final-yandex 11 15000
          run_perf /tmp/v14v3/test/baseline-pg playgama baseline 8362 ab-baseline-playgama 11 15000
          run_perf /tmp/v14v3/test/final-pg playgama optimized 8363 ab-final-playgama 11 15000

      - name: Final-only 4096x4096 plus 14-AI release stress
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          run_stress() {
            local dir="$1" platform="$2" port="$3" name="$4"
            cd "$dir"
            python3 -m http.server "$port" --bind 127.0.0.1 >"/tmp/v14v3-${name}.http.log" 2>&1 &
            local pid=$!
            for _ in $(seq 1 100); do curl -fsS "http://127.0.0.1:${port}/index.html" >/dev/null && break; sleep 0.1; done
            cd /tmp/v14v3/browser-node
            set +e
            node perf.mjs "$platform" "http://127.0.0.1:${port}/index.html" "/tmp/v14v3/out/${name}.json" optimized 12 30000
            local rc=$?
            set -e
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            return "$rc"
          }
          run_stress /tmp/v14v3/test/final-ya yandex 8370 stress-final-yandex
          run_stress /tmp/v14v3/test/final-pg playgama 8371 stress-final-playgama

      - name: Validate performance evidence and create report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          out = Path('/tmp/v14v3/out')
          report = {
              'methodology': '2048x2048 same-runner baseline/final A-B; final-only 4096x4096 release stress; 14 AI; interval 0',
              'native_source_run': 33347711436,
              'native_source_sha': 'e04b47766a330f84ab8bbe78420f39e080e64672',
              'native_artifact_id': 9742752495,
              'platforms': {},
          }
          bad_console = re.compile(r'(script died|AI[^\n]{0,40}crash|squirrel[^\n]{0,40}error|fatal error|runtimeerror|uncaught)', re.I)
          def improvement(base, final, lower=False):
              if not base: return None
              raw = (final - base) / base * 100.0
              return -raw if lower else raw
          for platform in ('yandex', 'playgama'):
              base = json.loads((out / f'ab-baseline-{platform}.json').read_text())
              final = json.loads((out / f'ab-final-{platform}.json').read_text())
              stress = json.loads((out / f'stress-final-{platform}.json').read_text())
              for label, data in (('A-B baseline', base), ('A-B final', final), ('4096 stress final', stress)):
                  if not data.get('passed'):
                      raise SystemExit(f'{platform} {label} failed: {data.get("failure")}')
              if base['map']['width'] != 2048 or final['map']['width'] != 2048:
                  raise SystemExit(f'{platform}: A-B map size mismatch')
              if stress['map']['width'] != 4096:
                  raise SystemExit(f'{platform}: stress map size mismatch')
              for label, data in (('A-B final', final), ('4096 stress final', stress)):
                  scheduler = data.get('aiScheduler') or {}
                  renderer = data.get('renderer') or {}
                  upload = renderer.get('upload') or {}
                  if scheduler.get('activeAI') != 14:
                      raise SystemExit(f'{platform} {label}: expected 14 active AI, got {scheduler}')
                  if not (0 < scheduler.get('effectiveOpcodeBudget', 0) < scheduler.get('configuredOpcodeBudget', 0)):
                      raise SystemExit(f'{platform} {label}: invalid AI scheduler budget: {scheduler}')
                  if not renderer.get('active') or upload.get('partialUploads', 0) < 1:
                      raise SystemExit(f'{platform} {label}: dirty-rect WebGL evidence missing: {renderer}')
                  console_text = '\n'.join((data.get('console') or {}).get('tail') or [])
                  if bad_console.search(console_text):
                      raise SystemExit(f'{platform} {label}: suspicious AI/runtime console output')
              b = base['ai14']['snapshot']; f = final['ai14']['snapshot']; s = stress['ai14']['snapshot']
              bg = base['generation']['wallMsUntilResponsive']; fg = final['generation']['wallMsUntilResponsive']; sg = stress['generation']['wallMsUntilResponsive']
              report['platforms'][platform] = {
                  'ab2048': {
                      'baseline': {'generationMs': bg, 'estimatedFps': b['estimatedFps'], 'p95FrameGapMs': b['p95FrameGapMs'], 'p99FrameGapMs': b['p99FrameGapMs'], 'longestLongTaskMs': b['longestLongTaskMs'], 'longTaskCount': b['longTaskCount'], 'wasmHeapBytes': b['wasmHeapBytes']},
                      'final': {'generationMs': fg, 'estimatedFps': f['estimatedFps'], 'p95FrameGapMs': f['p95FrameGapMs'], 'p99FrameGapMs': f['p99FrameGapMs'], 'longestLongTaskMs': f['longestLongTaskMs'], 'longTaskCount': f['longTaskCount'], 'wasmHeapBytes': f['wasmHeapBytes'], 'aiScheduler': final.get('aiScheduler'), 'renderer': final.get('renderer')},
                      'improvementPercent': {'generationFaster': improvement(bg, fg, True), 'estimatedFpsHigher': improvement(b['estimatedFps'], f['estimatedFps']), 'p95FrameGapLower': improvement(b['p95FrameGapMs'], f['p95FrameGapMs'], True), 'p99FrameGapLower': improvement(b['p99FrameGapMs'], f['p99FrameGapMs'], True), 'longestLongTaskLower': improvement(b['longestLongTaskMs'], f['longestLongTaskMs'], True)},
                  },
                  'stress4096Final': {'generationMs': sg, 'estimatedFps': s['estimatedFps'], 'p95FrameGapMs': s['p95FrameGapMs'], 'p99FrameGapMs': s['p99FrameGapMs'], 'longestLongTaskMs': s['longestLongTaskMs'], 'longTaskCount': s['longTaskCount'], 'wasmHeapBytes': s['wasmHeapBytes'], 'aiScheduler': stress.get('aiScheduler'), 'renderer': stress.get('renderer')},
              }
          (out / 'FINAL-PERFORMANCE-COMPARISON.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          lines = ['# OpenTTD v14 final browser benchmark', '', 'A/B: 2048x2048 baseline vs final on the same GitHub runner. Release stress: final-only 4096x4096. Both use 14 AI and interval 0.', '']
          for platform, data in report['platforms'].items():
              ab = data['ab2048']; b = ab['baseline']; f = ab['final']; i = ab['improvementPercent']; s = data['stress4096Final']
              lines += [f'## {platform}', '', '| 2048² A/B metric | Baseline | Final |', '|---|---:|---:|', f"| Generation to responsive | {b['generationMs']:.0f} ms | {f['generationMs']:.0f} ms |", f"| 14-AI estimated FPS | {b['estimatedFps']:.2f} | {f['estimatedFps']:.2f} |", f"| 14-AI p95 frame gap | {b['p95FrameGapMs']:.2f} ms | {f['p95FrameGapMs']:.2f} ms |", f"| 14-AI p99 frame gap | {b['p99FrameGapMs']:.2f} ms | {f['p99FrameGapMs']:.2f} ms |", f"| Longest long task | {b['longestLongTaskMs']:.2f} ms | {f['longestLongTaskMs']:.2f} ms |", '', f"2048 generation improvement: {i['generationFaster']:.2f}%", f"2048 FPS improvement: {i['estimatedFpsHigher']:.2f}%", f"2048 p95 frame-gap improvement: {i['p95FrameGapLower']:.2f}%", '', '### Final 4096² release stress', '', f"Generation to responsive: {s['generationMs']:.0f} ms", f"14-AI estimated FPS: {s['estimatedFps']:.2f}", f"14-AI p95 frame gap: {s['p95FrameGapMs']:.2f} ms", f"14-AI p99 frame gap: {s['p99FrameGapMs']:.2f} ms", f"Longest long task: {s['longestLongTaskMs']:.2f} ms", f"AI scheduler: `{json.dumps(s['aiScheduler'])}`", f"Renderer: `{json.dumps(s['renderer'])}`", '']
          (out / 'FINAL-PERFORMANCE-COMPARISON.md').write_text('\n'.join(lines), encoding='utf-8')
          print('\n'.join(lines))
          PY

      - name: Final release integrity gate
        shell: bash
        run: |
          set -euo pipefail
          for f in /tmp/v14v3/out/ab-*.json /tmp/v14v3/out/stress-*.json; do grep -Fq '"passed": true' "$f"; done
          grep -Fq '"passed": true' /tmp/v14v3/out/yandex-smoke.json
          grep -Fq '"passed": true' /tmp/v14v3/out/playgama-smoke.json
          grep -Fq '"passed": true' /tmp/v14v3/out/viewport-yandex/yandex-viewport.json
          grep -Fq '"passed": true' /tmp/v14v3/out/viewport-playgama/playgama-viewport.json
          test -s /tmp/v14v3/out/FINAL-PERFORMANCE-COMPARISON.json
          test -s /tmp/v14v3/out/FINAL-PERFORMANCE-COMPARISON.md
          test -s /tmp/v14v3/out/SHA256SUMS.txt
          test -s /tmp/v14v3/out/BUILD-PROVENANCE.txt
          unzip -tq /tmp/v14v3/out/openttd-yandexgames-v14-final.zip
          unzip -tq /tmp/v14v3/out/openttd-playgama-v14-final.zip
          ls -lah /tmp/v14v3/out

      - name: Upload final tested v14 release v3
        uses: actions/upload-artifact@v4
        with:
          name: openttd-v14-final-tested-v3
          compression-level: 0
          path: /tmp/v14v3/out/
          if-no-files-found: error
