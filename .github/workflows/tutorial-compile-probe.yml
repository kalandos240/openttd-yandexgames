name: OpenTTD interactive tutorial compile probe

on:
  workflow_dispatch:
  push:
    branches:
      - feature/global-ranking-tutorial
    paths:
      - '.github/workflows/tutorial-compile-probe.yml'
      - 'playgama/patch-browser-ranking.py'
      - 'playgama/patch-browser-ranking-core.py'
      - 'playgama/patch-browser-ranking-readable.py'
      - 'playgama/patch-browser-tutorial.py'
      - 'playgama/patch-browser-tutorial-toolbar.py'
      - 'playgama/patch-browser-tutorial-level.py'
      - 'playgama/patch-browser-tutorial-native-layout.py'
      - 'playgama/patch-browser-tutorial-objectives.py'
      - 'playgama/patch-browser-tutorial-compile-fix.py'
      - 'playgama/patch-browser-tutorial-final-polish.py'
      - 'playgama/patch-browser-tutorial-v15-compat.py'
      - 'playgama/patch-playgama-newgrf-main-menu.py'

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    container:
      image: emscripten/emsdk:3.1.57

    steps:
      - name: Checkout browser edition
        uses: actions/checkout@v4

      - name: Checkout tested browser build pipeline
        uses: actions/checkout@v4
        with:
          ref: fix/direct-file-launch
          path: legacy

      - name: Install native menu ranking and tutorial patches
        shell: bash
        run: |
          set -euo pipefail
          cp playgama/patch-playgama-newgrf-main-menu.py legacy/ci/patch-playgama-newgrf-main-menu.py
          cp playgama/patch-browser-ranking.py legacy/ci/patch-browser-ranking.py
          python3 -m py_compile \
            playgama/patch-browser-ranking-core.py \
            playgama/patch-browser-ranking-readable.py \
            playgama/patch-browser-tutorial.py \
            playgama/patch-browser-tutorial-toolbar.py \
            playgama/patch-browser-tutorial-level.py \
            playgama/patch-browser-tutorial-native-layout.py \
            playgama/patch-browser-tutorial-objectives.py \
            playgama/patch-browser-tutorial-compile-fix.py \
            playgama/patch-browser-tutorial-final-polish.py \
            playgama/patch-browser-tutorial-v15-compat.py \
            legacy/ci/patch-playgama-newgrf-main-menu.py \
            legacy/ci/patch-browser-ranking.py

          python3 - <<'PY'
          from pathlib import Path
          p = Path('legacy/ci/build-yandex-release.sh')
          text = p.read_text(encoding='utf-8')

          ai_off = "    'python3 ci/patch-yandex-ai-offline.py\\n'\n"
          if text.count(ai_off) == 1:
              text = text.replace(ai_off, '', 1)

          anchor = "    'python3 ci/patch-yandex-runtime-cleanup.py source\\n'\n"
          if text.count(anchor) != 1:
              raise SystemExit(f'Expected one source patch anchor, got {text.count(anchor)}')
          addition = (
              "    'python3 ci/patch-playgama-newgrf-main-menu.py\\n'\n"
              "    'python3 ci/patch-browser-ranking.py\\n'\n"
          )
          text = text.replace(anchor, anchor + addition, 1)
          p.write_text(text, encoding='utf-8')

          build = Path('legacy/ci/build-final.sh')
          build_text = build.read_text(encoding='utf-8')
          fonts_anchor = 'mkdir -p openttd/build/yandex_baseset /tmp/ottd-assets\n'
          fonts_copy = (
              fonts_anchor
              + 'cp openttd/media/baseset/OpenTTD-Sans.ttf openttd/media/baseset/OpenTTD-Small.ttf '
              + 'openttd/media/baseset/OpenTTD-Serif.ttf openttd/media/baseset/OpenTTD-Mono.ttf '
              + 'openttd/build/yandex_baseset/\n'
          )
          if build_text.count(fonts_anchor) != 1:
              raise SystemExit(f'Expected one base-set staging anchor, got {build_text.count(fonts_anchor)}')
          build_text = build_text.replace(fonts_anchor, fonts_copy, 1)
          build.write_text(build_text, encoding='utf-8')
          PY

      - name: Compile OpenTTD 15.3 with interactive tutorial
        working-directory: legacy
        shell: bash
        run: |
          set -euo pipefail
          bash ci/build-yandex-release.sh
          test -s OpenTTD-YandexGames-Direct.zip
          for font in OpenTTD-Sans.ttf OpenTTD-Small.ttf OpenTTD-Serif.ttf OpenTTD-Mono.ttf; do
            test -s "openttd/build/yandex_baseset/${font}"
          done

          grep -Fq 'WID_SGI_TUTORIAL' openttd/src/widgets/intro_widget.h
          grep -Fq 'struct BrowserTutorialWindow final : Window' openttd/src/intro_gui.cpp
          grep -Fq 'struct BrowserTutorialCoachWindow final : Window' openttd/src/intro_gui.cpp
          grep -Fq 'struct BrowserButtonGuideWindow final : Window' openttd/src/intro_gui.cpp
          grep -Fq 'StartBrowserTutorialLevel()' openttd/src/intro_gui.cpp
          grep -Fq 'StartNewGameWithoutGUI(0x4F545444U)' openttd/src/intro_gui.cpp
          grep -Fq 'this->highlight_bright ? TC_WHITE : TC_YELLOW' openttd/src/intro_gui.cpp
          grep -Fq '_settings_newgame.difficulty.vehicle_breakdowns = 1' openttd/src/intro_gui.cpp
          grep -Fq 'SPR_ARROW_LEFT' openttd/src/intro_gui.cpp
          grep -Fq 'STR_TOOLBAR_TOOLTIP_PAUSE_GAME + WID_TN_HELP' openttd/src/intro_gui.cpp
          grep -Fq 'BrowserTutorialGameStarted();' openttd/src/openttd.cpp
          grep -Fq 'ShowBrowserButtonGuide();' openttd/src/toolbar_gui.cpp
          grep -Fq 'STR_BROWSER_TUTORIAL_LEVEL_16' openttd/src/lang/english.txt
          grep -Fq 'STR_BROWSER_TUTORIAL_LEVEL_16' openttd/src/lang/russian.txt
          grep -Fq 'Справочник кнопок' openttd/src/lang/russian.txt

      - name: Validate rebuilt runtime
        working-directory: legacy
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/tutorial-runtime
          mkdir -p /tmp/tutorial-runtime
          unzip -q OpenTTD-YandexGames-Direct.zip -d /tmp/tutorial-runtime
          test -s /tmp/tutorial-runtime/openttd-runtime.js
          node --check /tmp/tutorial-runtime/openttd-runtime.js
          echo 'Interactive tutorial compile probe passed.'
