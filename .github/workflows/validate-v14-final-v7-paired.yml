name: Validate v14 FINAL v7 paired control

on:
  push:
    branches:
      - perf/v14-combined-final-v6
    paths:
      - '.github/workflows/validate-v14-final-v7-paired.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      V7_ARTIFACT_ID: '9767962504'
      V7_YANDEX_SHA256: 'f8233a7f61d7470208cdc4c6196e9123433d6c5ffbcb6cc8e7ebae2f6d5cdf0a'
      V7_PLAYGAMA_SHA256: '38f55e230d14d19da4c470a391258accdaa1f3cddd8d62891df3e408a2532d5c'

    steps:
      - name: Checkout paired validation tooling
        uses: actions/checkout@v4

      - name: Recover exact v7 archives and verify identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/v7paired
          mkdir -p "$ROOT"/{source,test/ya,test/pg,out,browser-node}
          curl -fL --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V7_ARTIFACT_ID}/zip" \
            -o "$ROOT/source.zip"
          unzip -q "$ROOT/source.zip" -d "$ROOT/source"
          YA="$ROOT/source/OpenTTD-v14-Yandex-v7-FINAL.zip"
          PG="$ROOT/source/OpenTTD-v14-Playgama-v7-FINAL.zip"
          test -s "$YA"; test -s "$PG"
          echo "${V7_YANDEX_SHA256}  $YA" | sha256sum -c -
          echo "${V7_PLAYGAMA_SHA256}  $PG" | sha256sum -c -
          unzip -tq "$YA"
          unzip -tq "$PG"
          cp "$YA" "$PG" "$ROOT/out/"
          (cd "$ROOT/out" && sha256sum *.zip > SHA256SUMS.txt)
          unzip -q "$YA" -d "$ROOT/test/ya"
          unzip -q "$PG" -d "$ROOT/test/pg"
          for d in "$ROOT/test/ya" "$ROOT/test/pg"; do
            test -s "$d/openttd-runtime.js"
            test ! -e "$d/openttd.wasm"
            test ! -e "$d/openttd.data"
            node --check "$d/openttd-runtime.js"
            grep -Fq '__openttdWebGLPresenter' "$d/openttd-runtime.js"
            grep -Fq 'UNPACK_ROW_LENGTH' "$d/openttd-runtime.js"
            grep -Fq '__openttdAIStats' "$d/openttd-runtime.js"
          done

      - name: Install isolated platform mocks
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/v7paired
          cat > "$ROOT/test/ya/sdk.js" <<'JS'
          (()=>{const data=Object.create(null);const player={async getData(keys){const out={};for(const key of(keys||[]))if(Object.prototype.hasOwnProperty.call(data,key))out[key]=data[key];return out},async setData(v){Object.assign(data,v||{});return true},getMode(){return'full'},getUniqueID(){return'v7-paired'},getName(){return'V7 Paired'},isAuthorized(){return true}};const ysdk={environment:{i18n:{lang:'en'},app:{id:'v7-paired'}},features:{LoadingAPI:{ready(){document.documentElement.dataset.yandexLoadingReady='ready';return Promise.resolve(true)}},GameplayAPI:{start(){document.documentElement.dataset.yandexGameplay='started';return Promise.resolve(true)},stop(){document.documentElement.dataset.yandexGameplay='stopped';return Promise.resolve(true)}}},adv:{showFullscreenAdv({callbacks}={}){callbacks?.onOpen?.();callbacks?.onClose?.(true)}},leaderboards:{async getEntries(){return{entries:[]}},async setScore(){return true}},async getPlayer(){return player},isAvailableMethod(){return Promise.resolve(true)},on(){},off(){}};window.YaGames={async init(){document.documentElement.dataset.yandexSdk='ready';return ysdk}}})();
          JS
          cat > "$ROOT/test/pg/platform-bridge-loader.js" <<'JS'
          (()=>{const m=new Map();window.__openttdPlatformStartupIndependent=true;window.bridge={version:'v7-paired',engine:'javascript',PLATFORM_MESSAGE:{GAME_READY:'game_ready',GAMEPLAY_STARTED:'gameplay_started',GAMEPLAY_STOPPED:'gameplay_stopped'},EVENT_NAME:{PAUSE_STATE_CHANGED:'pause_state_changed',AUDIO_STATE_CHANGED:'audio_state_changed',INTERSTITIAL_STATE_CHANGED:'interstitial_state_changed'},INTERSTITIAL_STATE:{OPENED:'opened',CLOSED:'closed',FAILED:'failed'},STORAGE_TYPE:{PLATFORM_INTERNAL:'platform_internal'},async initialize(){document.documentElement.dataset.playgamaSdk='ready';document.documentElement.dataset.playgamaBridge='ready';return true},platform:{language:'en',id:'playgama-v7-paired',isAudioEnabled:true,on(){},off(){},async sendMessage(x){document.documentElement.dataset.playgamaMessage=String(x||'sent');return true}},storage:{async isSupported(){return true},async isAvailable(){return true},async get(k){return Array.isArray(k)?k.map(x=>m.get(String(x))??null):(m.get(String(k))??null)},async set(k,v){if(Array.isArray(k))k.forEach((x,i)=>m.set(String(x),Array.isArray(v)?v[i]:v));else m.set(String(k),v);return true}},advertisement:{isInterstitialSupported:false,setMinimumDelayBetweenInterstitial(){},on(){},off(){},showInterstitial(){}},player:{id:'v7-paired-player',isAuthorizationSupported:false,isAuthorized:true,async authorize(){return true}},leaderboards:{type:'not_available',async getEntries(){return[]},async setScore(){return true}}};window.playgamaBridgeScriptReady=Promise.resolve(window.bridge);document.documentElement.dataset.playgamaSdk='ready';document.documentElement.dataset.playgamaBridge='ready'})();
          JS

      - name: Install proven browser controller
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/v7paired
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --version | tee "$ROOT/out/CHROME-VERSION.txt"
          cd "$ROOT/browser-node"
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund puppeteer-core@24.16.0
          cp "$GITHUB_WORKSPACE/ci/platform-hosted-smoke.mjs" smoke.mjs
          cp "$GITHUB_WORKSPACE/ci/v14-performance-browser.mjs" perf.mjs
          node --check smoke.mjs
          node --check perf.mjs

      - name: Smoke exact v7 archives
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/v7paired
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          run_one(){ local dir="$1" p="$2" port="$3" out="$4"; cd "$dir"; python3 -m http.server "$port" --bind 127.0.0.1 >"/tmp/${p}-v7paired-smoke-http.log" 2>&1 & local pid=$!; for _ in $(seq 1 100);do curl -fsS "http://127.0.0.1:${port}/index.html" >/dev/null&&break;sleep .1;done; cd "$ROOT/browser-node"; set +e; node smoke.mjs "$p" "http://127.0.0.1:${port}/index.html" "$out"; local rc=$?; set -e; kill "$pid" 2>/dev/null||true;wait "$pid" 2>/dev/null||true;return "$rc"; }
          run_one "$ROOT/test/ya" yandex 8280 "$ROOT/out/yandex-smoke.json"
          run_one "$ROOT/test/pg" playgama 8281 "$ROOT/out/playgama-smoke.json"

      - name: Paired 4096x4096 plus 14-AI stress
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/v7paired
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          run_one(){ local dir="$1" p="$2" port="$3" out="$4"; cd "$dir"; python3 -m http.server "$port" --bind 127.0.0.1 >"/tmp/${p}-v7paired-perf-http.log" 2>&1 & local pid=$!; for _ in $(seq 1 100);do curl -fsS "http://127.0.0.1:${port}/index.html" >/dev/null&&break;sleep .1;done; cd "$ROOT/browser-node"; set +e; node perf.mjs "$p" "http://127.0.0.1:${port}/index.html" "$out" optimized 12 30000 during; local rc=$?; set -e; kill "$pid" 2>/dev/null||true;wait "$pid" 2>/dev/null||true;return "$rc"; }
          run_one "$ROOT/test/ya" yandex 8290 "$ROOT/out/yandex-performance.json"
          run_one "$ROOT/test/pg" playgama 8291 "$ROOT/out/playgama-performance.json"

      - name: Paired AI health performance and autonomy gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          out=Path('/tmp/v7paired/out')
          fatal_ai=re.compile(r'no suitable ai|dummy[\x27 ]+ai|script died unexpectedly|the script died|incomplete ai compatibility',re.I)
          rows={}
          for p in ('yandex','playgama'):
              smoke=json.loads((out/f'{p}-smoke.json').read_text()); d=json.loads((out/f'{p}-performance.json').read_text())
              if not smoke.get('passed'): raise SystemExit(f'{p}: smoke failed: {smoke.get("failure")}')
              if not d.get('passed'): raise SystemExit(f'{p}: performance harness failed: {d.get("failure")}')
              tail=list((d.get('console') or {}).get('tail') or [])
              fatal=[line for line in tail if fatal_ai.search(str(line))]
              if fatal: raise SystemExit(f'{p}: fatal AI diagnostics present: {fatal}')
              if (d.get('console') or {}).get('pageErrors'): raise SystemExit(f'{p}: page errors present')
              s=d['ai14']['snapshot']; a=d.get('aiScheduler') or {}; r=d.get('renderer') or {}; u=r.get('upload') or {}; g=d.get('generation') or {}; n=d.get('network') or {}
              checks=[(a.get('activeAI')==14,'activeAI'),(a.get('configuredOpcodeBudget')==10000,'configured budget'),(a.get('effectiveOpcodeBudget')==4285,'effective budget'),(r.get('active') is True,'renderer'),(u.get('webgl2') is True,'WebGL2'),(u.get('zeroCopyRectUploads',0)>0,'zero-copy'),(u.get('packedRectUploads',0)==0,'packed fallback'),(not n.get('failedRequests'),'failed requests'),(not n.get('blockedExternal'),'blocked external')]
              for ok,name in checks:
                  if not ok: raise SystemExit(f'{p}: {name} gate failed')
              row={'generationMs':g.get('wallMsUntilResponsive'),'blockMs':g.get('mainThreadProbeBlockedMs'),'fps':s.get('estimatedFps',0),'p50':s.get('p50FrameGapMs',999),'p95':s.get('p95FrameGapMs',999),'p99':s.get('p99FrameGapMs',999),'longTasks':s.get('longTaskCount',999),'longestLongTaskMs':s.get('longestLongTaskMs',999999),'heap':s.get('wasmHeapBytes'),'activeAI':a.get('activeAI'),'fatalAI':fatal,'zeroCopy':u.get('zeroCopyRectUploads',0)}
              if row['generationMs'] is None or row['generationMs']>26000: raise SystemExit(f'{p}: generation regression {row["generationMs"]}')
              if row['blockMs'] is None or row['blockMs']>25500: raise SystemExit(f'{p}: generation block regression {row["blockMs"]}')
              if row['fps']<44: raise SystemExit(f'{p}: runner/product FPS floor failed {row["fps"]}')
              if row['p95']>33.5 or row['p99']>50: raise SystemExit(f'{p}: frame-tail regression {row["p95"]}/{row["p99"]}')
              if row['heap'] is None or row['heap']>448_000_000: raise SystemExit(f'{p}: heap regression {row["heap"]}')
              rows[p]=row
          ya=rows['yandex']; pg=rows['playgama']
          fps_ratio=pg['fps']/ya['fps'] if ya['fps'] else 0
          gen_ratio=pg['generationMs']/ya['generationMs'] if ya['generationMs'] else 999
          block_ratio=pg['blockMs']/ya['blockMs'] if ya['blockMs'] else 999
          if fps_ratio<0.93: raise SystemExit(f'paired FPS regression: Playgama/Yandex={fps_ratio:.4f}')
          if gen_ratio>1.08: raise SystemExit(f'paired generation regression: Playgama/Yandex={gen_ratio:.4f}')
          if block_ratio>1.08: raise SystemExit(f'paired block regression: Playgama/Yandex={block_ratio:.4f}')
          report={'candidate':'OpenTTD v14 FINAL v7 paired-validated','artifactId':9767962504,'platforms':rows,'paired':{'fpsRatioPlaygamaToYandex':fps_ratio,'generationRatioPlaygamaToYandex':gen_ratio,'blockRatioPlaygamaToYandex':block_ratio},'aiHealth':'clean'}
          (out/'V7-PAIRED-FINAL.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          md=['# OpenTTD v14 FINAL v7 — paired validation','']
          for p,x in rows.items(): md += [f'## {p}',f'- generation: {x["generationMs"]:.0f} ms',f'- main-thread block: {x["blockMs"]:.0f} ms',f'- 14-AI FPS: {x["fps"]:.2f}',f'- p95 / p99: {x["p95"]:.2f} / {x["p99"]:.2f} ms',f'- long tasks: {x["longTasks"]}',f'- heap: {x["heap"]} B',f'- fatal AI diagnostics: 0',f'- WebGL2 zero-copy uploads: {x["zeroCopy"]}','']
          md += [f'- paired FPS ratio Playgama/Yandex: {fps_ratio:.4f}',f'- paired generation ratio Playgama/Yandex: {gen_ratio:.4f}',f'- paired block ratio Playgama/Yandex: {block_ratio:.4f}']
          (out/'V7-PAIRED-FINAL.md').write_text('\n'.join(md),encoding='utf-8')
          print('\n'.join(md))
          PY
          cd /tmp/v7paired/out
          sha256sum -c SHA256SUMS.txt
          unzip -tq OpenTTD-v14-Yandex-v7-FINAL.zip
          unzip -tq OpenTTD-v14-Playgama-v7-FINAL.zip

      - name: Upload paired-validated v7
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openttd-v14-FINAL-v7-paired-validated
          compression-level: 0
          path: /tmp/v7paired/out/
          if-no-files-found: error
