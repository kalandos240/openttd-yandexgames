name: Verify v14 Playgama offline core

on:
  push:
    branches:
      - fix/v14-profiler-performance
    paths:
      - '.github/workflows/verify-v14-playgama-offline-core.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  offline-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PERFORMANCE_PG_ARTIFACT_ID: '9739344235'
    steps:
      - uses: actions/checkout@v4

      - name: Download exact performance-fixed Playgama archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/art /tmp/game
          curl -fL --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PERFORMANCE_PG_ARTIFACT_ID}/zip" \
            -o /tmp/artifact.zip
          unzip -q /tmp/artifact.zip -d /tmp/art
          ZIP="$(find /tmp/art -maxdepth 1 -type f -name 'openttd-playgama-v14-performance-fixed.zip' -print -quit)"
          test -s "$ZIP"
          unzip -q "$ZIP" -d /tmp/game
          test -s /tmp/game/platform-bridge-loader.js
          grep -Fq 'https://bridge.playgama.com/v1.31.0/playgama-bridge.js' /tmp/game/platform-bridge-loader.js
          ! grep -Fq 'bridge.playgama.com' /tmp/game/index.html

      - name: Install browser controller
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/node
          cd /tmp/node
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund puppeteer-core@24.16.0

      - name: Start exact production package with external network blocked
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          cd /tmp/game
          python3 -m http.server 8144 --bind 127.0.0.1 >/tmp/offline-core-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do curl -fsS http://127.0.0.1:8144/index.html >/dev/null && break; sleep 0.1; done
          cd /tmp/node
          cat > probe.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';

          const browser = await puppeteer.launch({
            executablePath: process.env.CHROME_BIN,
            headless: true,
            args: [
              '--no-sandbox', '--disable-dev-shm-usage',
              '--use-angle=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist',
              '--autoplay-policy=no-user-gesture-required', '--disable-background-networking',
            ],
          });
          const page = await browser.newPage();
          await page.setViewport({width:1280,height:720,deviceScaleFactor:1});
          const blockedExternal = [];
          const pageErrors = [];
          const responses = new Map();
          page.on('pageerror', e => pageErrors.push(String(e?.stack || e)));
          page.on('response', r => { try { responses.set(new URL(r.url()).pathname, r.status()); } catch (_) {} });
          await page.setRequestInterception(true);
          page.on('request', req => {
            try {
              const u = new URL(req.url());
              if ((u.protocol === 'http:' || u.protocol === 'https:') && !['127.0.0.1','localhost'].includes(u.hostname)) {
                blockedExternal.push(req.url());
                req.abort('blockedbyclient');
                return;
              }
            } catch (_) {}
            req.continue();
          });

          await page.goto('http://127.0.0.1:8144/index.html', {waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForFunction(() => window.Module?.calledRun === true, {timeout:60000,polling:100});
          await new Promise(r => setTimeout(r, 3000));
          const result = await page.evaluate(async () => {
            const canvas = document.getElementById('canvas');
            const start = performance.now();
            let frames = 0;
            await new Promise(resolve => {
              const tick = () => {
                frames++;
                if (performance.now() - start >= 2000) resolve();
                else requestAnimationFrame(tick);
              };
              requestAnimationFrame(tick);
            });
            const elapsed = performance.now() - start;
            return {
              calledRun: !!window.Module?.calledRun,
              webglPresenter: !!window.Module?.SDL2?.__openttdWebGLPresenter,
              canvasWidth: canvas?.width || 0,
              canvasHeight: canvas?.height || 0,
              rafFps: frames * 1000 / elapsed,
              bridgeReady: document.documentElement.dataset.playgamaBridge || '',
            };
          });
          const report = {result, blockedExternal, pageErrors, responses:Object.fromEntries(responses)};
          fs.writeFileSync('/tmp/playgama-offline-core.json', JSON.stringify(report,null,2));
          await page.screenshot({path:'/tmp/playgama-offline-core.png'});
          console.log(JSON.stringify(report,null,2));

          if (!result.calledRun) throw new Error('OpenTTD core did not enter main');
          if (result.canvasWidth !== 1280 || result.canvasHeight !== 720) throw new Error(`Unexpected canvas ${result.canvasWidth}x${result.canvasHeight}`);
          if (!result.webglPresenter) throw new Error('WebGL presenter did not initialize');
          if (result.rafFps < 50) throw new Error(`Browser presentation cadence below 50 FPS: ${result.rafFps}`);
          if (!blockedExternal.some(u => u.includes('bridge.playgama.com/v1.31.0/playgama-bridge.js'))) throw new Error('Expected Playgama Bridge request was not blocked');
          if (responses.get('/openttd-runtime.js') !== 200 || responses.get('/openttd.wasm') !== 200 || responses.get('/openttd.data') !== 200) throw new Error('Core local runtime resources did not all return 200');
          if (pageErrors.length) throw new Error(`Page errors: ${pageErrors.join('\n')}`);
          await browser.close();
          JS
          node probe.mjs
          kill "$SERVER_PID" 2>/dev/null || true
          trap - EXIT

      - name: Upload offline-core evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openttd-v14-playgama-offline-core-evidence
          if-no-files-found: ignore
          path: |
            /tmp/playgama-offline-core.json
            /tmp/playgama-offline-core.png
            /tmp/offline-core-http.log
